name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &docs-paths
      - 'docs/**'
      - '*.md'
      - '.agents/roles/**'
      - '.claude/skills/**'
      - '.agents/**'
      - 'scripts/adr.py'
      - 'scripts/design_sections.py'
      - 'scripts/docs.py'
      - 'scripts/repo_paths.py'
      - 'scripts/check_agents.py'
      - 'tests/scripts/test_adr.py'
      - 'tests/scripts/test_design_sections.py'
      - 'tests/scripts/test_docs.py'
      - 'justfile'
      - '.python-version'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.gitignore'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *docs-paths

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: '0.13.7'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Prepare documentation tools and isolated tests
        run: |
          export PATH="$RUNNER_TEMP/docs-bin:$PATH"
          just bootstrap-docs --hosted-bin-dir "$RUNNER_TEMP/docs-bin"
          echo "$RUNNER_TEMP/docs-bin" >> "$GITHUB_PATH"
      - name: Test and build documentation
        run: |
          just docs-test
          UV_LOCKED=0 uv run --no-project --offline --no-python-downloads python scripts/docs.py check --base-url /corpus-structure/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-structure-docs
          path: build/docs/site/
          include-hidden-files: true # tracked process pages preserve .claude/ paths
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: build/docs/site/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
