id: https://corpus-structure.dev/domains/statistics/terminology
name: statistics_terminology
imports:
- semantic_core
prefixes:
  st: https://corpus-structure.dev/domains/statistics/terminology/
  STATO: http://purl.obolibrary.org/obo/STATO_
default_prefix: st
default_range: string
classes:
  StatisticalTerminologyFields:
    description: Optional source-located statistical interpretations. These fields neither identify parameterizations nor merge global corpus entities. Populated bindings require independent source evidence.
    attributes:
      distribution_family:
        range: StatisticalDistributionFamily
        description: Which mathematical probability distribution a source-located record discusses.
      distribution_attribute:
        range: StatisticalDistributionAttribute
        description: A characteristic of a mathematical probability distribution; sample estimators and local measurement roles remain distinct.
  InterpretationSourceRecord:
    is_a: SourceRecordProduct
    description: Exact retained reading selected under an immutable native source cut; no run or task provenance.
    attributes:
      project_id: {required: true}
      demand_id: {required: true}
      read_id: {required: true}
      cut_id: {required: true}
      release_id: {required: true}
      runtime_id: {required: true}
      read_scope_json: {required: true}
      product_id: {required: true}
      member_id: {required: true}
      kind_contract: {required: true}
      family_contract: {required: true}
      record_id: {required: true}
      interpretation_id: {required: true}
      source_pin: {range: RecordSourcePin, inlined: true, required: true}
  InterpretationFieldFocus:
    is_a: SourceRecordProduct
    attributes:
      role:
        required: true
      anchor_id:
        required: true
      start:
        range: integer
        minimum_value: 0
        required: true
      end:
        range: integer
        minimum_value: 1
        required: true
      source_piece:
        required: true
  InterpretationCandidate:
    is_a: SourceRecordProduct
    attributes:
      value:
        required: true
      meaning:
        required: true
      label:
        required: true
      matching_field:
        required: true
      matching_predicate:
        required: true
  TerminologyFieldDecision:
    is_a: SourceRecordProduct
    attributes:
      field:
        range: TerminologyFieldName
        required: true
      focus:
        range: InterpretationFieldFocus
        inlined: true
        required: true
      candidates:
        range: InterpretationCandidate
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
      outcome:
        range: InterpretationDecisionOutcome
        required: true
      selected_value: {}
      mapping_predicate: {}
      mapping_direction: {}
      assessment:
        required: true
      reviewer:
        required: true
  TerminologyInterpretationPayload:
    is_a: SourceRecordProduct
    attributes:
      source_record:
        range: InterpretationSourceRecord
        inlined: true
        required: true
      vocabulary_release:
        required: true
      metadata_digest:
        required: true
      lookup_policy:
        equals_string: released-lexical-1
        required: true
      decisions:
        range: TerminologyFieldDecision
        multivalued: true
        inlined: true
        minimum_cardinality: 1
        required: true
  MeasurementInterpretationPayload:
    is_a: SourceRecordProduct
    attributes:
      source_record:
        range: InterpretationSourceRecord
        inlined: true
        required: true
      focus:
        range: InterpretationFieldFocus
        inlined: true
        required: true
      vocabulary_release:
        required: true
      metadata_digest:
        required: true
      outcome:
        range: InterpretationDecisionOutcome
        required: true
      unit:
        range: RecognizedTimeUnit
      quantity_kind:
        range: RecognizedQuantityKind
      basis_status:
        range: InterpretationBasisStatus
        required: true
      basis: {}
      assessment:
        required: true
      reviewer:
        required: true
      numerical_equivalence:
        equals_string: unassessed
        required: true
  DdoAuthoredTerminologyJudgment:
    is_a: TerminologyInterpretationPayload
    description: Private actual authored input; neither a computed reading nor accepted knowledge.
    attributes:
      standing: {required: true, equals_string: private_authored_judgment}
      judgment_type: {required: true, equals_string: terminology.interpretation}
  DdoAuthoredMeasurementJudgment:
    is_a: MeasurementInterpretationPayload
    description: Private actual authored input; unit and basis alternatives remain separate without numerical conversion.
    attributes:
      standing: {required: true, equals_string: private_authored_judgment}
      judgment_type: {required: true, equals_string: measurement.interpretation}

enums:
  StatisticalDistributionFamily:
    permissible_values:
      hypergeometric: {meaning: 'STATO:0000060'}
      normal: {meaning: 'STATO:0000227'}
      binomial: {meaning: 'STATO:0000276'}
      poisson: {meaning: 'STATO:0000051'}
      gamma: {meaning: 'STATO:0000268'}
      exponential: {meaning: 'STATO:0000160'}
  StatisticalDistributionAttribute:
    permissible_values:
      expected_value: {meaning: 'STATO:0000692'}
      variance: {meaning: 'STATO:0000693'}
      standard_deviation: {meaning: 'STATO:0000694'}
  TerminologyFieldName:
    permissible_values:
      distribution_family: {}
      distribution_attribute: {}
  InterpretationDecisionOutcome:
    permissible_values:
      selected: {}
      unresolved: {}
      no_match: {}
  InterpretationBasisStatus:
    permissible_values:
      identified: {}
      unknown: {}
  RecognizedTimeUnit:
    permissible_values:
      SECOND: {}
      MILLISECOND: {}
      HOUR: {}
  RecognizedQuantityKind:
    permissible_values:
      TIME: {}
