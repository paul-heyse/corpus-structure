[project]
name = "corpus-evidence"
version = "0.1.0"
description = "Records of finalized evidence: typed records, generated indexes, a DuckDB catalog and generated reports (ADR-0010)."
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.14.1",
    "duckdb==2.0.0",
    "jinja2==3.1.6",
    "pyarrow==26.0.0",
]

[project.scripts]
corpus-evidence = "corpus_evidence.cli:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "corpus_evidence"
