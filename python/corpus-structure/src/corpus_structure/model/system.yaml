id: https://corpus-structure.dev/system
name: system
title: System schema
description: >-
  The system module of the corpus-structure model (ADR-0020): the classes of D3's meta, ops, kb and
  eval schemas with their closed sets, invariants and relationships; the payload classes of their
  JSONB columns; the source-profile class; the EmbeddingSpec; and the unit-feature vocabulary of
  agent_reuse by_unit. System classes are tables unless ci:store says otherwise; their table is the
  snake case of the class name (or the native local_names sql entry) in the schema their subset
  names; a single-valued class-ranged attribute is a foreign key column named <attribute>_id.
version: 0.5.0
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml: https://w3id.org/linkml/
  ci: https://corpus-structure.dev/ci/
  core: https://corpus-structure.dev/core/
  sys: https://corpus-structure.dev/system/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: sys
default_range: string
imports:
  - linkml:types
  - core

types:
  Id:
    typeof: integer
    uri: xsd:long
    description: A generated bigint row id, or a bigint reference without a foreign key.
  SmallInt:
    typeof: integer
    uri: xsd:short
    description: A small integer (smallint).
  Real:
    typeof: float
    uri: xsd:float
    description: A single-precision float (real).
  Double:
    typeof: double
    description: A double-precision float (double precision).
  Bytes:
    typeof: string
    description: Raw bytes (bytea), such as a serialized Arrow schema.
    annotations: {ci:sql_type: bytea}
  Json:
    typeof: string
    description: An opaque JSON document (jsonb) whose structure the model does not declare.
    annotations: {ci:sql_type: jsonb, ci:py_type: JsonValue}
  Score:
    typeof: Real
    minimum_value: 0
    maximum_value: 1
    description: A score in [0, 1].
  TsConfig:
    typeof: string
    description: A text-search configuration name (regconfig).
    annotations: {ci:sql_type: regconfig}
  HalfVec:
    typeof: string
    description: A half-precision vector (pgvector halfvec), of the EmbeddingSpec's dimension.
    annotations: {ci:sql_type: halfvec}

subsets:
  meta: {description: Tables in the meta schema (D3 §3).}
  ops: {description: Tables in the ops schema (D3 §4).}
  kb: {description: Tables in the kb schema (D3 §5).}
  eval: {description: Tables in the eval schema (D3 §7).}
  # member properties of ConfidenceState: the states each ConfidenceSource member has (D5 §6.2);
  # each names its consumer (ADR-0023), the confidence model and the policy's confidence block
  encoders_state:
    description: "Member property of ConfidenceState: a state of the encoders source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  patterns_state:
    description: "Member property of ConfidenceState: a state of the patterns source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  local_llm_state:
    description: "Member property of ConfidenceState: a state of the local_llm source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  agent_state:
    description: "Member property of ConfidenceState: a state of the agent source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  local_llm_judge_state:
    description: "Member property of ConfidenceState: a state of the local_llm_judge source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  rules_state:
    description: "Member property of ConfidenceState: a state of the rules source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  verifiers_state:
    description: "Member property of ConfidenceState: a state of the verifiers source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  author_markup_state:
    description: "Member property of ConfidenceState: a state of the author_markup source."
    annotations: {ci:consumer: "consolidation confidence states (D5 §6.2, §6.3); policy confidence block (D6 §7.1)"}
  consolidation_drop:
    description: "Member property of DropReason: a drop consolidation decides after keying, never keying or parse."
    annotations: {ci:consumer: "consolidation's drops after keying (consolidate/assemble.py); keying's coverage test (tests/core/test_dispatch.py) covers the other members"}

classes:
  # ---- nested classes of the JSONB columns (D3 §6) ----
  RunOptions:
    description: >-
      The run's options (orchestration §3.4), stored resolved in ops.run.options. agent_mode
      defaults to wait for kind slice and complete otherwise; no setting supplies it.
    annotations: {ci:store: nested, ci:payload: run_options}
    attributes:
      agent_mode: {range: AgentMode, required: true, description: Which agent tasks the run resolves (D6 §2).}
      agent_reuse: {range: AgentReuse, required: true, ifabsent: string(full), description: How M24's digest reads the guideline (D6 §4).}
      gpu_mode: {range: GpuMode, required: true, ifabsent: string(auto), description: The GPU mode as resolved (D6 §5).}
      corpus: {range: Json, required: true, description: The corpus slice and its expanded document keys (D6 §8).}
      scope: {range: Json, description: The scope slice with its expanded entries and their hash (D6 §8); absent for a run over its whole corpus.}
      fresh: {multivalued: true, description: Methods whose tasks skip reuse.}
      configs: {range: Json, required: true, description: "The resolved configuration map, <method>/<name> to config hash (orchestration §3.2).", annotations: {ci:py_type: "dict[str, str]"}}
      method_configs: {range: Json, required: true, description: "Method to configuration name, for this run only.", annotations: {ci:py_type: "dict[str, str]"}}
  InterventionRefs:
    description: >-
      `ops.intervention.refs`: the ids an intervention names, by what they reference (D3 §6.3). An
      extract or adjudicate intervention names its observations (a claim_proposal or judgment); a
      direction names nothing, its text being the body.
    annotations: {ci:store: nested, ci:payload: intervention_refs}
    attributes:
      observations: {range: Offset, multivalued: true, annotations: {ci:py_default: MISSING}, description: The observations it wrote (kb.observation ids).}
      golden_pass: {range: Offset, description: The golden pass it wrote (eval.golden_pass id).}
      schema_version: {range: Offset, description: The schema version it proposed (meta.schema_version id).}
      guideline_version: {range: Offset, description: The guideline version it proposed (meta.guideline_version id).}
      policy_version: {range: Offset, description: The policy version it proposed (ops.policy_version id).}
      experiment: {range: Offset, description: The experiment it decided (ops.experiment id).}
  TaskCost:
    description: >-
      `ops.task.cost`.
    annotations: {ci:store: nested, ci:payload: task_cost, ci:py_name: Cost}
    attributes:
      wall_ms: {range: Offset, required: true, description: Wall time in milliseconds; every task has one.}
      gpu_ms: {range: Offset, description: GPU time in milliseconds.}
      tokens_in: {range: Offset, description: Model input tokens.}
      tokens_out: {range: Offset, description: Model output tokens.}
      model: {description: The model that spent them.}
  TaskError:
    description: A failed task's detail, and an agent task's first rejected submission (D3 §4).
    annotations: {ci:store: nested}
    attributes:
      message: {description: The failure message.}
      detail: {range: Json, description: Structured failure detail., annotations: {ci:null: json}}
  TriggerMetrics:
    description: The metric values the triggering policy rule saw, exactly as evaluated (D3 §6.3).
    annotations: {ci:store: nested, ci:payload: trigger_metrics}
    attributes:
      values: {range: Json, description: Metric name to value., annotations: {ci:null: json}}
  PolicyAction:
    description: >-
      `ops.policy_rule.action`: a named configuration `<method>/<name>`, a limit, then.
    annotations: {ci:store: nested, ci:payload: policy_action}
    attributes:
      method: {required: true, pattern: "^[a-z][a-z0-9_.]*/[A-Za-z0-9_.-]+$", description: "A named configuration, <method>/<name>."}
      limit: {range: integer, minimum_value: 1, description: The most tasks the rule creates per iteration; absent means no rule-specific cap.}
      then: {range: PolicyThen, required: true, description: Whether the chain stops or continues.}
  InterventionTarget:
    description: >-
      `ops.intervention.target`; a `promotion` targets the run it promotes. `ref` is the target's
      key, or its id's decimal text for a target named by id (a run): the kind says which.
    annotations: {ci:store: nested, ci:payload: intervention_target}
    attributes:
      kind: {range: InterventionTargetKind, required: true, description: The target's kind.}
      ref: {range: NonEmpty, required: true, description: The target's key or id.}
  MentionRef:
    description: >-
      A mention by its task and ordinal; the task is absent inside the same task.
    annotations: {ci:store: nested}
    attributes:
      task: {range: Id, description: The task holding it; absent for the same task.}
      ordinal: {range: Offset, required: true, description: Its ordinal in that task.}
  ClaimQualifiers:
    description: >-
      kb.claim.qualifiers: the core qualifiers stored nested (hedge, conditions, scope, valid_time)
      and the schema qualifiers, by prefixed name (D3 §6.1).
    annotations: {ci:store: nested, ci:sql_visible: core:conditions}
    attributes:
      hedge: {range: PhraseValue, description: "The hedge qualifier, stored under core:hedge."}
      conditions: {range: Condition, description: "The condition tree under core:conditions; its claim nodes carry claim keys."}
      scope: {range: StoredScope, description: "The stored scope, under core:scope."}
      valid_time: {range: IntervalValue, description: "The valid time, under core:valid_time."}
  Completeness:
    description: A claim's completeness counts (kb.claim.completeness).
    annotations: {ci:store: nested}
    attributes:
      unresolved_symbols: {range: integer, description: Symbols left unresolved.}
      phrase_conditions: {range: integer, description: Conditions kept as phrases.}
  SegmentAttrs:
    description: A segment's author markup (D1 §3.2); id is read by D3 §9's queries.
    annotations: {ci:store: nested, ci:sql_visible: id}
    attributes:
      id: {description: The author's id of the block.}
      classes: {multivalued: true, description: The block's classes.}
  MacroTable:
    description: A rendition's macro table (D4 M01), name to macro definition.
    annotations: {ci:store: nested}
    attributes:
      macros: {range: Json, description: Macro name to definition., annotations: {ci:null: json}}
  FrameEntries:
    description: A citation frame (D1 §10.3), each sentence id to its locator and canonical text.
    annotations: {ci:store: nested, ci:payload: citation_frame, ci:py_type: CitationFrame}
    attributes:
      entries: {range: FrameEntry, multivalued: true, inlined: true, description: The cited sentences.}
  FrameEntry:
    description: One cited sentence of a frame.
    annotations: {ci:store: nested}
    attributes:
      sentence: {identifier: true, range: SentenceId, description: The sentence id.}
      locator: {range: Locator, required: true, description: The sentence's locator.}
      text: {required: true, description: Its canonical text.}
  GoldenBatchPayload:
    description: >-
      A golden pass's authored batch with one version of its citation frame (`eval.golden_pass` and
      `eval.citation_frame`, D3 §7): the shape the pass's `payload_schema_id` names for both.
    annotations: {ci:store: nested, ci:payload: golden_batch}
    attributes:
      batch: {range: Batch, required: true, annotations: {ci:py_type: AuthoredBatch}, description: "The model-facing batch as authored (pass c: as adjudicated)."}
      citation_frame: {range: FrameEntries, required: true, description: One version of the pass's citation frame.}

  # ---- observation payloads (D3 §6.2), one class per kind ----
  SpanPayload:
    abstract: true
    description: A payload span in the rendition's canonical text.
    annotations: {ci:store: nested, ci:invariant: "ordered(start, end)"}
    attributes:
      start: {range: Offset, required: true, description: Start offset.}
      end: {range: Offset, required: true, description: End offset.}
  LabelScore:
    description: A label with its score.
    annotations: {ci:store: nested}
    attributes:
      label: {required: true, description: The label.}
      score: {range: Score, required: true, description: "The score in [0, 1]."}
  GroupScore:
    is_a: LabelScore
    description: >-
      The label an attribute group chose for a mention, with its score, keyed by the group (D2 §5's
      span attribute groups: one enum with ci:extract attribute each).
    annotations: {ci:store: nested}
    attributes:
      group: {identifier: true, description: The attribute group.}
  SynthesizedClaim:
    description: >-
      The claim a block's containment states (the source profile's `details_kinds.synthesize`).
    annotations: {ci:store: nested}
    attributes:
      predicate: {range: PrefixedName, required: true, description: The prefixed predicate.}
      object: {any_of: [{range: Entity}, {range: Value}], required: true, description: The object., annotations: {ci:py_name: Object}}
      evidence: {range: Evidence, multivalued: true, required: true, minimum_cardinality: 1, inlined_as_list: true, description: The evidence.}
  AuthorMarkupPayload:
    description: Author markup on a segment (M01).
    annotations: {ci:store: nested, ci:payload: author_markup}
    attributes:
      markup: {range: MarkupKind, required: true, description: The markup's kind.}
      value: {range: Json, required: true, description: The markup's value., annotations: {ci:null: json}}
      target: {description: The link target.}
      synthesize: {range: SynthesizedClaim, description: The claim the block's containment states.}
  MentionPayload:
    is_a: SpanPayload
    description: A mention (M05-M07, M09).
    annotations: {ci:payload: mention}
    attributes:
      label: {required: true, description: The class label.}
      text: {required: true, description: The mention text.}
      attributes: {range: GroupScore, multivalued: true, inlined: true, annotations: {ci:py_type: "dict[str, LabelScore]", ci:py_default: MISSING}, description: Each attribute group to the label it chose and its score.}
      math_ref: {range: SegmentKey, description: "The segment key of the math span a mention lies in (D4 M06, M09)."}
      math: {range: Json, description: M09's decoration of a symbol occurrence., annotations: {ci:null: json, ci:py_type: "dict[str, JsonValue]"}}
  LabelledSpan:
    is_a: SpanPayload
    description: A labelled span of a relation.
    annotations: {ci:store: nested}
    attributes:
      label: {required: true, description: The label.}
  RelationPayload:
    description: A relation between two spans.
    annotations: {ci:store: nested, ci:payload: relation}
    attributes:
      label: {required: true, description: The relation label.}
      head: {range: LabelledSpan, required: true, description: The head span.}
      tail: {range: LabelledSpan, required: true, description: The tail span.}
      joint: {range: boolean, description: Extracted jointly.}
      feasible: {range: boolean, description: Feasible under the schema.}
  RecordField:
    is_a: SpanPayload
    description: A field of a record.
    annotations: {ci:store: nested}
    attributes:
      text: {required: true, description: The field text.}
      score: {range: Score, required: true, description: The score.}
  RecordPayload:
    description: A record structure.
    annotations: {ci:store: nested, ci:payload: record}
    attributes:
      structure: {required: true, description: The structure name.}
      fields: {range: Json, required: true, description: Field name to its spans., annotations: {ci:null: json, ci:py_type: "dict[str, tuple[RecordField, ...]]"}}
      anchor: {range: Json, description: The record's anchor., annotations: {ci:null: json}}
  AttributePayload:
    description: An attribute of a mention.
    annotations: {ci:store: nested, ci:payload: attribute}
    attributes:
      mention_ref: {range: MentionRef, required: true, description: The mention.}
      group: {required: true, description: The attribute group.}
      value: {range: Json, required: true, description: The value., annotations: {ci:null: json}}
  ClassificationPayload:
    description: A classification of a segment.
    annotations: {ci:store: nested, ci:payload: classification}
    attributes:
      task: {required: true, description: The classification task.}
      labels: {range: LabelScore, multivalued: true, required: true, inlined_as_list: true, description: The labels.}
      feasible: {range: boolean, description: Feasible under the schema.}
      violations: {range: Json, description: Violations., annotations: {ci:null: json}}
  ValuePayload:
    description: A parsed value (M11).
    annotations: {ci:store: nested, ci:payload: value}
    attributes:
      value: {range: Value, required: true, description: The stored value.}
      parse_error: {description: The parse error.}
      math_kind: {range: MathKind, description: The typed start symbol that read the span.}
  MentionAt:
    is_a: SpanPayload
    description: >-
      A mention ref with the mention's offsets, so a reused task's refs match by offsets.
    annotations: {ci:store: nested}
    attributes:
      mention_ref: {range: MentionRef, required: true, description: The mention.}
  ScopePayload:
    is_a: SpanPayload
    description: A binding site and its scope (M13).
    annotations: {ci:payload: scope}
    attributes:
      mention_ref: {range: MentionRef, required: true, description: The mention.}
      binding_site: {range: MentionAt, required: true, description: The binding site.}
      scope_segment: {range: NonEmpty, required: true, description: The scope segment's key.}
      extent: {range: ScopeExtent, required: true, description: The extent.}
      binding: {range: BindKind, description: The binding kind.}
      reopens: {range: MentionAt, description: The site it reopens.}
  NewEntity:
    description: A new entity a link proposes.
    annotations: {ci:store: nested}
    attributes:
      type: {required: true, description: The entity class.}
      label: {required: true, description: The label.}
  LinkPayload:
    description: >-
      An entity-link candidate: the mention (M14) or the pair (M15), and the candidate entity's key
      or the new entity it proposes, exactly one of each.
    annotations: {ci:store: nested, ci:payload: link, ci:invariant: "exactly_one(mention_ref, pair); exactly_one(candidate, new)"}
    attributes:
      mention_ref: {range: MentionRef, description: The mention (M14).}
      pair: {multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2, annotations: {ci:py_default: MISSING}, description: The pair (M15).}
      candidate: {range: NonEmpty, description: The candidate entity's key.}
      new: {range: NewEntity, description: The new entity the link proposes instead.}
      score: {range: Score, required: true, description: The score.}
      features: {range: Json, required: true, description: The features., annotations: {ci:null: json, ci:py_type: "dict[str, JsonValue]"}}
      rank: {range: integer, description: The rank.}
  RejectedItem:
    description: An item a submission rejected.
    annotations: {ci:store: nested}
    attributes:
      item: {range: Json, required: true, description: The item., annotations: {ci:null: json}}
      reason: {required: true, description: Why.}
  ClaimProposalPayload:
    description: >-
      A stored batch with its derivation (R06, DA-009): the schema version whose compiled models
      derived it, always; for authored proposals also the batch as written, its frame and the
      version of the quote cascade that located it, the three together. A derived claim's
      `derived_from` and `rule` are on the claim itself (M23).
    annotations:
      ci:store: nested
      ci:payload: claim_proposal
      ci:invariant: "together(authored, citation_frame, cascade_version)"
    attributes:
      batch: {range: Batch, required: true, description: The stored batch.}
      schema_version:
        required: true
        pattern: "^[0-9a-f]{64}$"
        description: The schema-version hash (D2 §2) whose compiled models derived the stored batch.
      authored: {range: Batch, description: The batch as authored., annotations: {ci:py_type: AuthoredBatch}}
      citation_frame: {range: FrameEntries, description: Its citation frame.}
      cascade_version: {range: NonEmpty, description: "The quote cascade's version that located an authored batch (D4 §4.3)."}
      rationale: {description: The rationale.}
      rejected: {range: RejectedItem, multivalued: true, inlined_as_list: true, description: Rejected items., annotations: {ci:py_default: MISSING}}
  JudgmentTarget:
    description: >-
      What a judgment is about: an observation by its id's decimal text, or a claim or group by its
      key with that key's scheme (readers compare keys only within one scheme or through a
      carry-over map; foundations §3.6).
    annotations: {ci:store: nested, ci:invariant: "iff_absent(key_scheme, kind = observation)"}
    attributes:
      kind: {range: JudgmentTargetKind, required: true, description: The target's kind.}
      ref: {range: NonEmpty, required: true, description: "The target's key, or an observation's id as decimal text."}
      key_scheme: {range: integer, minimum_value: 1, description: The key scheme of a key-named target.}
  JudgmentPayload:
    description: A decision under a guideline version.
    annotations: {ci:store: nested, ci:payload: judgment, ci:invariant: "iff_present(chosen, decision = choose)"}
    attributes:
      target: {range: JudgmentTarget, required: true, description: The target.}
      decision: {range: JudgmentDecision, required: true, description: The decision.}
      rationale: {required: true, description: The rationale.}
      guideline_version: {required: true, description: The guideline version.}
      chosen: {multivalued: true, annotations: {ci:py_default: MISSING}, description: The chosen members of a choose decision.}
      faithful: {range: boolean, description: Faithful to the source.}
      confidence: {range: JudgmentConfidence, description: The judge's confidence.}
  VerificationDetail:
    description: What M19 writes for a failing rule.
    annotations: {ci:store: nested}
    attributes:
      rule: {required: true, description: The rule id.}
      severity: {range: RuleSeverity, required: true, description: The severity.}
      message: {required: true, description: The message.}
  VerificationPayload:
    description: A verifier's verdict on a claim.
    annotations: {ci:store: nested, ci:payload: verification}
    attributes:
      claim_key: {required: true, description: The claim's key.}
      verifier: {required: true, description: The verifier.}
      verdict: {range: VerificationVerdict, required: true, description: The verdict.}
      detail: {range: Json, description: The detail., annotations: {ci:null: json, ci:py_type: "VerificationDetail | dict[str, JsonValue]"}}
      counterexample: {range: Json, description: A counterexample., annotations: {ci:null: json}}

  # ---- a build's diagnostics (kb.rendition_build.parse_detail; D4 M01) ----
  ParseDetail:
    description: >-
      An ingest build's diagnostics, never part of the rendition's content (D4 M01; D1 §3.2): kept
      on `kb.rendition_build`, never on segments, so they are outside the rendition's content
      digest.
    annotations: {ci:store: nested, ci:payload: parse_detail, ci:mixin: core.shape_support:ParseDetailMethods}
    attributes:
      encoding: {description: The encoding html5lib detected.}
      parser_errors: {range: ParserError, multivalued: true, inlined_as_list: true, description: The parser's errors with their positions.}
      data_loss_warnings: {range: integer, required: true, description: The parser's data-loss warnings (coerced names).}
      role_conflicts: {range: RoleConflict, multivalued: true, inlined_as_list: true, description: Elements claimed by two exclusive profile roles.}
      exclusions: {range: ExcludedElement, multivalued: true, inlined_as_list: true, description: "Excluded elements, per rule."}
      math_anomalies: {range: MathAnomaly, multivalued: true, inlined_as_list: true, description: Delimiting anomalies outside any span (stray closers).}
      orphans: {range: OrphanRun, multivalued: true, inlined_as_list: true, description: Text placed directly in a container.}
      unicode_changed: {range: UnicodeChange, multivalued: true, inlined_as_list: true, description: Text NFC normalization changed.}
      references_rendered: {range: integer, ifabsent: int(0), description: Empty reference links rendered.}
      macro_notes: {multivalued: true, description: What the macro reader did not take as written.}
      synthesize_notes: {multivalued: true, description: Declared containment claims a block could not carry.}
  ParserError:
    description: One html5lib parse error.
    annotations: {ci:store: nested}
    attributes:
      line: {range: integer, required: true, description: The line.}
      column: {range: integer, required: true, description: The column.}
      code: {required: true, description: html5lib's error code.}
  RoleConflict:
    description: An element two exclusive profile roles claim.
    annotations: {ci:store: nested}
    attributes:
      tag: {required: true, description: The element's tag.}
      classes: {multivalued: true, description: The element's classes.}
      roles: {multivalued: true, required: true, minimum_cardinality: 1, description: The roles that claim it.}
  ExcludedElement:
    description: >-
      An element a profile exclusion rule removed (excluded text is recorded per rule).
    annotations: {ci:store: nested}
    attributes:
      rule: {required: true, description: The exclusion rule's name.}
      tag: {required: true, description: The element's tag.}
      classes: {multivalued: true, description: The element's classes.}
      chars: {range: integer, required: true, description: The characters of its collapsed text.}
  MathAnomaly:
    description: >-
      A delimiting anomaly outside any math span (a stray closer).
    annotations: {ci:store: nested}
    attributes:
      kind: {required: true, description: "The anomaly: stray closer."}
      delimiter: {required: true, description: The delimiter.}
      context: {required: true, description: The text around it.}
  OrphanRun:
    description: >-
      Text placed directly in a container, kept as an orphan paragraph.
    annotations: {ci:store: nested}
    attributes:
      container: {range: SegmentKind, required: true, description: The container's segment kind.}
      text: {required: true, description: Its opening text.}
      sourceline: {range: integer, description: "The container's source line, when the parser gives one."}
  UnicodeChange:
    description: A chunk of text NFC normalization changed.
    annotations: {ci:store: nested}
    attributes:
      before: {required: true, description: The chunk before.}
      after: {required: true, description: The chunk after.}

  # ---- the source profile (RC12; D2 §12.1), typed against core vocabulary ----
  SourceProfile:
    description: >-
      A source's HTML conventions and its place in the corpus (`sources/<profile>.yaml`; D2 §12.1,
      D4 M01).
    annotations:
      ci:store: nested
      ci:validator: ingest.profile_support:consistent
      ci:mixin: ingest.profile_support:SourceProfileMethods
    attributes:
      version: {range: NonEmpty, required: true, description: The profile's version.}
      root: {range: NonEmpty, required: true, description: The source's directory under the corpus root., annotations: {ci:validator: ingest.profile_support:relative_root}}
      index: {range: CorpusIndex, annotations: {ci:py_default: None}, description: The corpus index that ci project init reads.}
      language: {range: TsConfig, ifabsent: string(english), description: The segments' text-search configuration.}
      applies_to: {range: NonEmpty, required: true, description: The glob of the source's pages.}
      encoding: {range: NonEmpty, ifabsent: string(sniff), description: "sniff (WHATWG sniffing on the original bytes) or an explicit encoding label; a label is not implemented yet."}
      exclude: {range: ExcludeRule, multivalued: true, inlined: true, annotations: {ci:py_default: '(ExcludeRule(name="scripts", selector="script, noscript"),)'}, description: "CSS selectors whose text is excluded, by rule name."}
      title: {range: NonEmpty, ifabsent: string(h1), description: The title selector.}
      sections: {range: NonEmpty, multivalued: true, annotations: {ci:py_default: '("h1", "h2", "h3", "h4", "h5", "h6")'}, description: "Heading selectors that open sections, by level."}
      section_source: {range: SectionSource, ifabsent: string(body), description: Where section headings come from; layout is not implemented yet.}
      unit: {range: NonEmpty, description: The annotation unit selector., annotations: {ci:py_default: None}}
      layout: {range: NonEmpty, multivalued: true, description: Selectors of tables used for layout (read as blocks); not implemented yet.}
      block_hints: {range: BlockHint, multivalued: true, inlined: true, description: Statement-kind hints by block selector.}
      section_hints: {range: SectionHint, multivalued: true, inlined: true, description: Statement kinds of units under section titles.}
      details_kinds: {range: DetailsKinds, annotations: {ci:py_default: DetailsKinds(default=StatementKind.PROOF)}, description: Statement kinds of details blocks.}
      math: {range: MathSpec, description: Math delimiters and the page macro selector.}
      references: {range: ReferenceSpec, annotations: {ci:py_default: None}, description: Reference selectors and their rendering.}
      render: {range: RenderSpec, description: Rendering rules.}
      verbatim: {range: NonEmpty, multivalued: true, description: Selectors whose whitespace is kept; not implemented yet.}
      img_alt: {range: boolean, annotations: {ci:py_default: None}, description: "Whether img[alt] text is rendered as text; true is not implemented yet."}
      orphan_text: {range: SegmentKind, ifabsent: string(paragraph), description: The kind of segment orphan text becomes.}
  CorpusIndex:
    description: The corpus index of a source profile.
    annotations: {ci:store: nested}
    attributes:
      file: {range: NonEmpty, required: true, description: "The index file, relative to the corpus root."}
      page: {range: NonEmpty, required: true, description: The column holding the page.}
      first_pass: {description: The column marking first-pass pages., annotations: {ci:py_default: None}}
  BlockHint:
    description: A statement-kind hint for blocks of one selector.
    annotations: {ci:store: nested}
    attributes:
      selector: {range: NonEmpty, identifier: true, description: The block selector.}
      statement_kind: {range: StatementKind, required: true, description: The statement kind., annotations: {ci:py_type: "StatementKind | str", ci:validator: before ingest.profile_support:statement_kind}}
      claim_bearing: {range: boolean, annotations: {ci:py_default: None}, description: "Whether such units state claims, overriding the kind."}
  SectionHint:
    description: The statement kind of units under a section title.
    annotations: {ci:store: nested}
    attributes:
      title: {range: NonEmpty, identifier: true, description: The section title.}
      statement_kind: {range: StatementKind, required: true, description: The statement kind., annotations: {ci:py_type: "StatementKind | str", ci:validator: before ingest.profile_support:statement_kind}}
  DetailsKinds:
    description: How details blocks become statements, and the claims their containment states.
    annotations:
      ci:store: nested
      ci:validator: ingest.profile_support:one_entry_per_key
      ci:mixin: ingest.profile_support:DetailsKindsMethods
    attributes:
      default: {range: StatementKind, required: true, description: The default kind., annotations: {ci:py_type: "StatementKind | str", ci:validator: before ingest.profile_support:statement_kind}}
      inside_example_or_exercise: {range: StatementKind, description: The kind inside an example or exercise., annotations: {ci:py_type: "StatementKind | str", ci:validator: before ingest.profile_support:statement_kind, ci:py_default: None}}
      by_summary: {range: SummaryKind, multivalued: true, inlined: true, description: Statement kinds by summary text.}
      synthesize: {range: SynthesisRule, multivalued: true, inlined: true, description: "Claims the containment states, by statement kind."}
  SynthesisRule:
    description: The claim a block's containment states (D5 §3.5).
    annotations: {ci:store: nested}
    attributes:
      statement_kind: {identifier: true, range: StatementKind, description: The block's statement kind., annotations: {ci:py_type: "StatementKind | str", ci:validator: before ingest.profile_support:statement_kind}}
      predicate: {required: true, description: The prefixed predicate., annotations: {ci:validator: before ingest.profile_support:predicate}}
      object: {range: SynthesisObject, required: true, description: What the object is.}
      evidence: {range: SynthesisEvidence, required: true, description: What the evidence is.}
  SummaryKind:
    description: The statement kind of details blocks with one summary text.
    annotations: {ci:store: nested}
    attributes:
      summary: {range: NonEmpty, identifier: true, description: The summary text.}
      statement_kind: {range: StatementKind, required: true, description: The statement kind., annotations: {ci:py_type: "StatementKind | str", ci:validator: before ingest.profile_support:statement_kind}}
  ExcludeRule:
    description: A named exclusion rule; excluded text is recorded per rule (D4 M01).
    annotations: {ci:store: nested}
    attributes:
      name: {range: NonEmpty, identifier: true, description: The rule's name.}
      selector: {range: NonEmpty, required: true, description: The CSS selector.}
  MathSpec:
    description: >-
      Math delimiters, bare display environments and the page macro source (D4 M01 `math`).
    annotations:
      ci:store: nested
      ci:validator: ingest.profile_support:delimiters
      ci:mixin: ingest.profile_support:MathSpecMethods
    attributes:
      inline: {multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2, description: "The inline opener and closer.", annotations: {ci:py_type: "tuple[str, str] | None", ci:py_default: '("\\(", "\\)")'}}
      display: {multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2, description: "The display opener and closer.", annotations: {ci:py_type: "tuple[str, str] | None", ci:py_default: '("\\[", "\\]")'}}
      display_environments: {multivalued: true, description: Environments that are display math when bare.}
      page_macros: {range: NonEmpty, description: The selector of the page's macro source., annotations: {ci:py_default: None}}
  ReferenceSpec:
    description: >-
      In-text reference links and their rendering (D1 §3.1; D4 M01 `references`).
    annotations: {ci:store: nested}
    attributes:
      selector: {range: NonEmpty, required: true, description: The reference link selector.}
      render: {range: ReferenceRender, ifabsent: string(browser), description: How an empty reference renders.}
  RenderSpec:
    description: >-
      Rendering conventions for script- or style-produced text (D4 M01 `render`).
    annotations: {ci:store: nested}
    attributes:
      q: {range: QuoteRender, ifabsent: string(bare), description: How q content renders.}
      list_markers: {range: ListMarkerRule, multivalued: true, inlined: true, description: List markers by list selector.}
      summary: {range: SummaryRender, ifabsent: string(heading), description: How a details summary renders.}
      figure: {range: FigureRender, ifabsent: string(caption), description: How a figure renders.}
  ListMarkerRule:
    description: The item markers of the lists one selector matches.
    annotations: {ci:store: nested}
    attributes:
      selector: {range: NonEmpty, identifier: true, description: The list selector.}
      style: {range: ListMarkerStyle, required: true, description: The marker style.}

  # ---- embeddings and the unit-feature vocabulary ----
  EmbeddingSpec:
    description: An embedding model's specification (D3 §5, kb.embedding; OPEN-D3-2).
    annotations: {ci:store: nested}
    attributes:
      model: {required: true, description: The model id and revision.}
      dimension: {range: integer, required: true, description: "The dimension: 1024 or 2048."}
      metric: {range: EmbeddingMetric, required: true, description: The distance metric.}
      family_id: {required: true, description: The family whose embeddings are comparable.}
  UnitFeature:
    description: >-
      One feature a guideline section declares it applies to (agent_reuse by_unit; D2 §10, D6 §4):
      a segment kind, a statement kind, or the claim_bearing hint.
    annotations: {ci:store: nested}
    attributes:
      feature: {range: UnitFeatureKind, required: true, description: The feature.}
      value: {description: "The member it names: a SegmentKind or StatementKind member; absent for claim_bearing."}

  # ---- compiled artifacts (D2 §7; D3 §3) ----
  CompiledArtifactBody:
    description: >-
      The body of a meta.compiled_artifact row: one compiler's output for one schema version, any
      JSON (a text artifact is a JSON string). An artifact is identified by its schema version,
      compiler, compiler version and kind, and its body by its hash, so the registry holds one
      payload schema for every body.
    annotations: {ci:store: nested, ci:payload: compiled_artifact}
    attributes:
      body: {range: Json, required: true, description: "The compiler's output.", annotations: {ci:null: json}}

  # ---- schema change (ADR-0022; model and projections §3.6) ----
  ChangeRecord:
    description: >-
      One revision step of the model (in model/revisions.yaml and meta.model_revision) or of a pack
      (meta.schema_version.migration): its element changes, each with its compatibility class, and
      the migration mapping, key consequences and affected artifacts (TM §9).
    annotations: {ci:store: nested}
    attributes:
      from_revision: {required: true, description: The parent revision's content hash or schema version.}
      to_revision: {required: true, description: The revision this step reaches.}
      changes: {range: ElementChange, multivalued: true, inlined_as_list: true, description: "The element changes, from the SchemaView diff."}
      name_map: {range: Json, description: "Old prefixed element path to new, for mapped changes (renames, splits, merges)."}
      alembic_revision: {description: The Alembic revision that realizes the relational changes.}
      key_consequences: {range: Json, description: "The key-scheme change, its carry-over map and the affected key prefixes."}
      judgment_carry_over: {range: Json, description: "By carry-over map, or orphaned with its report."}
      compiled_artifacts: {multivalued: true, description: "The (compiler, kind) artifacts the step affects."}
      source_profiles: {multivalued: true, description: The source profiles the step affects.}
  ElementChange:
    description: One element change of a step, with its declared class and why it is allowed.
    annotations: {ci:store: nested}
    attributes:
      element: {required: true, description: "The element's path: a prefixed class, slot (Class.slot), enum or member (Enum#member)."}
      change: {range: ChangeKind, required: true, description: "Added, removed or changed."}
      aspect: {description: "What changed of the element: range, required, description, a ci: declaration, …"}
      compatibility_class: {range: CompatibilityClass, required: true, description: The declared class; the classifier checks it against the diff.}
      reason: {required: true, description: Why the change is made.}
      authorized_by: {required: true, description: "The model rule permitting it, e.g. method_version:mention.gliner/3."}
      decision: {description: "The recorded decision that permits a breaking change (DP-24)."}
      upcaster: {description: "The upcast of a nested-additive change: absent, or a named upcaster."}

  # ---- tables (D3) ----
  ModelRevision:
    in_subset:
    - meta
    description: projection of model/revisions.yaml (D2 §2, §8); rows are added, never edited
    unique_keys:
      model_revision_content_hash:
        unique_key_slots:
        - content_hash
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      label:
        required: true
        description: LinkML version of core and system
      content_hash:
        required: true
        description: canonical JSON of the parsed core and system files (D2 §2)
      compilers:
        range: Json
        required: true
        description: compiler name → version
      key_scheme:
        range: integer
        required: true
        description: ci:key_scheme (D1 §10.1)
      parent:
        range: ModelRevision
        description: The parent id.
      change_record:
        range: ChangeRecord
        description: D2 §8; null for the first revision; the model source stays in Git
      created_at:
        range: Timestamp
        required: true
        description: The created at.
        annotations:
          ci:generated: insert_time
  PayloadSchema:
    in_subset:
    - meta
    description: one version of one nested payload class (D2 §8); rows are added, never edited
    annotations:
      ci:invariant: iff_absent(parent, compatibility_class = initial)
    unique_keys:
      payload_schema_class_version:
        unique_key_slots:
        - class
        - version
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      model_revision:
        range: ModelRevision
        required: true
        description: The model revision id.
      class:
        required: true
        description: prefixed class name, e.g. 'core:MentionPayload'
      kind:
        required: true
        description: 'what it is the payload of: an observation kind, a compiled-artifact kind, ...'
      version:
        range: integer
        required: true
        description: The version.
      parent:
        range: PayloadSchema
        description: The parent id.
      compatibility_class:
        range: CompatibilityClass
        required: true
        description: 'D2 §8: how this version follows its parent; initial for a version without one'
      json_schema_id:
        required: true
        description: $id of the generated JSON Schema
      arrow_schema:
        range: Bytes
        required: true
        description: Schema.serialize()
      sql_visible_paths:
        multivalued: true
        description: The sql visible paths.
      upcaster:
        description: the upcast from the parent version; null for an initial version
      reason:
        required: true
        description: The reason.
      authorized_by:
        required: true
        description: the model rule permitting the change, e.g. 'method_version:mention.gliner/3'
  Project:
    in_subset:
    - meta
    description: The meta.project table.
    unique_keys:
      project_name:
        unique_key_slots:
        - name
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      name:
        required: true
        description: The name.
      domain:
        required: true
        description: domain pack name, e.g. 'statistics'
      promoted_run:
        range: Run
        description: FK added after ops.run
      created_at:
        range: Timestamp
        required: true
        description: The created at.
        annotations:
          ci:generated: insert_time
  SchemaVersion:
    in_subset:
    - meta
    description: The meta.schema_version table.
    unique_keys:
      schema_version_project_content_hash:
        unique_key_slots:
        - project
        - content_hash
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      project:
        range: Project
        required: true
        description: The project id.
      domain:
        required: true
        description: The domain.
      label:
        required: true
        description: 'version: field of the YAML, e.g. ''0.1.0'''
      content_hash:
        required: true
        description: D2 §2; covers the model revision id
      model_revision:
        range: ModelRevision
        required: true
        description: the core the pack was compiled against
      parent:
        range: SchemaVersion
        description: The parent id.
      source:
        range: Json
        required: true
        description: 'the pack files'' text: {"statistics.yaml": "...", "rules.yaml": "...", "core/rules.yaml":
          "..."}; the core module is named by model_revision_id'
      migration:
        range: ChangeRecord
        description: the change record from the parent (D2 §8); null for a first version
      state:
        range: VersionState
        required: true
        ifabsent: string(active)
        description: The state.
      created_by:
        required: true
        description: '''human:operator'', ''agent:opus-5.5'', ...'
      created_at:
        range: Timestamp
        required: true
        description: The created at.
        annotations:
          ci:generated: insert_time
  CompiledArtifact:
    in_subset:
    - meta
    description: D2 §7 compiler outputs; rows are added, never edited
    unique_keys:
      compiled_artifact_schema_version_compiler_compiler_version_kind:
        unique_key_slots:
        - schema_version
        - compiler
        - compiler_version
        - kind
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      schema_version:
        range: SchemaVersion
        required: true
        description: The schema version id.
        annotations:
          ci:on_delete: cascade
      compiler:
        required: true
        description: '''json_schema'', ''gliner2'', ''rules'', ''annotator_reference'', ...'
      compiler_version:
        required: true
        description: The compiler version.
      kind:
        required: true
        description: which artifact of that compiler, e.g. 'batch.model_facing', 'batch.stored', 'batch.decoding'
      hash:
        required: true
        description: sha256 of canonical JSON of body (D1 §10.1); what method configurations reference
      body:
        range: Json
        required: true
        description: the artifact (a text artifact is a JSON string)
      payload_schema:
        range: PayloadSchema
        required: true
        description: the body's schema (D2 §8)
      created_at:
        range: Timestamp
        required: true
        description: The created at.
        annotations:
          ci:generated: insert_time
  SchemaClass:
    in_subset:
    - meta
    description: The meta.schema_class table.
    unique_keys:
      primary_key:
        unique_key_slots:
        - schema_version
        - name
        description: The primary key.
    attributes:
      schema_version:
        range: SchemaVersion
        required: true
        description: The schema version id.
        annotations:
          ci:on_delete: cascade
      name:
        required: true
        description: 'prefixed: ''stat:RandomVariable'', ''core:Statement'''
      parent:
        description: prefixed
      kind:
        range: SchemaClassKind
        required: true
        description: The kind.
      scope:
        range: EntityScope
        description: The scope.
      identity_keys:
        multivalued: true
        description: The identity keys.
      description:
        description: The description.
      annotations:
        range: Json
        required: true
        ifabsent: string({})
        description: The annotations.
  SchemaSlot:
    in_subset:
    - meta
    description: The meta.schema_slot table.
    unique_keys:
      primary_key:
        unique_key_slots:
        - schema_version
        - name
        description: The primary key.
    attributes:
      schema_version:
        range: SchemaVersion
        required: true
        description: The schema version id.
        annotations:
          ci:on_delete: cascade
      name:
        required: true
        description: 'prefixed: ''stat:has_distribution''; a class-local attribute ''<prefix>:<Class>.<attr>'',
          e.g. ''core:Formula.latex'''
      role:
        range: SlotRole
        required: true
        description: The role.
      domain_class:
        description: prefixed class name
      range:
        description: prefixed class or enum name, or a built-in type ('string', 'integer', ...)
      object_kind:
        description: 'derived from the range (D2 §3): formula, set, entity, enum, map, condition, ...'
      multivalued:
        range: boolean
        required: true
        ifabsent: 'false'
        description: The multivalued.
      qualifiers:
        multivalued: true
        description: The qualifiers.
      identity_qualifiers:
        multivalued: true
        description: The identity qualifiers.
      subsets:
        multivalued: true
        description: the named predicate subsets the slot belongs to (e.g. 'family_structure'; rules'
          subset:<name>)
      extract:
        description: The extract.
      description:
        description: The description.
      annotations:
        range: Json
        required: true
        ifabsent: string({})
        description: 'the slot''s scalar ci: annotations (ci:param_map, symmetric, ...)'
  SchemaEnum:
    in_subset:
    - meta
    description: The meta.schema_enum table.
    unique_keys:
      primary_key:
        unique_key_slots:
        - schema_version
        - name
        description: The primary key.
    attributes:
      schema_version:
        range: SchemaVersion
        required: true
        description: The schema version id.
        annotations:
          ci:on_delete: cascade
      name:
        required: true
        description: The name.
      values:
        range: Json
        required: true
        description: '[{"value": "scale", "description": "...", "annotations": {...}}]'
      annotations:
        range: Json
        required: true
        ifabsent: string({})
        description: The annotations.
  SchemaRule:
    in_subset:
    - meta
    description: The meta.schema_rule table.
    unique_keys:
      primary_key:
        unique_key_slots:
        - schema_version
        - rule_id
        description: The primary key.
    annotations:
      ci:invariant: iff_absent(severity, grp = derive); iff_absent(check_expr, grp = derive)
    attributes:
      schema_version:
        range: SchemaVersion
        required: true
        description: The schema version id.
        annotations:
          ci:on_delete: cascade
      rule_id:
        required: true
        description: The rule id.
      grp:
        range: RuleGroup
        required: true
        description: the rules.yaml section (D2 §7.4)
      applies_to:
        required: true
        multivalued: true
        description: the predicate set compiled from a predicate, a list, subset:<name> or any
      at:
        multivalued: true
        description: call sites, 'batch' and 'finalize' (D5 §8.2); empty for derive rules
      severity:
        range: RuleSeverity
        description: null for derive rules; always 'warning' in grp 'guideline'
      when_expr:
        required: true
        description: a derive rule's match condition
      check_expr:
        description: null for derive rules, whose templates stay in the compiled rules artifact
      description:
        description: The description.
  GuidelineVersion:
    in_subset:
    - meta
    description: The meta.guideline_version table.
    unique_keys:
      guideline_version_project_content_hash:
        unique_key_slots:
        - project
        - content_hash
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      project:
        range: Project
        required: true
        description: The project id.
      domain:
        required: true
        description: The domain.
      label:
        required: true
        description: The label.
      content_hash:
        required: true
        description: The content hash.
      body:
        required: true
        description: the guideline rules (D2 §10.1–§10.9); the generated reference and direction log are
          hashed elsewhere (D2 §10.10–§10.11)
      schema_version:
        range: SchemaVersion
        required: true
        description: The schema version id.
      parent:
        range: GuidelineVersion
        description: The parent id.
      change_note:
        description: The change note.
      state:
        range: VersionState
        required: true
        ifabsent: string(active)
        description: The state.
      created_by:
        required: true
        description: The created by.
      created_at:
        range: Timestamp
        required: true
        description: The created at.
        annotations:
          ci:generated: insert_time
  Method:
    in_subset:
    - ops
    description: The ops.method table.
    unique_keys:
      method_name_version:
        unique_key_slots:
        - name
        - version
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      name:
        required: true
        description: '''extract.gliner_schema'''
      version:
        required: true
        description: implementation version, bumped on behaviour change
      family:
        range: MethodFamily
        required: true
        description: The family.
      confidence_source:
        range: ConfidenceSource
        description: >-
          The source the method's observations contribute to confidence (D5 §6.2; DA-016); the
          policy's confidence blocks are keyed by it. Null for a method that contributes none.
      description:
        description: The description.
  MethodConfig:
    in_subset:
    - ops
    description: The ops.method_config table.
    unique_keys:
      method_config_config_hash:
        unique_key_slots:
        - config_hash
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      method:
        range: Method
        required: true
        description: The method id.
      name:
        required: true
        ifabsent: string(default)
        description: 'named configuration from methods.yaml: ''<method>/<name>'''
      params:
        range: Json
        required: true
        description: canonical JSON; its (compiler, kind) artifact references resolved to hashes for one
          schema version (§3)
      config_hash:
        required: true
        description: D1 §10.1 'cfg:' key
      tier:
        range: MethodTier
        description: The tier.
      created_at:
        range: Timestamp
        required: true
        description: The created at.
        annotations:
          ci:generated: insert_time
  PolicyVersion:
