  DropReason:
    description: "Why keying dropped a candidate or an alternative member (`core/keys.py`, D5 §5.2), or parse (A0) an item it could not place on a rendition; C1's PassReport counts by it."
    annotations: {ci:lifecycle: static}
    permissible_values:
      unknown_predicate: {description: "the schema does not know the claim's predicate"}
      segment_not_on_rendition: {description: "a segment key off this rendition"}
      unknown_reference: {description: "a reference to no candidate"}
      wrong_kind_reference: {description: "a reference naming a candidate of another kind than its position takes (an entity where a claim is named)"}
      uncited_reference: {description: "an external reference whose descriptor lies in no statement of the set"}
      dropped_dependency: {description: "a reference to a candidate keying dropped"}
      unknown_claim_ref: {description: "a claim reference (a condition `claim` node, a binding's claim) naming no candidate claim"}
      unknown_identity_entity: {description: "an identity slot naming no entity"}
      identity_cycle: {description: "entity identity slots that reference each other"}
      condition_cycle: {description: "claims whose conditions reference each other"}
      malformed_qualifier: {description: "a schema qualifier value that is no typed value"}
      malformed_value: {description: "a value with no canonical JSON form (a lone surrogate, keys equal after NFC)"}
      unlocated_quote: {description: "parse (A0): a quote the cascade did not locate and whose cited sentence is not on the rendition, so it has no span; or a claim left without a placed evidence quote or phrase"}
      unresolved_extent: {description: "parse (A0): a scope qualifier's or local entity's extent that resolves to no segment on the rendition"}
      orphaned_premise: {description: "consolidation: a supposed claim whose claims referencing it as a premise were all dropped (INV-06)", in_subset: [consolidation_drop]}
      malformed_evidence: {description: "consolidation: a stated claim with no primary evidence (INV-01)", in_subset: [consolidation_drop]}
  PassOutcome:
    description: "What a consolidation pass counts beside its drops (`consolidate/report.py`, consolidation §3.7); the PassReport counts by it."
    annotations: {ci:lifecycle: static}
    permissible_values:
      unreadable_proposal: {description: "a claim_proposal with no stored form on the run's rendition of its document; its items are not read"}
      linked: {description: "a global entity that took the key of the one reference-run entity whose alias matches its normalized label"}
      link_ambiguous: {description: "a global entity whose normalized label matches aliases of several reference-run entities; it keeps its own key"}
      rederived: {description: "a proposal located again on the run's rendition by parse (A0) from its authored batch and frame"}
