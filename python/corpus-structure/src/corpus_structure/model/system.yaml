        - local_ref
        description: Unique.
    attributes:
      id:
        identifier: true
        range: Id
        description: The id.
      golden_pass:
        range: EvalGoldenPass
        required: true
        description: the pass c it projects
        annotations:
          ci:on_delete: cascade
      citation_frame:
        range: CitationFrame
        required: true
        description: the frame version it was located through
      rendition:
        range: Rendition
        required: true
        description: The rendition id.
      cascade_version:
        required: true
        description: the quote cascade that derived it (D4 §4.3)
      schema_version:
        range: SchemaVersion
        required: true
        description: the schema version it was derived under (name maps applied, D2 §8)
      item_type:
        range: GoldenItemType
        required: true
        description: The item type.
      local_ref:
        required: true
        description: The local ref.
      payload:
        range: Json
        required: true
        description: 'a stored item: the core stored-form batch element (D1 §10.3, D2 §7.3), offsets into
          rendition_id'
      context:
        range: boolean
        required: true
        ifabsent: 'false'
        description: 'a context premise stated outside the unit: scored only through claim nodes here
          (D7 §5.1)'
