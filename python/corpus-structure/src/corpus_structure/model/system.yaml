enums:
  CompatibilityClass:
    description: >-
      How a step carries data across revisions (ADR-0022; model and projections §3.6); the class decides
      the route. `initial` marks a payload schema's first version, which has no parent and no route.
    annotations: {ci:lifecycle: static}
    permissible_values:
      initial: {description: A first version; no parent.}
      descriptive: {description: "Descriptions, examples, titles: a new revision, no DDL."}
      nested-additive: {description: "An optional field or closed-set member of a nested payload class no CHECK lists: a registry row with upcast absent; no DDL, no rewrite."}
      relational-additive: {description: "A column, table, static member, index, edge kind or newly sql_visible path: a generated Alembic revision."}
      version-scoped-additive: {description: "A pack's class, predicate, statement kind or member: a new schema version."}
      mapped: {description: "A rename, split or merge, by the change record's name map; authored artifacts are never rewritten."}
      key-bearing: {description: "An identity, canonical-form or key-part change: a new key scheme with carry-over."}
      breaking: {description: "A removal or narrowing without a mapping: refused unless a decision is recorded (DP-24)."}
  ChangeKind:
    description: What happened to an element between two revisions (ElementChange.change).
