id: https://corpus-structure.dev/semantic/data-operation-contextual
name: data_operation_contextual
prefixes:
  contextual: https://corpus-structure.dev/semantic/data-operation-contextual/
default_prefix: contextual
default_range: string
imports: [data_operation_candidate_inspection]
classes:
  DdoContextualTargetSelection:
    is_a: SourceRecordProduct
    attributes:
      source_selection: {required: true}
      scope: {required: true}
      effective_version: {}
      reliable_type: {}
      parent: {}
      targets: {range: SourceValue, inlined: true, required: true}
      semantic_targets: {range: SourceValue, inlined: true, required: true}
  DdoContextualInventory:
    is_a: SourceRecordProduct
    attributes:
      inventory: {range: SourceValue, inlined: true, required: true}
  DdoContextualTarget:
    is_a: SourceRecordProduct
    attributes:
      original_source: {value_presence: PRESENT, annotations: {cs:nullable: true}}
      descriptor: {range: SourceValue, inlined: true, required: true}
      semantic_target: {range: SourceValue, inlined: true, required: true}
  DdoContextualTargetMember:
    is_a: SourceRecordProduct
    attributes:
      original_source: {value_presence: PRESENT, annotations: {cs:nullable: true}}
      descriptor: {range: SourceValue, inlined: true, required: true}
      semantic_target: {range: SourceValue, inlined: true, required: true}
  DdoContextualTargetScope:
    is_a: SourceRecordProduct
    attributes:
      target_id: {required: true}
      source_binding: {required: true}
  DdoContextualTargetContext:
    is_a: SourceRecordProduct
    attributes:
      subject: {required: true}
      subject_definition: {required: true}
      original_source: {value_presence: PRESENT, annotations: {cs:nullable: true}}
      analyzed_scope: {range: DdoContextualTargetScope, inlined: true, required: true}
  DdoContextualTargetPacket:
    is_a: SourceRecordProduct
    attributes:
      member_id: {required: true}
      kind_contract: {required: true}
      context: {range: DdoContextualTargetContext, inlined: true, required: true}
      body: {range: DdoContextualTargetMember, inlined: true, required: true}
  DdoContextualTargetPopulation:
    is_a: SourceRecordProduct
    attributes:
      complete: {range: boolean, required: true}
      members: {range: DdoContextualTargetPacket, inlined_as_list: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
  DdoCuratedContextualTargets:
    is_a: SourceRecordProduct
    attributes:
      targets: {range: SourceValue, inlined: true, required: true}
  DdoContextualVector:
    is_a: SourceRecordProduct
    attributes:
      vector_id: {required: true}
      object_id: {required: true}
      source_binding: {required: true}
      profile_id: {required: true}
      input_digest: {required: true}
      representation_digest: {required: true}
      values: {range: float, multivalued: true, required: true, minimum_cardinality: 1}
  DdoContextualRenderedInput:
    is_a: SourceRecordProduct
    attributes:
      object_id: {required: true}
      source_binding: {required: true}
      role: {required: true, pattern: "^(query|document)$"}
      text: {required: true}
      final_input_digest: {required: true}
      truncated: {range: boolean, required: true}
      representation_digest: {required: true}
  DdoContextualVectorProduct:
    is_a: SourceRecordProduct
    attributes:
      original_source: {value_presence: PRESENT, annotations: {cs:nullable: true}}
      profile: {range: SourceValue, inlined: true, required: true}
      vector: {range: DdoContextualVector, inlined: true, required: true}
      rendered: {range: DdoContextualRenderedInput, inlined: true, required: true}
  DdoContextualTargetVector:
    is_a: DdoContextualVectorProduct
    attributes:
      target: {range: DdoContextualTarget, inlined: true, required: true}
  DdoContextualQueryVector:
    is_a: DdoContextualVectorProduct
  DdoContextualVectors:
    is_a: SourceRecordProduct
    attributes:
      lexical_targets: {range: SourceValue, inlined: true, required: true}
      profile: {range: SourceValue, inlined: true, required: true}
      vectors: {range: SourceValue, inlined: true, required: true}
  DdoContextualCarrierInput:
    is_a: DdoSemanticProductReference
    attributes:
      member_id: {annotations: {cs:nullable: true}}
      kind_contract: {required: true}
      project_id: {required: true}
      subject_definition: {required: true}
      subject: {required: true}
      original_source: {required: true}
      analyzed_scope_meaning: {required: true}
      contribution_id: {required: true, pattern: "^source-contribution:[0-9a-f]{64}$"}
  DdoContextualQuery:
    is_a: SourceRecordProduct
    attributes:
      carrier: {range: DdoContextualCarrierInput, inlined: true, required: true}
      source_pin: {range: RecordSourcePin, inlined: true, required: true}
      occurrence_id: {required: true}
      lexical_query: {required: true}
      query_vector_id: {required: true}
      anchors: {range: RecordAnchor, inlined_as_list: true, multivalued: true, required: true, minimum_cardinality: 1}
      context: {range: DdoEncodedQueryContext, inlined: true, required: true}
      context_inputs: {range: DdoContextualPrimaryInput, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
  DdoSelectedQueryContext:
    is_a: SourceRecordProduct
    attributes:
      recipe: {range: DdoLocatedQueryContextRecipe, required: true}
      evidence: {range: DdoSemanticMemberReference, inlined: true, required: true}
  DdoEncodedQueryContext:
    is_a: SourceRecordProduct
    attributes:
      recipe: {required: true, pattern: "^(lexical-native-1|located-frame-2|located-referent-2|located-discourse-neighbor-2)$"}
      report: {range: SourceValue, inlined: true, required: true}
      rendered: {required: true}
      representation_digest: {required: true}
  DdoContextualPrimaryInput:
    is_a: DdoSemanticProductReference
    attributes:
      reference: {required: true}
      kind_contract: {required: true}
      project_id: {required: true}
      subject_definition: {required: true}
      subject: {required: true}
      original_source: {required: true}
      analyzed_scope_meaning: {required: true}
  DdoContextualRetrievalPolicy:
    is_a: SourceRecordProduct
    attributes:
      budget: {range: integer, required: true, minimum_value: 1}
      channel_budget: {range: integer, required: true, minimum_value: 1}
      constraints: {range: SourceValue, inlined: true, required: true}
      exclusions: {range: SourceValue, inlined: true, required: true}
  DdoContextualProductInput:
    is_a: DdoSemanticProductReference
    attributes:
      member_id: {annotations: {cs:nullable: true}}
      kind_contract: {required: true}
      project_id: {required: true}
      subject_definition: {required: true}
      subject: {required: true}
      original_source: {value_presence: PRESENT, annotations: {cs:nullable: true}}
      analyzed_scope_meaning: {required: true}
  DdoContextualWitnessHypothesis:
    is_a: SourceRecordProduct
    attributes:
      hypothesis_id: {required: true}
      target_id: {required: true}
      relation: {required: true, pattern: "^(denotes|alias-of|defined-by|specializes|compared-with|participates-in|cites-section)$"}
      asserted_basis: {required: true, pattern: "^(explicit_source_cue|producer_group|geometry|model_reading|admitted_derivation)$"}
      cue_refs: {range: DdoContextualCarrierInput, inlined_as_list: true, multivalued: true, required: true, minimum_cardinality: 1}
  DdoContextualWitnessHypotheses:
    is_a: SourceRecordProduct
    attributes:
      author_assertion: {required: true}
      hypotheses: {range: DdoContextualWitnessHypothesis, inlined_as_list: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
  DdoContextualWitnessBindings:
    is_a: SourceRecordProduct
    attributes:
      standing: {required: true, equals_string: private_authored_source_binding_hypotheses}
      support_state: {required: true, equals_string: unassessed}
      author_assertion: {required: true}
      authored_support: {range: SourceValue, inlined: true, required: true}
      query_input: {range: DdoContextualProductInput, inlined: true, required: true}
      inventory_input: {range: DdoContextualProductInput, inlined: true, required: true}
      source_input: {range: DdoContextualProductInput, inlined: true, required: true}
      hypotheses_input: {range: DdoContextualProductInput, inlined: true, required: true}
      cues_input: {range: DdoContextualCarrierInput, inlined_as_list: true, multivalued: true, required: true, minimum_cardinality: 1}
      hypotheses: {range: DdoContextualWitnessHypothesis, inlined_as_list: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
      witnesses: {range: SourceValue, inlined: true, required: true}
  DdoContextualNativeScoreHit:
    is_a: SourceRecordProduct
    attributes:
      channel: {required: true, pattern: "^(alias|lexical|dense)$"}
      target_id: {required: true}
      rank: {range: integer, required: true, minimum_value: 1}
      score_float8_hex: {required: true, pattern: "^[0-9a-f]{16}$"}
  DdoContextualNativeScores:
    is_a: SourceRecordProduct
    attributes:
      version: {required: true, equals_string: contextual-native-scores-2}
      inventory_id: {required: true}
      profile_id: {required: true}
      occurrence_id: {required: true}
      query_vector_id: {required: true}
      lexical_query: {required: true}
      linguistic_observation: {range: SourceValue, inlined: true, required: true}
      membership: {multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
      hits: {range: DdoContextualNativeScoreHit, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
  DdoContextualRetrievalProduct:
    is_a: SourceRecordProduct
    attributes:
      version: {required: true, equals_string: declared-contextual-retrieval-1}
      source_pin: {range: RecordSourcePin, inlined: true, required: true}
      anchors: {range: RecordAnchor, inlined_as_list: true, multivalued: true, required: true, minimum_cardinality: 1}
      inventory: {range: SourceValue, inlined: true, required: true}
      candidate_list: {range: SourceValue, inlined: true, required: true}
      relationship_decision: {range: SourceValue, inlined: true, required: true}

  DdoContextualNeighborhoodProduct:
    is_a: SourceRecordProduct
    attributes:
      version: {required: true, equals_string: declared-contextual-neighborhood-1}
      inventory: {range: SourceValue, inlined: true, required: true}
      profile: {range: SourceValue, inlined: true, required: true}
      vectors: {range: SourceValue, inlined: true, required: true}
      neighborhood: {range: SourceValue, inlined: true, required: true}

  DdoContextualWitnessedRetrievalProduct:
    is_a: DdoContextualRetrievalProduct
    attributes:
      witness_input: {range: DdoContextualProductInput, inlined: true, required: true}
      witness_standing: {required: true, equals_string: private_authored_source_binding_hypotheses}
      support_state: {required: true, equals_string: unassessed}

enums:
  DdoLocatedQueryContextRecipe:
    permissible_values:
      located-frame-2: {}
      located-referent-2: {}
      located-discourse-neighbor-2: {}
