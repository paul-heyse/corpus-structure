- id: run
  subject: Run
  dimensions:
  - id: status
    values:
    - created
    - running
    - consolidating
    - finished
    - failed
    - cancelled
  - id: final_cut
    values:
    - absent
    - present
  - id: completed_result
    values:
    - absent
    - present
  - id: receipts
    values:
    - absent
    - present
  states:
  - id: created
    values:
    - dimension: status
      value: created
    - dimension: final_cut
      value: absent
    - dimension: completed_result
      value: absent
    - dimension: receipts
      value: absent
    terminal: false
  - id: running
    values:
    - dimension: status
      value: running
    - dimension: final_cut
      value: absent
    - dimension: completed_result
      value: absent
    - dimension: receipts
      value: absent
    terminal: false
  - id: consolidating
    values:
    - dimension: status
      value: consolidating
    - dimension: final_cut
      value: present
    - dimension: completed_result
      value: absent
    - dimension: receipts
      value: absent
    terminal: false
  - id: finished
    values:
    - dimension: status
      value: finished
    - dimension: final_cut
      value: present
    - dimension: completed_result
      value: present
    - dimension: receipts
      value: present
    terminal: true
  - id: failed_open
    values:
    - dimension: status
      value: failed
    - dimension: final_cut
      value: absent
    - dimension: completed_result
      value: absent
    - dimension: receipts
      value: absent
    terminal: true
  - id: failed_sealed
    values:
    - dimension: status
      value: failed
    - dimension: final_cut
      value: present
    - dimension: completed_result
      value: absent
    - dimension: receipts
      value: absent
    terminal: true
  - id: cancelled_open
    values:
    - dimension: status
      value: cancelled
    - dimension: final_cut
      value: absent
    - dimension: completed_result
      value: absent
    - dimension: receipts
      value: absent
    terminal: true
  - id: cancelled_sealed
    values:
    - dimension: status
      value: cancelled
    - dimension: final_cut
      value: present
    - dimension: completed_result
      value: absent
    - dimension: receipts
      value: absent
    terminal: true
