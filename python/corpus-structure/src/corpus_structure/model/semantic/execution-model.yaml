invariants:
- id: qualified_reference
  meaning: Persisted scoped references retain release and realization; no global local-key joins
  subjects:
  - Entity
  - SemanticFact
  - AssertionOccurrence
  - AlternativeGroup
  relationships:
  - bundle_contains
  - dependencies_capture
  - release_prepared_from
  - realization_interprets
  - rendition_build
  - rendition_segments
  - run_rendition
  - entity_membership
  - value_member
  - fact_denotes
  - occurrence_reports
  - assessment_subjects
  - query_explanation
  scope: relational
  failure_code: execution.qualified_reference
  implementation: publish
  required_capability: execution.lifecycle.v1
- id: exact_archive
  meaning: Exact authored bytes and derived products reconstruct without latest defaults
  subjects:
  - Archive
  - SemanticRelease
  relationships:
  - archive_preserves
  scope: relational
  failure_code: execution.exact_archive
  implementation: reload
- id: activation_cas
  meaning: Expected parent and generation change the project pointer atomically
  subjects:
  - Project
  - ActivationToken
  relationships:
  - project_selects
  scope: lifecycle
  failure_code: execution.activation_cas
  implementation: activate
  required_capability: execution.lifecycle.v1
- id: immutable_binding
  meaning: Run/invocation result-affecting input binding never changes
  subjects:
  - RunBinding
  - TaskInvocation
  relationships:
  - run_consumes
  - task_belongs
  scope: lifecycle
  failure_code: execution.immutable_binding
  implementation: start_run
  required_capability: execution.lifecycle.v1
- id: reuse_origin
  meaning: Reuse resolves one compatible completed done/empty non-reused origin
  subjects:
  - TaskInvocation
  - InputCut
  relationships:
  - task_reuses
  - cut_origin
  scope: relational
  failure_code: execution.reuse_origin
  implementation: schedule
  required_capability: execution.lifecycle.v1
- id: attempt_fence
  meaning: Current positive attempt and holder authorize work; expiry alone does not transfer ownership
  subjects:
  - TaskInvocation
  - Attempt
  - HeldSubmission
  relationships:
  - attempt_owns
  - held_submission
  scope: lifecycle
  failure_code: execution.attempt_fence
  implementation: claim
  required_capability: execution.lifecycle.v1
- id: terminal_result
  meaning: Terminal task envelopes and outcome agree and are immutable
  subjects:
  - TaskInvocation
  - TaskResultEnvelope
  relationships:
  - result_reports
  scope: lifecycle
  failure_code: execution.terminal_result
  implementation: complete
  required_capability: execution.lifecycle.v1
- id: completed_source
  meaning: Prior source reports are eligible completed inputs with typed roles
  subjects:
  - SourceObservation
  - ObservationInput
  relationships:
  - observation_inputs
  scope: relational
  failure_code: execution.completed_source
  implementation: complete_unit
  required_capability: execution.lifecycle.v1
- id: packet_reads
  meaning: Packet identity, read obligations and source location checks precede submission
  subjects:
  - WorkPacket
  - ReadObligation
  - SubmissionResult
  relationships:
  - packet_obligations
  - held_submission
  scope: relational
  failure_code: execution.packet_reads
  implementation: locate
- id: measurement_scope
  meaning: Metric type, subject scope and producing method/input context agree; measurements do not assert
    facts
  subjects:
  - MetricDefinition
  - Measurement
  - MeasurementSubject
  relationships:
  - measurement_context
  scope: local
  failure_code: execution.measurement_scope
  implementation: complete_unit
- id: final_cut_barrier
  meaning: Final cut captures effective completed origins and atomically seals source production
  subjects:
  - Run
  - InputCut
  - FinalCut
  relationships:
  - cut_origin
  - run_result
  scope: lifecycle
  failure_code: execution.final_cut_barrier
  implementation: cut
  required_capability: execution.lifecycle.v1
- id: source_authorization
  meaning: Published source evidence is within the selected cut and agrees with source placement/meaning
  subjects:
  - AssertionOccurrence
  - Evidence
  - Support
  relationships:
  - occurrence_reports
  - occurrence_evidence
  - fact_support
  - membership_support
  - entity_source
  scope: relational
  failure_code: execution.source_authorization
  implementation: publish
  required_capability: execution.lifecycle.v1
- id: scientific_selection
  meaning: Selection/comparison uses bound scientific policy, context and explicit uncertainty
  subjects:
  - Selection
  - Assessment
  - ScientificContext
  relationships:
  - fact_selected
  - assessment_subjects
  scope: scientific
  failure_code: execution.scientific_selection
  implementation: scientific_policy
- id: alternative_identity
  meaning: Alternative identity is distinct unordered scoped fact membership, with reason outside identity
  subjects:
  - AlternativeGroup
  - SemanticFact
  relationships:
  - group_alternatives
  scope: relational
  failure_code: execution.alternative_identity
  implementation: publish
  required_capability: execution.lifecycle.v1
- id: positive_grounding
  meaning: Admitted positive rules and exact qualification ground finite proofs in eligible source/input
    support
  subjects:
  - Derivation
  - DerivationPremise
  - InferenceRule
  relationships:
  - derivation_premises
  scope: relational
  failure_code: execution.positive_grounding
  implementation: derive
  required_capability: execution.lifecycle.v1
- id: verified_lineage
  meaning: Cross-realization lineage names exact authorized input/output bindings and never copies source
    occurrences
  subjects:
  - EntityInput
  - FactInput
  - RunBinding
  relationships:
  - entity_input
  - fact_input
  scope: relational
  failure_code: execution.verified_lineage
  implementation: publish
  required_capability: execution.lifecycle.v1
- id: completed_result
  meaning: Finished output, final cut, source/proof receipts and result pointer become visible atomically
    and immutable
  subjects:
  - Run
  - EvaluationResult
  - PublicationReceipt
  relationships:
  - run_result
  - realization_completed_result
  scope: lifecycle
  failure_code: execution.completed_result
  implementation: evaluate
  required_capability: execution.lifecycle.v1
- id: writable_output
  meaning: Writable realization has no completed EvaluationResult relationship; no independent mutable
    seal flag
  subjects:
  - Realization
  - EvaluationResult
  relationships:
  - realization_completed_result
  scope: relational
  failure_code: execution.writable_output
  implementation: publish
  required_capability: execution.lifecycle.v1
- id: same_snapshot
  meaning: All bound handles, references and captured relations share one explicit snapshot/revision
  subjects:
  - SnapshotBinding
  - QueryHandle
  - CapturedPacket
  relationships:
  - query_snapshot
  - query_explanation
  - captured_projection
  scope: snapshot
  failure_code: execution.same_snapshot
  implementation: read
- id: coverage_lowering
  meaning: Coverage translation retains family/scope/reason; query page completeness cannot imply knowledge
    completeness
  subjects:
  - SourceCoverage
  - SemanticCoverage
  - QueryKnowledge
  - PageCompleteness
  relationships:
  - query_coverage
  scope: relational
  failure_code: execution.coverage_lowering
  implementation: evaluate
- id: projection_fidelity
  meaning: Declared projection preserves scoped identity, collection/null and arithmetic interpretation
  subjects:
  - CapturedPacket
  - CandidateInput
  - ProjectionProfile
  - ArithmeticProfile
  relationships:
  - captured_projection
  - candidate_projection
  scope: local
  failure_code: execution.projection_fidelity
  implementation: projection
- id: analysis_lifetime
  meaning: Scope owns borrowed resources; detached materialized values survive close; all teardowns attempted
  subjects:
  - AnalysisScope
  - BorrowedResult
  - DetachedResult
  relationships:
  - analysis_result
  scope: resource
  failure_code: execution.analysis_lifetime
  implementation: analysis_close
- id: derived_revision
  meaning: Snapshot-derived publication requires exact unchanged input revision; stale computation must
    recompute
  subjects:
  - SnapshotDerivedPublication
  - SnapshotBinding
  relationships:
  - derived_publication
  scope: snapshot
  failure_code: execution.derived_revision
  implementation: publish_arrow
  required_capability: execution.lifecycle.v1
- id: exact_replay
  meaning: Same operation identity and bytes returns original receipt; conflicting content refuses
  subjects:
  - PublicationReceipt
  - AppendPublication
  - SnapshotDerivedPublication
  relationships:
  - derived_publication
  - append_publication
  scope: relational
  failure_code: execution.exact_replay
  implementation: publish
  required_capability: execution.lifecycle.v1
