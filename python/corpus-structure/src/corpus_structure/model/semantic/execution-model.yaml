outcome_translations:
- source_domain: source_coverage
  source: complete
  target_domain: semantic_coverage
  target: complete
  retained_meaning: Same family/scope and completed transformation obligations only
  invariant: coverage_lowering
- source_domain: source_coverage
  source: partial
  target_domain: semantic_coverage
  target: partial
  retained_meaning: Covered/uncovered or uncertain scope and reason
  invariant: coverage_lowering
- source_domain: source_coverage
  source: unknown
  target_domain: semantic_coverage
  target: unanalysed
  retained_meaning: Originating unknown outcome and reason
  invariant: coverage_lowering
- source_domain: source_coverage
  source: unsupported
  target_domain: semantic_coverage
  target: unanalysed
  retained_meaning: Unsupported operation/construct and required capability
  invariant: coverage_lowering
- source_domain: source_coverage
  source: failed
  target_domain: semantic_coverage
  target: failed
  retained_meaning: Typed source failure and affected scope
  invariant: coverage_lowering

native_guards:
- id: execution_edge
  symbol: ops.execution_edge(text,text,text)
  version: '1'
  invariants: [immutable_binding, terminal_result]
- id: execution_task
  symbol: ops.guard_execution_task()
  version: '1'
  invariants: [attempt_fence, terminal_result, reuse_origin]
- id: execution_run
  symbol: ops.guard_execution_run()
  version: '1'
  invariants: [final_cut_barrier, immutable_binding]
- id: conditional_kernel
  symbol: data.validate_conditions(text,text)
  version: '1'
  invariants: []
- id: completed_result
  symbol: data.finish_evaluation(bigint,text,text)
  version: '1'
  invariants: [completed_result, writable_output, exact_replay]
