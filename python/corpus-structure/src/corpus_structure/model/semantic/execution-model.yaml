concepts:
- id: SourceRecordInterpretation
  family: source
  scope: realization
  meaning: Released source record occurrence and immutable interpretation, projected as finite relations without graph product membership
  identity: Original record_id and interpretation_id; private assertion strings never become canonical fact ids
  attributes:
  - {name: record_id, range: text, required: true, multivalued: false}
  - {name: interpretation_id, range: text, required: true, multivalued: false}
  relationships: [record_source_membership, record_candidate_admission]
- id: SourceRecordAdmission
  family: source
  scope: realization
  meaning: Candidate-only m1-candidate-only version 1 retention with not_calibrated standing; accepted decisions and public assertion links refuse
  identity: Released record occurrence and interpretation in the same publication receipt
  attributes:
  - {name: decision, range: text, required: true, multivalued: false}
  - {name: policy_id, range: text, required: true, multivalued: false}
  - {name: policy_version, range: text, required: true, multivalued: false}
  - {name: calibration, range: text, required: true, multivalued: false}
  relationships: [record_candidate_admission]
- id: IdentityExclusion
  family: knowledge
  scope: realization
  meaning: Evidence-backed operational exclusion between scoped identity endpoints;
    not an ordinary negative fact
  identity: release/realization + source observation key + source exclusion id; reasons
    and evidence remain provenance
  attributes:
  - name: reason
    range: text
    required: true
    multivalued: false
  relationships:
  - identity_exclusion_endpoints
  - identity_exclusion_evidence
- id: IdentityResolutionConflict
  family: execution
  scope: run
  meaning: Structured atomic refusal when mandatory identity equivalence contradicts
    an eligible exclusion
  identity: bound cut and conflicting source exclusions
  attributes:
  - name: code
    range: text
    required: true
    multivalued: false
  relationships: []
