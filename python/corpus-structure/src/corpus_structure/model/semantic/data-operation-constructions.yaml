id: https://corpus-structure.dev/semantic/data-operation-constructions
name: data_operation_constructions
prefixes:
  dco: https://corpus-structure.dev/semantic/data-operation-constructions/
  cs: https://corpus-structure.dev/semantic/
default_prefix: dco
default_range: string
enums:
  DdoConstructionFormalSupportUse:
    permissible_values:
      external_premise:
      basis_external_premise:
      required_external_choice:
      basis_required_external_choice:
  DdoConstructionAnnotationSupportUse:
    permissible_values:
      external_premise:
      basis_external_premise:
      named_node:
      named_binding_head:
      named_binding_member:
      named_binding_antecedent:
      navigation_token:
classes:
  DdoInterpretedMember:
    is_a: SourceRecordProduct
    abstract: true
    attributes:
      record_type:
        required: true
    annotations:
      cs:data_universe: ordinary
  DdoInterpretedExtent:
    is_a: DdoFormalExtent
  DdoInterpretedOccurrence:
    is_a: DdoConstructionMember
    attributes:
      local_id:
        required: true
        pattern: '^.+$(?![\s\S])'
      extents:
        range: DdoInterpretedExtent
        inlined: true
        multivalued: true
        required: true
      record_type:
        equals_string: occurrence
        required: true
    mixins:
    - DdoContextualMember
  DdoInterpretedNestedChoiceMember:
    is_a: CharacterizationChoiceMember
    slot_usage:
      external_premises:
        range: DdoSemanticMemberReference
      required_external_choices:
        range: DdoSemanticMemberReference
  DdoInterpretedAnnotation:
    is_a: CharacterizationAnnotation
    mixins:
    - DdoConstructionMember
    - DdoContextualMember
    attributes:
      record_type:
        required: true
        equals_string: annotation
    slot_usage:
      navigation:
        range: DdoSemanticNavigation
      named_match:
        range: DdoNamedMatch
      external_premises:
        range: DdoSemanticMemberReference
      required_external_choices:
        range: DdoSemanticMemberReference
    annotations:
      cs:data_universe: ordinary
  DdoInterpretedMembership:
    is_a: CharacterizationMembership
    mixins:
    - DdoConstructionMember
    - DdoContextualMember
    attributes:
      record_type:
        required: true
        equals_string: membership
    slot_usage:
      external_premises:
        range: DdoSemanticMemberReference
      required_external_choices:
        range: DdoSemanticMemberReference
    annotations:
      cs:data_universe: ordinary
  DdoInterpretedRole:
    is_a: CharacterizationRole
    mixins:
    - DdoConstructionMember
    - DdoContextualMember
    attributes:
      record_type:
        required: true
        equals_string: role
    slot_usage:
      required_external_choices:
        range: DdoSemanticMemberReference
      basis:
        range: DdoSemanticAttachmentBasis
    annotations:
      cs:data_universe: ordinary
  DdoInterpretedTerm:
    is_a: CharacterizationTerm
    mixins:
    - DdoConstructionMember
    - DdoContextualMember
    attributes:
      record_type:
        required: true
        equals_string: term
    slot_usage:
      external_premises:
        range: DdoSemanticMemberReference
      required_external_choices:
        range: DdoSemanticMemberReference
    annotations:
      cs:data_universe: ordinary
  DdoInterpretedChoiceGroup:
    is_a: CharacterizationChoiceGroup
    mixins:
    - DdoConstructionMember
    - DdoContextualMember
    attributes:
      record_type:
        required: true
        equals_string: choice
    slot_usage:
      members:
        range: DdoInterpretedNestedChoiceMember
    annotations:
      cs:data_universe: ordinary
  DdoInterpretedPacket:
    is_a: SourceRecordProduct
    attributes:
      member_id:
        required: true
        pattern: '^.+$(?![\s\S])'
      kind_contract:
        required: true
        pattern: '^.+$(?![\s\S])'
      context:
        range: DdoFormalMemberContext
        required: true
        inlined: true
    annotations:
      cs:data_universe: ordinary
    abstract: true
  DdoInterpretedCoverage:
    is_a: CharacterizationFamilyCoverage
    mixins:
    - DdoCharacterizationCoverage
    annotations:
      cs:data_universe: ordinary
  DdoConstructionProduct:
    is_a: DdoInterpretedProduct
    annotations:
      cs:data_universe: ordinary
    attributes:
      dependencies:
        range: DdoSemanticProductReference
        inlined: true
        multivalued: true
      members:
        range: DdoConstructionPacket
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
  DdoPrimaryConstructionProduct:
    is_a: DdoConstructionProduct
    description: Primary source grammar, navigation and mathematical scope from retained formal and native annotations.
    annotations:
      cs:data_universe: ordinary
    attributes:
      formal_support:
        range: DdoConstructionFormalSupport
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
      annotation_support:
        range: DdoConstructionAnnotationSupport
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
  DdoConstructionFormalSupport:
    is_a: SourceRecordProduct
    attributes:
      owner: {required: true, pattern: '^.+$(?![\s\S])'}
      use: {range: DdoConstructionFormalSupportUse, required: true}
      position: {range: integer, minimum_value: 0, required: true}
      target: {range: DdoSemanticReference, inlined: true, required: true}
  DdoConstructionAnnotationSupport:
    is_a: SourceRecordProduct
    attributes:
      owner: {required: true, pattern: '^.+$(?![\s\S])'}
      use: {range: DdoConstructionAnnotationSupportUse, required: true}
      position: {range: integer, minimum_value: 0, required: true}
      binding_position: {range: integer, minimum_value: 0}
      target: {range: DdoSemanticReference, inlined: true, required: true}
  DdoDeclarationSyntaxProduct:
    is_a: DdoConstructionProduct
    description: Distinct declaration syntax from exact canonical sentences and independently retained HanLP heads.
    annotations:
      cs:data_universe: ordinary
    attributes:
      term_support:
        range: DdoDeclarationTermSupport
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
  DdoDeclarationTermSupport:
    is_a: SourceRecordProduct
    attributes:
      term_id: {required: true}
      references:
        range: DdoSemanticReference
        multivalued: true
        inlined: true
        required: true
        minimum_cardinality: 1
  DdoContextualMeaningProduct:
    is_a: DdoInterpretedProduct
    description: Exact selected symbolic products evaluated under explicitly selected
      environments; proposals retain private standing and unresolved sites remain
      unknown.
    annotations:
      cs:data_universe: ordinary
    attributes:
      formal_member_support:
        range: DdoContextualInputSupport
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
      formal_product_support:
        range: DdoContextualInputSupport
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
      constructions_member_support:
        range: DdoContextualInputSupport
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
      constructions_product_support:
        range: DdoContextualInputSupport
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
      supporting_member_support:
        range: DdoContextualInputSupport
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
      supporting_product_support:
        range: DdoContextualInputSupport
        multivalued: true
        inlined: true
        value_presence: PRESENT
        minimum_cardinality: 0
      roots:
        range: DdoSemanticMemberReference
        multivalued: true
        inlined: true
        minimum_cardinality: 0
      environment:
        range: DdoMeaningEnvironment
        required: true
        inlined: true
      members:
        range: DdoContextualPacket
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
  DdoContextualInputSupport:
    is_a: SourceRecordProduct
    attributes:
      owner: {required: true, pattern: '^.+$(?![\s\S])'}
      use: {required: true, pattern: '^(premise|basis_premise|choice|basis_choice|root|hypotheses|proposals|choices|attribution|context_products|binding_variable|binding_binder)$(?![\s\S])'}
      position: {range: integer, required: true, minimum_value: 0}
      target: {range: DdoSemanticReference, inlined: true, required: true}
  DdoInterpretedChoiceMember:
    is_a: DdoInterpretedNestedChoiceMember
    mixins:
    - DdoConstructionMember
    - DdoContextualMember
    attributes:
      record_type:
        required: true
        equals_string: choice_member
      group_id:
        required: true
        pattern: '^.+$(?![\s\S])'
    annotations:
      cs:data_universe: ordinary
  DdoMeaningBinding:
    is_a: SourceRecordProduct
    attributes:
      variable:
        range: DdoSemanticMemberReference
        required: true
        inlined: true
      binder:
        range: DdoSemanticMemberReference
        required: true
        inlined: true
  DdoMeaningEnvironment:
    is_a: SourceRecordProduct
    attributes:
      context_products:
        range: DdoSemanticProductReference
        multivalued: true
        inlined: true
        minimum_cardinality: 0
      hypotheses:
        range: DdoSemanticMemberReference
        multivalued: true
        inlined: true
        minimum_cardinality: 0
      proposals:
        range: DdoSemanticMemberReference
        multivalued: true
        inlined: true
        minimum_cardinality: 0
      choices:
        range: DdoSemanticMemberReference
        multivalued: true
        inlined: true
        minimum_cardinality: 0
      bindings:
        range: DdoMeaningBinding
        multivalued: true
        inlined: true
        minimum_cardinality: 0
      attribution:
        range: DdoSemanticMemberReference
        multivalued: true
        inlined: true
        minimum_cardinality: 0
  DdoDocumentFamilyStanding:
    is_a: SourceRecordProduct
    attributes:
      family:
        required: true
        pattern: '^.+$(?![\s\S])'
      availability:
        required: true
        pattern: '^(available|unknown|unavailable|unsupported)$(?![\s\S])'
      outcome:
        required: true
        pattern: '^(complete|empty|partial|unknown|failed|unsupported)$(?![\s\S])'
      products:
        range: DdoSemanticProductReference
        multivalued: true
        inlined: true
        minimum_cardinality: 0
      reason: {}
      source:
        range: DdoNativeSourceCoordinate
        required: true
        inlined: true
  DdoEnrichedDocumentView:
    is_a: SourceRecordProduct
    attributes:
      profile:
        required: true
        pattern: '^(source_only|selected_layers|full_characterization)$(?![\s\S])'
      products:
        range: DdoSemanticProductReference
        inlined: true
        multivalued: true
        minimum_cardinality: 0
      active:
        range: DdoSemanticProductReference
        inlined: true
        multivalued: true
        minimum_cardinality: 0
      coverage:
        range: DdoDocumentFamilyStanding
        inlined: true
        multivalued: true
        minimum_cardinality: 0
      outcome:
        required: true
        pattern: '^(complete|partial)$(?![\s\S])'
      original_document:
        required: true
        pattern: '^.+$(?![\s\S])'
      sources:
        range: DdoSelectedNativeSource
        multivalued: true
        inlined: true
        required: true
    annotations:
      cs:data_universe: ordinary
  DdoInterpretedProduct:
    is_a: DdoCharacterizationEnvelope
    attributes:
      source:
        range: DdoNativeSourceCoordinate
        required: true
        inlined: true
      selectors:
        range: CharacterizationSourceSelector
        required: true
        inlined: true
        multivalued: true
      outcome:
        required: true
        pattern: '^(complete|partial|failed)$(?![\s\S])'
      coverage:
        range: DdoInterpretedCoverage
        inlined: true
        multivalued: true
        required: true
    annotations:
      cs:data_universe: ordinary
    abstract: true
  DdoConstructionMember:
    is_a: DdoInterpretedMember
    abstract: true
  DdoConstructionPacket:
    is_a: DdoInterpretedPacket
    attributes:
      body:
        range: DdoConstructionMember
        inlined: true
        required: true
  DdoConstructionManifest:
    is_a: DdoConstructionMember
    mixins:
    - DdoCharacterizedProduct
    attributes:
      dependencies: {range: DdoSemanticProductReference, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
  DdoContextualMember:
    is_a: DdoInterpretedMember
    abstract: true
  DdoContextualPacket:
    is_a: DdoInterpretedPacket
    attributes:
      body:
        range: DdoContextualMember
        inlined: true
        required: true
  DdoContextualManifest:
    is_a: DdoContextualMember
    mixins:
    - DdoCharacterizedProduct

  DdoSemanticNavigationToken:
    is_a: SourceRecordProduct
    attributes:
      name: {required: true, pattern: '^.+$(?![\s\S])'}
      index: {range: integer, required: true, minimum_value: 0}
  DdoNamedBinding:
    is_a: SourceRecordProduct
    attributes:
      demonstrative: {range: boolean}
      antecedent_status: {pattern: '^(resolved|unresolved|unavailable|not_applicable)$(?![\s\S])'}
      antecedent_reason: {}
      role: {required: true}
      node: {required: true}
      expansion: {required: true}
      status: {required: true}
      reason: {}
  DdoNamedMatch:
    is_a: SourceRecordProduct
    attributes:
      rule: {required: true}
      variant: {required: true}
      mechanism: {required: true}
      protocol: {required: true}
      dependency_digest: {required: true, pattern: '^[0-9a-f]{64}$(?![\s\S])'}
      block_id: {required: true, pattern: '^.+$(?![\s\S])'}
      piece_indices: {range: integer, multivalued: true, minimum_value: 0}
      sentences: {range: CharacterizationNamedSentence, inlined: true, multivalued: true}
      bindings: {range: DdoNamedBinding, inlined: true, multivalued: true}
      status: {required: true}
      reason: {}
      negation_occurrences: {multivalued: true}
