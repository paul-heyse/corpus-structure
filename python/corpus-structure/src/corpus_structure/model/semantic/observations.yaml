id: https://corpus-structure.dev/semantic/observations
name: semantic_observations
prefixes:
  csobs: https://corpus-structure.dev/semantic/observations/
default_prefix: csobs
default_range: string
classes:
  SourceRecordProduct:
    abstract: true
    description: Private operation product, validated through released report boundaries; not a knowledge graph class or datatype.
  SourceValue:
    abstract: true
    attributes:
      kind: {required: true}
  SourceText:
    is_a: SourceValue
    attributes:
      kind: {equals_string: text}
      text: {required: true}
  SourceMeasurementValue:
    is_a: SourceValue
    abstract: true
  SourceInteger:
    is_a: SourceMeasurementValue
    attributes:
      kind: {equals_string: integer}
      integer: {range: integer, required: true}
  SourceFloat:
    is_a: SourceMeasurementValue
    attributes:
      kind: {equals_string: float}
      hexadecimal: {required: true}
  SourceBoolean:
    is_a: SourceValue
    attributes:
      kind: {equals_string: boolean}
      boolean: {range: boolean, required: true}
  SourceNull:
    is_a: SourceMeasurementValue
    attributes:
      kind: {equals_string: "null"}
  SourceArray:
    is_a: SourceValue
    attributes:
      kind: {equals_string: array}
      items: {range: SourceValue, multivalued: true, inlined: true}
  SourceField:
    attributes:
      name: {required: true}
      position: {range: integer, minimum_value: 0, required: true}
      value: {range: SourceValue, inlined: true, required: true}
  SourceObject:
    is_a: SourceValue
    attributes:
      kind: {equals_string: object}
      fields: {range: SourceField, multivalued: true, inlined: true}
  SourceObservationReference:
    attributes:
      observation_key: {required: true}
      role: {required: true}
  SourceObservation:
    description: An immutable source report, not an admitted knowledge assertion.
    attributes:
      observation_key: {required: true}
      item_key: {required: true}
      family: {required: true}
      outcome: {required: true}
      score: {range: SourceFloat, inlined: true}
      confidence_source: {}
      payload: {range: SourceObject, inlined: true, required: true}
      inputs: {range: SourceObservationReference, inlined: true, multivalued: true}
      source_view_id: {range: integer, minimum_value: 1}
      native_pointer: {}
      projected_start: {range: integer, minimum_value: 0}
      projected_end: {range: integer, minimum_value: 0}
      recognized_start: {range: integer, minimum_value: 0}
      recognized_end: {range: integer, minimum_value: 0}
      rendition_id: {range: integer}
      segment_id: {range: integer}
      span_start: {range: integer, minimum_value: 0}
      span_end: {range: integer, minimum_value: 0}
  SourceCoverage:
    attributes:
      family: {required: true}
      scope: {required: true}
      outcome: {range: SourceCoverageOutcome, required: true}
      reason: {}
      required_capability: {}
  SourceMeasurement:
    attributes:
      metric: {required: true}
      scope_type: {range: SourceMeasurementScope, required: true}
      scope_id: {range: integer}
      scope_key: {}
      value: {range: SourceMeasurementValue, inlined: true, required: true}
      detail: {range: SourceObject, inlined: true, required: true}
  SourceMetricDefinition:
    description: SourceNumberOrNull retains integer/float source kinds under the existing finite float-compatible measurement API. Native subject bindings support run and segment references.
    attributes:
      id: {required: true}
      value_type: {required: true, equals_string: SourceNumberOrNull}
      subject_kind: {required: true, range: SourceMetricSubjectKind}
      detail_schema: {required: true, equals_string: SourceObject}
      description: {required: true}
  SourceMeasurementSubject:
    attributes:
      kind: {range: SourceMetricSubjectKind, required: true}
      scope_id: {range: integer}
      scope_key: {}
  SourceMeasurementProducer:
    attributes:
      release_id: {required: true}
      run_id: {range: integer, required: true}
      task_id: {range: integer, required: true}
      invocation_key: {required: true}
      method: {required: true}
      operation_version: {required: true}
      configuration_hash: {required: true}
      input_hash: {required: true}
      unit_key: {required: true}
  SourceBoundMeasurement:
    attributes:
      source_position: {range: integer, minimum_value: 0, required: true}
      metric: {range: SourceMetricDefinition, required: true, inlined: true}
      subject: {range: SourceMeasurementSubject, required: true, inlined: true}
      producer: {range: SourceMeasurementProducer, required: true, inlined: true}
      value: {range: SourceMeasurementValue, required: true, inlined: true}
      detail: {range: SourceObject, required: true, inlined: true}
  SourceObservationBatch:
    is_a: SourceRecordProduct
    attributes:
      release_id: {required: true}
      invocation_key: {required: true}
      source: {required: true}
      method: {required: true}
      operation_version: {required: true}
      configuration_hash: {required: true}
      input_hash: {required: true}
      unit_key: {required: true}
      outcome: {required: true}
      error: {}
      cost: {range: SourceObject, inlined: true}
      parse_detail: {range: SourceObject, inlined: true}
      observations: {range: SourceObservation, multivalued: true, inlined: true}
      coverage: {range: SourceCoverage, multivalued: true, inlined: true}
      measurements: {range: SourceMeasurement, multivalued: true, inlined: true}
      records: {range: SourceRecord, multivalued: true, inlined: true}
  RecordScalar:
    is_a: SourceRecordProduct
    abstract: true
    attributes:
      kind: {required: true}
  RecordText:
    is_a: RecordScalar
    attributes:
      kind: {equals_string: text}
      text: {required: true}
  RecordDecimal:
    is_a: RecordScalar
    description: Exact finite decimal/scientific spelling; never a binary float projection.
    attributes:
      kind: {equals_string: decimal}
      lexical: {required: true, pattern: '^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'}
  RecordClassification:
    is_a: RecordScalar
    attributes:
      kind: {equals_string: classification}
      label: {required: true}
  RecordTextSequence:
    is_a: RecordScalar
    description: Ordered original pieces, including a complete table header path, without synthetic separators.
    attributes:
      kind: {equals_string: text_sequence}
      items: {multivalued: true, minimum_cardinality: 1, required: true}
  RecordNativeLocation:
    is_a: RecordScalar
    attributes:
      kind: {equals_string: native_location}
      pointer: {required: true}
  RecordSourcePin:
    is_a: SourceRecordProduct
    attributes:
      source: {required: true}
      native_product_task_id: {range: integer, minimum_value: 1, required: true}
      product_key: {required: true}
      product_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      projection_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      recipe_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      source_view_id: {range: integer, minimum_value: 1}
  RecordContextGap:
    is_a: SourceRecordProduct
    description: Model-coordinate diagnostic only; never a source locator or quote.
    attributes:
      model_start: {range: integer, minimum_value: 0, required: true}
      model_end: {range: integer, minimum_value: 1, required: true}
      reason: {required: true}
  RecordContextReading:
    is_a: SourceRecordProduct
    description: Computation diagnostic tied to exact context identity; excluded from source evidence-set identity.
    attributes:
      version: {range: integer, minimum_value: 2, maximum_value: 2, required: true}
      policy: {required: true, equals_string: synthetic-whitespace-1}
      context_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      model_start: {range: integer, minimum_value: 0, required: true}
      model_end: {range: integer, minimum_value: 1, required: true}
      gaps: {range: RecordContextGap, inlined: true, multivalued: true}
  RecordSourceBinding:
    is_a: SourceRecordProduct
    description: Versioned attribution; selected_context asserts selected custody only, never note applicability.
    attributes:
      version: {range: integer, required: true, minimum_value: 2, maximum_value: 2}
      relationship: {range: RecordSourceRelationship, required: true}
      policy: {required: true, equals_string: attributed-selected-source-2}
  RecordCapturedRecognition:
    is_a: SourceRecordProduct
    description: Exact captured text coordinates remain independent of the unchanged provider occurrence and observation precision.
    attributes:
      selected_occurrence_id: {required: true}
      task_id: {range: integer, minimum_value: 1, required: true}
      product_key: {required: true}
      content_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      occurrence_id: {required: true}
      relation_id: {required: true}
      endpoint_role: {range: RecordRecognitionRole, required: true}
      relation_kind: {required: true, equals_string: decision}
      relation_outcome: {range: RecordRecognitionOutcome, required: true}
      provider_occurrence_json: {required: true}
      observation_json: {required: true}
  RecordCoordinateText:
    is_a: SourceRecordProduct
    description: Explicit binding input, not persisted evidence or a claim of native authentication.
    attributes:
      pin: {range: RecordSourcePin, required: true, inlined: true}
      space: {range: RecordCoordinateSpace, required: true}
      pointer: {required: true}
      text: {required: true}
      recognition: {range: RecordCapturedRecognition, inlined: true}
  RecordAnchor:
    is_a: SourceRecordProduct
    attributes:
      anchor_id: {required: true}
      pin: {range: RecordSourcePin, required: true, inlined: true}
      space: {range: RecordCoordinateSpace, required: true}
      pointer: {required: true}
      precision: {range: RecordMappingPrecision, required: true}
      start: {range: integer, minimum_value: 0}
      end: {range: integer, minimum_value: 0}
      source_piece: {}
      binding: {range: RecordSourceBinding, inlined: true}
      recognition: {range: RecordCapturedRecognition, inlined: true}
  RecordEvidenceSet:
    is_a: SourceRecordProduct
    attributes:
      set_id: {required: true}
      role: {required: true}
      ordering: {range: RecordEvidenceOrdering, required: true}
      usage: {range: RecordEvidenceUsage, required: true}
      anchors: {multivalued: true, minimum_cardinality: 1, required: true}
  RecordFieldAlternative:
    is_a: SourceRecordProduct
    attributes:
      alternative_id: {required: true}
      value: {range: RecordScalar, required: true, inlined: true}
      evidence_sets: {multivalued: true}
      reason: {required: true}
  RecordField:
    is_a: SourceRecordProduct
    attributes:
      role: {required: true}
      kind: {range: RecordFieldKind, required: true}
      state: {range: RecordFieldState, required: true}
      meaning_changing: {range: boolean, required: true}
      evidence_status: {range: RecordEvidenceStatus, required: true}
      value: {range: RecordScalar, inlined: true}
      original: {}
      original_pieces: {multivalued: true}
      evidence_sets: {multivalued: true}
      alternatives: {range: RecordFieldAlternative, multivalued: true, inlined: true}
      reason: {}
      policy: {}
      rule: {}
      premises: {multivalued: true}
  LiteralRecordField:
    is_a: RecordField
    mixins: [MeaningChangingRecordField]
    attributes:
      kind: {equals_string: literal}
  ClassifiedRecordField:
    is_a: RecordField
    mixins: [MeaningChangingRecordField]
    attributes:
      kind: {equals_string: classified}
  NativeRecordField:
    is_a: RecordField
    mixins: [MeaningChangingRecordField]
    attributes:
      kind: {equals_string: native}
  MeaningChangingRecordField:
    is_a: RecordField
    description: An unresolved role prevents accepted standing; this is released meaning, not producer judgment.
  SupplementalLiteralRecordField:
    is_a: RecordField
    attributes:
      kind: {equals_string: literal}
  SupplementalClassifiedRecordField:
    is_a: RecordField
    attributes:
      kind: {equals_string: classified}
  TransformedRecordField:
    is_a: RecordField
    attributes:
      kind: {range: RecordTransformationKind, required: true}
  RequiredRecordField:
    is_a: MeaningChangingRecordField
    description: A released role whose meaning is required for accepted whole records.
  RequiredLiteralRecordField:
    is_a: LiteralRecordField
    mixins: [RequiredRecordField]
  RequiredClassifiedRecordField:
    is_a: ClassifiedRecordField
    mixins: [RequiredRecordField]
  RequiredNativeRecordField:
    is_a: NativeRecordField
    mixins: [RequiredRecordField]
  SemanticRecordFields:
    is_a: SourceRecordProduct
    description: Domain subclasses declare their complete role contract using field ranges.
    attributes:
      family: {required: true}
      occurrence_recipe: {required: true}
  SourceRecord:
    is_a: SourceRecordProduct
    description: Typed private source record; accepted standing is not native publication admission.
    attributes:
      record_id: {required: true}
      contract: {required: true}
      family: {required: true}
      occurrence_recipe: {required: true}
      pin: {range: RecordSourcePin, required: true, inlined: true}
      occurrence_anchors: {multivalued: true, minimum_cardinality: 1, required: true}
      interpretation_id: {required: true}
      standing: {range: RecordStanding, required: true}
      policy_version: {required: true}
      fields: {range: RecordField, multivalued: true, minimum_cardinality: 1, required: true, inlined: true}
      anchors: {range: RecordAnchor, multivalued: true, minimum_cardinality: 1, required: true, inlined: true}
      evidence_sets: {range: RecordEvidenceSet, multivalued: true, inlined: true}
      computation_dependencies: {multivalued: true}
      assertion_members: {multivalued: true}
enums:
  RecordSourceRelationship:
    permissible_values: {primary: {}, selected_context: {}}
  RecordRecognitionRole:
    permissible_values: {input: {}, evidence: {}, alternative: {}}
  RecordRecognitionOutcome:
    permissible_values: {selected: {}, added: {}, replaced: {}, retained_alternative: {}}
  RecordFieldState:
    permissible_values: {present: {}, unstated: {}, inapplicable: {}, unresolved: {}}
  RecordFieldKind:
    permissible_values: {literal: {}, classified: {}, native: {}, normalized: {}, derived: {}}
  RecordEvidenceStatus:
    permissible_values: {available: {}, unavailable: {}}
  RecordStanding:
    permissible_values: {candidate: {}, accepted: {}, rejected: {}, unresolved: {}}
  RecordCoordinateSpace:
    permissible_values: {selected_projection: {}, recognized_text: {}, native: {}, model_context: {}, captured_recognition: {}}
  RecordMappingPrecision:
    permissible_values: {exact: {}, item: {}, coarse: {}, unavailable: {}}
  RecordEvidenceOrdering:
    permissible_values: {ordered: {}, unordered: {}}
  RecordEvidenceUsage:
    permissible_values: {literal: {}, classification_cue: {}, native: {}, association: {}, context: {}}
  RecordTransformationKind:
    permissible_values: {normalized: {}, derived: {}}
  SourceMetricSubjectKind:
    permissible_values:
      source_view: {}
      run: {}
      segment: {}
  SourceMeasurementScope:
    permissible_values:
      source_view: {}
      run: {}
      rendition: {}
      segment: {}
      entity: {}
      claim: {}
      predicate: {}
      class: {}
      stage: {}
      method: {}
      rule: {}
  SourceCoverageOutcome:
    permissible_values:
      complete: {}
      partial: {}
      unknown: {}
      unsupported: {}
      failed: {}
