id: https://corpus-structure.dev/semantic/observations
name: semantic_observations
prefixes:
  csobs: https://corpus-structure.dev/semantic/observations/
default_prefix: csobs
default_range: string
types:
  contextual_float:
    base: float
    uri: http://www.w3.org/2001/XMLSchema#double
classes:
  SourceRecordProduct:
    abstract: true
    description: Private operation product, validated through released report boundaries; not a knowledge graph class or datatype.
  SourceValue:
    abstract: true
    attributes:
      kind: {required: true}
  SourceText:
    is_a: SourceValue
    attributes:
      kind: {equals_string: text}
      text: {required: true}
  SourceMeasurementValue:
    is_a: SourceValue
    abstract: true
  SourceInteger:
    is_a: SourceMeasurementValue
    attributes:
      kind: {equals_string: integer}
      integer: {range: integer, required: true}
  SourceFloat:
    is_a: SourceMeasurementValue
    attributes:
      kind: {equals_string: float}
      hexadecimal: {required: true}
  SourceBoolean:
    is_a: SourceValue
    attributes:
      kind: {equals_string: boolean}
      boolean: {range: boolean, required: true}
  SourceNull:
    is_a: SourceMeasurementValue
    attributes:
      kind: {equals_string: "null"}
  SourceArray:
    is_a: SourceValue
    attributes:
      kind: {equals_string: array}
      items: {range: SourceValue, multivalued: true, inlined: true}
  SourceField:
    attributes:
      name: {required: true}
      position: {range: integer, minimum_value: 0, required: true}
      value: {range: SourceValue, inlined: true, required: true}
  SourceObject:
    is_a: SourceValue
    attributes:
      kind: {equals_string: object}
      fields: {range: SourceField, multivalued: true, inlined: true}
  SourceObservationReference:
    attributes:
      observation_key: {required: true}
      role: {required: true}
  SourceObservation:
    description: An immutable source report, not an admitted knowledge assertion.
    attributes:
      observation_key: {required: true}
      item_key: {required: true}
      family: {required: true}
      outcome: {required: true}
      score: {range: SourceFloat, inlined: true}
      confidence_source: {}
      payload: {range: SourceObject, inlined: true, required: true}
      inputs: {range: SourceObservationReference, inlined: true, multivalued: true}
      source_view_id: {range: integer, minimum_value: 1}
      native_pointer: {}
      projected_start: {range: integer, minimum_value: 0}
      projected_end: {range: integer, minimum_value: 0}
      recognized_start: {range: integer, minimum_value: 0}
      recognized_end: {range: integer, minimum_value: 0}
      rendition_id: {range: integer}
      segment_id: {range: integer}
      span_start: {range: integer, minimum_value: 0}
      span_end: {range: integer, minimum_value: 0}
  SourceCoverage:
    attributes:
      family: {required: true}
      scope: {required: true}
      outcome: {range: SourceCoverageOutcome, required: true}
      reason: {}
      required_capability: {}
  SourceMeasurement:
    attributes:
      metric: {required: true}
      scope_type: {range: SourceMeasurementScope, required: true}
      scope_id: {range: integer}
      scope_key: {}
      value: {range: SourceMeasurementValue, inlined: true, required: true}
      detail: {range: SourceObject, inlined: true, required: true}
  SourceMetricDefinition:
    description: SourceNumberOrNull retains integer/float source kinds under the existing finite float-compatible measurement API. Native subject bindings support run and segment references.
    attributes:
      id: {required: true}
      value_type: {required: true, equals_string: SourceNumberOrNull}
      subject_kind: {required: true, range: SourceMetricSubjectKind}
      detail_schema: {required: true, equals_string: SourceObject}
      description: {required: true}
  SourceMeasurementSubject:
    attributes:
      kind: {range: SourceMetricSubjectKind, required: true}
      scope_id: {range: integer}
      scope_key: {}
  SourceMeasurementProducer:
    attributes:
      release_id: {required: true}
      run_id: {range: integer, required: true}
      task_id: {range: integer, required: true}
      invocation_key: {required: true}
      method: {required: true}
      operation_version: {required: true}
      configuration_hash: {required: true}
      input_hash: {required: true}
      unit_key: {required: true}
  SourceBoundMeasurement:
    attributes:
      source_position: {range: integer, minimum_value: 0, required: true}
      metric: {range: SourceMetricDefinition, required: true, inlined: true}
      subject: {range: SourceMeasurementSubject, required: true, inlined: true}
      producer: {range: SourceMeasurementProducer, required: true, inlined: true}
      value: {range: SourceMeasurementValue, required: true, inlined: true}
      detail: {range: SourceObject, required: true, inlined: true}
  SourceObservationBatch:
    is_a: SourceRecordProduct
    attributes:
      release_id: {required: true}
      invocation_key: {required: true}
      source: {required: true}
      method: {required: true}
      operation_version: {required: true}
      configuration_hash: {required: true}
      input_hash: {required: true}
      unit_key: {required: true}
      outcome: {required: true}
      error: {}
      cost: {range: SourceObject, inlined: true}
      parse_detail: {range: SourceObject, inlined: true}
      observations: {range: SourceObservation, multivalued: true, inlined: true}
      coverage: {range: SourceCoverage, multivalued: true, inlined: true}
      measurements: {range: SourceMeasurement, multivalued: true, inlined: true}
      records: {range: SourceRecord, multivalued: true, inlined: true}
      contribution_operations: {range: SourceContributionOperation, multivalued: true, inlined: true}
      contributions: {range: SourceContribution, multivalued: true, inlined: true}
      structural_product: {range: StructuralProductReport, inlined: true}
  LocalInterpretationReport:
    is_a: SourceRecordProduct
    description: Sealed private local question over an exact retained contribution selection; no admission authority.
    attributes:
      constraint_id: {required: true}
      contribution_ids: {multivalued: true}
      retained_input_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      dependencies: {multivalued: true, required: true, minimum_cardinality: 1}
      independent_baseline: {required: true, equals_string: retained_independent_contributions}
      probability_standing: {required: true}
      coupling_enabled: {required: true, range: boolean}
      policy_mode: {required: true, range: LocalInterpretationPolicyMode}
      policy_version: {required: true}
      outcome: {required: true, range: LocalInterpretationOutcome}
      reason: {required: true}
      request: {range: SourceObject, inlined: true}
      request_digest: {pattern: '^[0-9a-f]{64}$'}
      result: {range: SourceObject, inlined: true}
      result_digest: {pattern: '^[0-9a-f]{64}$'}
      seal: {required: true, pattern: '^[0-9a-f]{64}$'}
  RetainedContributionSourceBinding:
    is_a: SourceRecordProduct
    attributes:
      original_source_view_id: {range: integer, minimum_value: 1, required: true}
      current_source_view_id: {range: integer, minimum_value: 1, required: true}
      original_source: {required: true}
      current_source: {required: true}
      physical_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
  SourceContributionOperation:
    is_a: SourceRecordProduct
    description: One attributed semantic question under a shared invocation, including zero-output questions.
    attributes:
      operation_key: {required: true}
      question: {required: true}
      contextual_enrichment: {range: ContextualEnrichmentReport, inlined: true}
      operation_version: {required: true}
      outcome: {range: ContributionOperationOutcome, required: true}
      inspected_count: {range: integer, minimum_value: 0, required: true}
      emitted_count: {range: integer, minimum_value: 0, required: true}
      retained_task_id: {range: integer, minimum_value: 1}
      retained_result_digest: {pattern: '^[0-9a-f]{64}$'}
      retained_source_bindings: {range: RetainedContributionSourceBinding, multivalued: true, inlined: true}
      local_interpretation: {range: LocalInterpretationReport, inlined: true}
      report_digest: {pattern: '^[0-9a-f]{64}$'}
      inputs: {range: SourceObservationReference, inlined: true, multivalued: true}
      computation_dependencies: {multivalued: true}
      reason: {}
  ContributionEndpoint:
    is_a: SourceRecordProduct
    attributes:
      role: {required: true}
      contribution_id: {required: true}
  ContributionSemantics:
    is_a: SourceRecordProduct
    abstract: true
    description: Released extension boundary for domain vocabulary and private effects.
    attributes:
      kind: {range: ContributionKind, required: true}
      semantic_type: {required: true}
      effect: {required: true}
      assessment_event: {required: true}
  RetainedContributionSemantics:
    is_a: ContributionSemantics
    attributes:
      effect: {equals_string: retain_private}
      assessment_event: {equals_string: local-contribution-1}
  LocalContributionPublicationPolicy:
    is_a: SourceRecordProduct
    description: Exact native source location and quotation only; no semantic role, attachment or scientific truth.
    attributes:
      policy_id: {required: true, equals_string: exact-source-local-1}
      policy_version: {required: true, equals_string: '1'}
      event: {required: true, pattern: '^(source_occurrence|source_literal_quote)$'}
      basis: {required: true, equals_string: deterministic_native_source_coordinates}
  LocalSemanticPublicationPolicy:
    is_a: SourceRecordProduct
    description: Independently judged scoped denotation only; no universal confidence or canonical identity.
    attributes:
      policy_id: {required: true, equals_string: independent-contextual-relationship-2}
      policy_version: {required: true, equals_string: '1'}
      facet: {required: true, equals_string: relationship}
      rubric_version: {required: true, equals_string: contextual-relationship-2}
      context_policy: {required: true, equals_string: declared-native-source-and-extracted-components-2}
  ComponentBasis:
    is_a: SourceRecordProduct
    description: Attributed evidence for a private component; never an admission witness.
    attributes:
      kind: {required: true, pattern: '^(matched_cue|producer_group|native_geometry|model_reading|admitted_derivation)$'}
      dependencies: {multivalued: true, required: true, minimum_cardinality: 1}
      anchor_ids: {multivalued: true}
  LocatedComponentRole:
    is_a: SourceRecordProduct
    attributes:
      role: {required: true}
      anchor_ids: {multivalued: true, required: true, minimum_cardinality: 1}
      head_token: {range: integer, required: true, minimum_value: 0}
      expansion: {required: true, pattern: '^(exact|sentence_subtree|conjuncts|noun_chunk)$'}
      outcome: {required: true, pattern: '^(complete|partial|unresolved)$'}
  WitnessedComponent:
    is_a: SourceRecordProduct
    abstract: true
    description: Versioned private distinction with a declared question, basis and scope; no public effect.
    attributes:
      protocol: {required: true, equals_string: witnessed-component-1}
      kind: {required: true}
      question: {required: true}
      question_version: {required: true}
      scope: {required: true}
      effective_version: {}
      interpretation: {required: true, pattern: '^(unassessed|supported|incompatible|unresolved)$'}
      bases: {range: ComponentBasis, multivalued: true, inlined: true, required: true, minimum_cardinality: 1}
      dependencies: {multivalued: true, required: true, minimum_cardinality: 1}
  LocatedRoleComponent:
    is_a: WitnessedComponent
    attributes:
      kind: {equals_string: located_role}
      rule: {required: true}
      variant: {required: true}
      roles: {range: LocatedComponentRole, multivalued: true, inlined: true, required: true, minimum_cardinality: 1}
  DefinitionAttachmentComponent:
    is_a: WitnessedComponent
    attributes:
      kind: {equals_string: definition_attachment}
      term_contribution_id: {required: true}
      content_contribution_id: {required: true}
  UsageBindingComponent:
    is_a: WitnessedComponent
    attributes:
      kind: {equals_string: usage_binding}
      usage_contribution_id: {required: true}
      target_contribution_id: {required: true}
  ApplicabilityComponent:
    is_a: WitnessedComponent
    attributes:
      kind: {equals_string: applicability}
      usage_contribution_id: {required: true}
      component_contribution_id: {required: true}
  ScopedAttachmentComponent:
    is_a: WitnessedComponent
    attributes:
      kind: {equals_string: scoped_attachment}
      attachment_contribution_id: {required: true}
      target_contribution_id: {required: true}
      attachment_kind: {required: true}
  TypedComparisonComponent:
    is_a: WitnessedComponent
    attributes:
      kind: {equals_string: typed_comparison}
      left_contribution_id: {required: true}
      right_contribution_id: {required: true}
      dimension: {required: true}
  DossierMembershipComponent:
    is_a: WitnessedComponent
    attributes:
      kind: {equals_string: dossier_membership}
      root_contribution_id: {required: true}
      member_contribution_id: {required: true}
      member_role: {required: true}
  SourceContribution:
    is_a: SourceRecordProduct
    description: Independent private source product. No complete-record parent or knowledge authority is implied.
    attributes:
      contribution_id: {required: true}
      contract: {required: true}
      kind: {range: ContributionKind, required: true}
      semantic_type: {required: true}
      operation_key: {required: true}
      observation_key: {}
      item_key: {required: true}
      pin: {range: RecordSourcePin, inlined: true, required: true}
      anchors: {range: RecordAnchor, inlined: true, multivalued: true}
      occurrence_id: {}
      endpoints: {range: ContributionEndpoint, inlined: true, multivalued: true}
      members: {multivalued: true}
      component: {range: WitnessedComponent, inlined: true}
      disposition: {required: true}
      source_field_state: {range: RecordFieldState}
      anchor_role: {range: ContributionAnchorRole}
      standing: {required: true, equals_string: retained_private}
      score_state: {range: ContributionScoreState, required: true}
      score: {range: SourceValue, inlined: true}
      value: {range: SourceValue, inlined: true}
      reason: {}
      computation_dependencies: {multivalued: true}
  RecordScalar:
    is_a: SourceRecordProduct
    abstract: true
    attributes:
      kind: {required: true}
  RecordText:
    is_a: RecordScalar
    attributes:
      kind: {equals_string: text}
      text: {required: true}
  RecordDecimal:
    is_a: RecordScalar
    description: Exact finite decimal/scientific spelling; never a binary float projection.
    attributes:
      kind: {equals_string: decimal}
      lexical: {required: true, pattern: '^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'}
  RecordClassification:
    is_a: RecordScalar
    attributes:
      kind: {equals_string: classification}
      label: {required: true}
  RecordTextSequence:
    is_a: RecordScalar
    description: Ordered original pieces, including a complete table header path, without synthetic separators.
    attributes:
      kind: {equals_string: text_sequence}
      items: {multivalued: true, minimum_cardinality: 1, required: true}
  RecordNativeLocation:
    is_a: RecordScalar
    attributes:
      kind: {equals_string: native_location}
      pointer: {required: true}
  RecordSourcePin:
    is_a: SourceRecordProduct
    attributes:
      source: {required: true}
      native_product_task_id: {range: integer, minimum_value: 1, required: true}
      product_key: {required: true}
      product_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      projection_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      recipe_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      source_view_id: {range: integer, minimum_value: 1}
  RecordContextGap:
    is_a: SourceRecordProduct
    description: Model-coordinate diagnostic only; never a source locator or quote.
    attributes:
      model_start: {range: integer, minimum_value: 0, required: true}
      model_end: {range: integer, minimum_value: 1, required: true}
      reason: {required: true}
  RecordContextReading:
    is_a: SourceRecordProduct
    description: Computation diagnostic tied to exact context identity; excluded from source evidence-set identity.
    attributes:
      version: {range: integer, minimum_value: 2, maximum_value: 2, required: true}
      policy: {required: true, equals_string: synthetic-whitespace-1}
      context_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      model_start: {range: integer, minimum_value: 0, required: true}
      model_end: {range: integer, minimum_value: 1, required: true}
      gaps: {range: RecordContextGap, inlined: true, multivalued: true}
  RecordSourceBinding:
    is_a: SourceRecordProduct
    description: Versioned attribution; selected_context asserts selected custody only, never note applicability.
    attributes:
      version: {range: integer, required: true, minimum_value: 2, maximum_value: 2}
      relationship: {range: RecordSourceRelationship, required: true}
      policy: {required: true, equals_string: attributed-selected-source-2}
  RecordCapturedRecognition:
    is_a: SourceRecordProduct
    description: Exact captured text coordinates remain independent of the unchanged provider occurrence and observation precision.
    attributes:
      selected_occurrence_id: {required: true}
      task_id: {range: integer, minimum_value: 1, required: true}
      product_key: {required: true}
      content_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      occurrence_id: {required: true}
      relation_id: {required: true}
      endpoint_role: {range: RecordRecognitionRole, required: true}
      relation_kind: {required: true, equals_string: decision}
      relation_outcome: {range: RecordRecognitionOutcome, required: true}
      provider_occurrence_json: {required: true}
      observation_json: {required: true}
  RecordCoordinateText:
    is_a: SourceRecordProduct
    description: Explicit binding input, not persisted evidence or a claim of native authentication.
    attributes:
      pin: {range: RecordSourcePin, required: true, inlined: true}
      space: {range: RecordCoordinateSpace, required: true}
      pointer: {required: true}
      text: {required: true}
      recognition: {range: RecordCapturedRecognition, inlined: true}
  RecordAnchor:
    is_a: SourceRecordProduct
    attributes:
      anchor_id: {required: true}
      pin: {range: RecordSourcePin, required: true, inlined: true}
      space: {range: RecordCoordinateSpace, required: true}
      pointer: {required: true}
      precision: {range: RecordMappingPrecision, required: true}
      start: {range: integer, minimum_value: 0}
      end: {range: integer, minimum_value: 0}
      source_piece: {}
      binding: {range: RecordSourceBinding, inlined: true}
      recognition: {range: RecordCapturedRecognition, inlined: true}
  RecordEvidenceSet:
    is_a: SourceRecordProduct
    attributes:
      set_id: {required: true}
      role: {required: true}
      ordering: {range: RecordEvidenceOrdering, required: true}
      usage: {range: RecordEvidenceUsage, required: true}
      anchors: {multivalued: true, minimum_cardinality: 1, required: true}
  RecordFieldAlternative:
    is_a: SourceRecordProduct
    attributes:
      alternative_id: {required: true}
      value: {range: RecordScalar, required: true, inlined: true}
      evidence_sets: {multivalued: true}
      reason: {required: true}
  RecordField:
    is_a: SourceRecordProduct
    attributes:
      role: {required: true}
      kind: {range: RecordFieldKind, required: true}
      state: {range: RecordFieldState, required: true}
      meaning_changing: {range: boolean, required: true}
      evidence_status: {range: RecordEvidenceStatus, required: true}
      value: {range: RecordScalar, inlined: true}
      original: {}
      original_pieces: {multivalued: true}
      evidence_sets: {multivalued: true}
      alternatives: {range: RecordFieldAlternative, multivalued: true, inlined: true}
      reason: {}
      policy: {}
      rule: {}
      premises: {multivalued: true}
  LiteralRecordField:
    is_a: RecordField
    mixins: [MeaningChangingRecordField]
    attributes:
      kind: {equals_string: literal}
  ClassifiedRecordField:
    is_a: RecordField
    mixins: [MeaningChangingRecordField]
    attributes:
      kind: {equals_string: classified}
  NativeRecordField:
    is_a: RecordField
    mixins: [MeaningChangingRecordField]
    attributes:
      kind: {equals_string: native}
  MeaningChangingRecordField:
    is_a: RecordField
    description: An unresolved role prevents accepted standing; this is released meaning, not producer judgment.
  SupplementalLiteralRecordField:
    is_a: RecordField
    attributes:
      kind: {equals_string: literal}
  SupplementalClassifiedRecordField:
    is_a: RecordField
    attributes:
      kind: {equals_string: classified}
  TransformedRecordField:
    is_a: RecordField
    attributes:
      kind: {range: RecordTransformationKind, required: true}
  RequiredRecordField:
    is_a: MeaningChangingRecordField
    description: A released role whose meaning is required for accepted whole records.
  RequiredLiteralRecordField:
    is_a: LiteralRecordField
    mixins: [RequiredRecordField]
  RequiredClassifiedRecordField:
    is_a: ClassifiedRecordField
    mixins: [RequiredRecordField]
  RequiredNativeRecordField:
    is_a: NativeRecordField
    mixins: [RequiredRecordField]
  SemanticRecordFields:
    is_a: SourceRecordProduct
    description: Domain subclasses declare their complete role contract using field ranges.
    attributes:
      family: {required: true}
      occurrence_recipe: {required: true}
  SourceRecord:
    is_a: SourceRecordProduct
    description: Typed private source record; accepted standing is not native publication admission.
    attributes:
      record_id: {required: true}
      contract: {required: true}
      family: {required: true}
      occurrence_recipe: {required: true}
      pin: {range: RecordSourcePin, required: true, inlined: true}
      occurrence_anchors: {multivalued: true, minimum_cardinality: 1, required: true}
      interpretation_id: {required: true}
      standing: {range: RecordStanding, required: true}
      policy_version: {required: true}
      fields: {range: RecordField, multivalued: true, minimum_cardinality: 1, required: true, inlined: true}
      anchors: {range: RecordAnchor, multivalued: true, minimum_cardinality: 1, required: true, inlined: true}
      evidence_sets: {range: RecordEvidenceSet, multivalued: true, inlined: true}
      computation_dependencies: {multivalued: true}
      assertion_members: {multivalued: true}
  ContextualProfile:
    is_a: SourceRecordProduct
    attributes:
      sentence_transformers_version: {required: true}
      transformers_version: {required: true}
      torch_version: {required: true}
      tokenizers_version: {required: true}
      profile_id: {required: true}
      model: {required: true}
      revision: {required: true, pattern: '^[0-9a-f]{40}$'}
      dimension: {range: integer, minimum_value: 1, maximum_value: 16000, required: true}
      query_prompt: {required: true}
      document_prompt: {required: true}
      pooling: {required: true, pattern: '^(mean|lasttoken)$'}
      max_tokens: {range: integer, minimum_value: 1, required: true}
      batch_size: {range: integer, minimum_value: 1, required: true}
      max_items: {range: integer, minimum_value: 1, required: true}
      max_input_bytes: {range: integer, minimum_value: 1, required: true}
      timeout_seconds: {range: contextual_float, required: true}
      recipe: {required: true}
  ContextualVector:
    is_a: SourceRecordProduct
    attributes:
      vector_id: {required: true}
      object_id: {required: true}
      source_binding: {required: true}
      profile_id: {required: true}
      representation_digest: {required: true}
      input_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      values: {range: contextual_float, multivalued: true, minimum_cardinality: 1, required: true}
  ContextualTarget:
    is_a: SourceRecordProduct
    attributes:
      target_id: {required: true}
      representation_digest: {required: true}
      source_binding: {required: true}
      label: {required: true}
      description: {required: true}
      aliases: {multivalued: true}
      type_name: {}
      parent: {}
      scope: {required: true}
      effective_version: {}
  ContextualInventory:
    is_a: SourceRecordProduct
    attributes:
      inventory_id: {required: true}
      source_selection: {required: true}
      scope: {required: true}
      effective_version: {}
      targets: {range: ContextualTarget, inlined: true, multivalued: true}
      semantic_groups: {range: ContextualSemanticTargetGroup, inlined: true, multivalued: true, required: true}
      reliable_type: {}
      parent: {}
  ContextualTargetMeaning:
    is_a: SourceRecordProduct
    description: Exactly source-resolved component meaning or an explicitly curator-owned singleton descriptor; native and pure binding enforce the disjoint variants.
    attributes:
      term: {range: StructuralPublicCitation, inlined: true}
      content: {range: StructuralPublicCitation, inlined: true}
      interpretation: {range: StructuralDefinitionInterpretationValue}
      scope: {}
      effective_version: {}
      curated_target: {range: ContextualTarget, inlined: true}
  ContextualSemanticTargetGroup:
    is_a: SourceRecordProduct
    attributes:
      target_id: {required: true}
      member_target_ids: {required: true, multivalued: true, minimum_cardinality: 1}
      meaning: {required: true, range: ContextualTargetMeaning, inlined: true}
  ContextualChannelEvidence:
    is_a: SourceRecordProduct
    attributes:
      channel: {required: true, pattern: '^(alias|lexical|dense)$'}
      rank: {range: integer, minimum_value: 1, required: true}
