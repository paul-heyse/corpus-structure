id: https://corpus-structure.dev/semantic/parsing-products
name: parsing_products
prefixes:
  pp: https://corpus-structure.dev/parsing/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: pp
default_range: ParsingString
types:
  ParsingString:
    base: str
    uri: xsd:string
  ParsingInteger:
    base: int
    uri: xsd:integer
  ParsingBoolean:
    base: bool
    uri: xsd:boolean
enums:
  ParsingMacroEventStatus:
    permissible_values: {accepted: {}, ignored: {}, replaced: {}, unsupported: {}, invalid: {}}
  CoordinateUnit:
    permissible_values:
      byte: &id001 {}
      codepoint: *id001
  RepresentationKind:
    permissible_values:
      artifact: {}
      parse_view: {}
      original: &id002 {}
      decoded: *id002
      canonical: *id002
      expanded: *id002
  ParsingCoverage:
    permissible_values:
      complete: &id003 {}
      partial: *id003
      unknown: *id003
      unsupported: *id003
  ProvenanceUniverse:
    permissible_values: {canonical_output: {}}
  MappingFidelity:
    permissible_values:
      transformed: {}
      exact: &id004 {}
      synthetic: *id004
      excluded: *id004
      unknown: *id004
  EndpointSide:
    permissible_values:
      source: &id005 {}
      target: *id005
  ParsingLifecycle:
    permissible_values:
      not_requested: &id006 {}
      pending: *id006
      running: *id006
      available: *id006
      failed: *id006
      cancelled: *id006
  ParsingMeaning:
    permissible_values:
      ok: &id007 {}
      ambiguous: *id007
      invalid: *id007
      unsupported: *id007
      unknown: *id007
  ComponentCategory:
    permissible_values:
      control_word: {}
      control_symbol: {}
      group_open: {}
      group_close: {}
      parameter: {}
      character: {}
      attribute_name: {}
      attribute_value: {}
      attribute_delimiter: {}
      tag_open: {}
      tag_close: {}
      tag_name: {}
      doctype: {}
      raw_text: {}
      character_reference: {}
      malformed: {}
      canonical_separator: {}
      marker: {}
      encoding_marker: {}
      markup: {}
      text: {}
      whitespace: {}
      comment: {}
      math: {}
      reference: {}
      unknown: {}
  TextSlotLocation:
    permissible_values: {text: {}, tail: {}}
  AttributeOutcome:
    permissible_values: {retained: {}, discarded_duplicate: {}, unknown: {}}
  StructuralKind:
    permissible_values:
      macro: {}
      unknown_macro: {}
      chars: {}
      environment: {}
      subscript: {}
      superscript: {}
      specials: {}
      parse_view: {}
      macro_definition: {}
      macro_event: {}
      macro_invocation: {}
      attribute: {}
      document: &id010 {}
      element: *id010
      text: *id010
      comment: *id010
      math: *id010
      group: *id010
      symbol: *id010
  RelationshipKind:
    permissible_values:
      text_of: {}
      attribute_of: {}
      contains: &id011 {}
      reference: *id011
      binds: *id011
      derived_from: *id011
      sequence: *id011
      structural_parent: {}
  EndpointRole:
    permissible_values:
      text: {}
      attribute: {}
      owner: {}
      parent: &id012 {}
      child: *id012
      source: *id012
      target: *id012
      invocation: *id012
      argument: *id012
      definition: *id012
      default: *id012
      fallback: *id012
      member: *id012
  MappingOperation:
    permissible_values:
      decode: &id013 {}
      normalize: *id013
      copy: *id013
      repair: *id013
      exclude: *id013
      expand: *id013
      project: *id013
      synthetic: *id013
  ParsingRecipe:
    permissible_values:
      source-products-v1: {}
  NodeOrigin:
    permissible_values:
      derived: {}
      literal: &id014 {}
      synthetic: *id014
  ParsingProductKind:
    permissible_values:
      source: {}
      text: {}
      interpretation: {}
      assessment: {}
  ParsingDependencyKind:
    permissible_values:
      product: {}
      artifact: {}
classes:
  ParsingExtent:
    attributes:
      representation_id:
        range: ParsingString
        required: true
        slot_uri: pp:ParsingExtent_representation_id
      unit:
        range: CoordinateUnit
        required: true
        slot_uri: pp:ParsingExtent_unit
      start_offset:
        range: ParsingInteger
        required: true
        slot_uri: pp:ParsingExtent_start_offset
        minimum_value: 0
      end_offset:
        range: ParsingInteger
        required: true
        slot_uri: pp:ParsingExtent_end_offset
        minimum_value: 0
  ParsingRepresentation:
    attributes:
      text_content_utf8_base64: {range: ParsingString, slot_uri: pp:ParsingRepresentation_text_content_utf8_base64}

      representation_id:
        range: ParsingString
        required: true
        slot_uri: pp:ParsingRepresentation_representation_id
      kind:
        range: RepresentationKind
        required: true
        slot_uri: pp:ParsingRepresentation_kind
      unit:
        range: CoordinateUnit
        required: true
        slot_uri: pp:ParsingRepresentation_unit
      extent_length:
        range: ParsingInteger
        required: true
        slot_uri: pp:ParsingRepresentation_extent_length
        minimum_value: 0
      text_content:
        range: ParsingString
        required: false
        slot_uri: pp:ParsingRepresentation_text_content
      partition_state:
        range: ParsingCoverage
        required: true
        slot_uri: pp:ParsingRepresentation_partition_state
      recognition_state:
        range: ParsingCoverage
        required: true
        slot_uri: pp:ParsingRepresentation_recognition_state
      encoding:
        range: ParsingString
        slot_uri: pp:ParsingRepresentation_encoding
      decoder:
        range: ParsingString
        slot_uri: pp:ParsingRepresentation_decoder
      newline_policy:
        range: ParsingString
        slot_uri: pp:ParsingRepresentation_newline_policy
  ParsingComponent:
    attributes:
      component_id:
        range: ParsingString
        required: true
        slot_uri: pp:ParsingComponent_component_id
      ordinal:
        range: ParsingInteger
        required: true
        slot_uri: pp:ParsingComponent_ordinal
        minimum_value: 0
      category:
        range: ComponentCategory
        required: true
        slot_uri: pp:ParsingComponent_category
    is_a: ParsingExtent
  ParsingNode:
    abstract: true
    attributes:
      node_id:
        range: ParsingString
        required: true
        slot_uri: pp:ParsingNode_node_id
      kind:
        range: StructuralKind
        required: true
        slot_uri: pp:ParsingNode_kind
      representation_id:
        range: ParsingString
        required: false
        slot_uri: pp:ParsingNode_representation_id
      unit:
        range: CoordinateUnit
        required: false
        slot_uri: pp:ParsingNode_unit
      start_offset:
        range: ParsingInteger
        required: false
        slot_uri: pp:ParsingNode_start_offset
        minimum_value: 0
      end_offset:
        range: ParsingInteger
        required: false
        slot_uri: pp:ParsingNode_end_offset
        minimum_value: 0
      origin:
        range: NodeOrigin
        required: true
        slot_uri: pp:ParsingNode_origin
      origin_reason:
        range: ParsingString
        slot_uri: pp:ParsingNode_origin_reason
      name:
        range: ParsingString
        slot_uri: pp:ParsingNode_name
      ordinal:
        range: ParsingInteger
        slot_uri: pp:ParsingNode_ordinal
  ParsingDocumentNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: document
        slot_uri: pp:ParsingDocumentNode_kind
  ParsingElementNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: element
        slot_uri: pp:ParsingElementNode_kind
  ParsingCommentNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: comment
        slot_uri: pp:ParsingCommentNode_kind
      value:
        range: ParsingString
        slot_uri: pp:ParsingNode_value
  ParsingMathNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: math
        slot_uri: pp:ParsingMathNode_kind
      value:
        range: ParsingString
        slot_uri: pp:ParsingNode_value
  ParsingGroupNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: group
        slot_uri: pp:ParsingGroupNode_kind
      value:
        range: ParsingString
        slot_uri: pp:ParsingNode_value
  ParsingSymbolNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: symbol
        slot_uri: pp:ParsingSymbolNode_kind
      value:
        range: ParsingString
        slot_uri: pp:ParsingNode_value
  ParsingAttributeNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: attribute
        slot_uri: pp:ParsingAttributeNode_kind
      origin:
        range: string
        required: true
        slot_uri: pp:ParsingNode_origin
        equals_string: literal
      representation_id:
        range: ParsingString
        required: true
        slot_uri: pp:ParsingNode_representation_id
      unit:
        range: CoordinateUnit
        required: true
        slot_uri: pp:ParsingNode_unit
      start_offset:
        range: ParsingInteger
        required: true
        slot_uri: pp:ParsingNode_start_offset
        minimum_value: 0
      end_offset:
        range: ParsingInteger
        required: true
        slot_uri: pp:ParsingNode_end_offset
        minimum_value: 0
      name:
        range: ParsingString
        slot_uri: pp:ParsingNode_name
        required: true
      value:
        range: ParsingString
        slot_uri: pp:ParsingNode_value
        required: true
      ordinal:
        range: ParsingInteger
        slot_uri: pp:ParsingNode_ordinal
        required: true
        minimum_value: 0
      attribute_outcome:
        range: AttributeOutcome
        slot_uri: pp:ParsingNode_attribute_outcome
        required: true
      name_start_offset:
        range: ParsingInteger
        slot_uri: pp:ParsingNode_name_start_offset
        required: false
      name_end_offset:
        range: ParsingInteger
        slot_uri: pp:ParsingNode_name_end_offset
        required: false
      value_start_offset:
        range: ParsingInteger
        slot_uri: pp:ParsingNode_value_start_offset
        required: false
      value_end_offset:
        range: ParsingInteger
        slot_uri: pp:ParsingNode_value_end_offset
        required: false
  ParsingTextSlotNode:
    is_a: ParsingNode
    attributes:
      kind:
        range: string
        required: true
        equals_string: text
        slot_uri: pp:ParsingTextSlotNode_kind
      origin:
        range: string
        required: true
        slot_uri: pp:ParsingNode_origin
