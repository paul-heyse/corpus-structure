id: https://corpus-structure.dev/semantic/pdf-staging
name: pdf_staging
prefixes:
  pds: https://corpus-structure.dev/pdf-staging/
default_prefix: pds
default_range: PdfRecordString
annotations:
  pds:artifact_profiles: '{"assembly": "docling-page-assembly-v2", "raster": "docling-native-raster-png-v1",
    "candidates": "docling-inline-candidates-v1", "native_completion": "pdf-native-completion-jsonl-v1",
    "native_recipe": "pdf-native-recipe-json-v1", "retained_envelope": "retained-pdf-envelope-json-v1"}'
  pds:companion_profile: '{"prefix":"pdf-selected-companions-jsonl-v1:","families":["input","occurrence","relation","mapping_report","coverage","health"]}'
  pds:upload_size_semantics: max_bytes bounds Arrow transfer buffers; max_native_bytes bounds typed native logical extents with null bitmap and varlena headers, independent of JSON hex rendering and TOAST compression
  pds:upload_profile: '{"max_rows":65536,"max_bytes":8388608,"max_native_bytes":8388608,"max_replay_key_bytes":1024}'
  pds:projection_write_profile: '{"allowed_isolation":["read committed"],"rationale":"Projection adoption requires a fresh statement snapshot after the build lock so finalized validation membership cannot be missed."}'
  pds:integrated_metadata_policy: '{"inherited_metadata_kinds":["inline_candidate_pages"],"generated_metadata_kinds":["formula_outcomes"],"formula_outcome":"unknown","inline_coverage":"unknown","cell_coverage":"unknown","allow_scoped_coverage":false}'
  pds:publication_identity_profile: pdf-record-sha256-fold-v1
  pds:publication_record_profile: '{"id": "pdf-publication-records-v2", "fold": "pdf-record-sha256-fold-v1",
    "companion": {"family": "companion/<family>", "key": "local_id", "fields": ["body", "ordinal"], "native_metadata_suffix": ["value"], "occurrence_suffix": ["text"], "body":
    "data.canonical_json excluding value/text; selected IPC metadata uses typed logical digest; other metadata uses Python identity.canonical_bytes UTF8; optional occurrence text UTF8; absent a and null n distinct"}, "endpoint": {"family": "endpoint", "key": "ascii-json:[relation_id,ordinal]",
    "fields": ["relation_id", "ordinal", "target_task_id", "target_product_key", "target_content_digest",
    "occurrence_id", "role"], "self_reference": [0, "@self", "@self"]}, "native_map_order": "original
    map encounter order retained for exact reconstruction; logical map identity is key-based; ordinary
    array order is identity-bearing", "publication": {"family": "publication", "key": "root", "fields":
    ["kind", "recipe_digest"], "authority": "frozen build"}}'
  pds:companion_field_profile: '{"value":{"family":"native_metadata","encoding":"pdf-companion-json-field-v1","scalar_kind":"y","presence":"required; JSON null is present bytes null","canonicalizer":"corpus_structure.semantic.identity.canonical_bytes"},"text":{"family":"occurrence","encoding":"pdf-record-scalar-v1:s","scalar_kind":"s","presence":"optional; absent and explicit null remain inline distinct kinds"}}'
  pds:metadata_classes: '{"runtime_report":"PdfRuntimeReport","inline_candidate_pages":"PdfInlineCandidatePage","derivation_mappings":"PdfDerivationMapping","cell_reports":"PdfCellReport","inline_alignment_reports":"PdfInlineAlignmentReport","recognition_coverage":"PdfRecognitionCoverage","formula_outcomes":"PdfFormulaOutcome"}'
  pds:structured_payload_profile: '{"kind":"inline_candidate_pages","profile":"pdf-ocr-candidate-ipc-v1","scalar_kind":"y","locators":["page_no","payload_schema_digest","payload_codec","payload_logical_digest"],"interior_authority":"released runtime schema and exact captured bytes","identity":"domain-separated decoded typed logical digest; frozen inventory independently binds physical bytes"}'
  pds:metadata_validation: selected inline_candidate_pages use runtime validation of exact Arrow IPC bytes; other kinds use pg_jsonschema 0.3.4 public.json_matches_schema on actual JSON field bytes; released model JSON Schema plus exact typed projection const/presence constraints; no whole-value PostgreSQL JSON traversal or string substitution
  pds:scope_health_projection: pointer/outcome plus optional qualified PdfCompanionReference when originalerror field is present; exact metadata bytes retain originalerror; no string substitution
  pds:formula_health_projection: outcome and has_diagnostic envelope fields correspond exactly to raw metadata JSON outcome and error presence
  pds:metadata_pointer_projection: first present string value.pointer/value.prose_pointer/value.table_pointer; exact admission correspondence; absent otherwise

enums:
  PdfStageState:
    permissible_values:
      open: {}
      abandoned: {}
      frozen: {}
      published: {}
  PdfCompanionFamily:
    permissible_values:
      input: {}
      occurrence: {}
      relation: {}
      mapping_report: {}
      coverage: {}
      health: {}
      request_outcome: {}
      native_metadata: {}
  PdfCompanionFieldName:
    permissible_values:
      value: {}
      text: {}
      endpoints: {}
      evidence: {}
  PdfCompanionScalarKind:
    permissible_values:
      y: {}
      s: {}
  PdfPublicationKind:
    permissible_values:
      native: {}
      integrated: {}
classes:
  PdfStageBuild:
    description: Private mutable producer build, fenced by the existing task attempt; never a published
      product.
    attributes:
      build_id:
        required: true
      task_id:
        range: PdfRecordInteger
        required: true
      run_id:
        range: PdfRecordInteger
        required: true
      release_id:
        required: true
      source_digest:
        required: true
      recipe_digest:
        required: true
      schema_digest:
        required: true
      replay_key:
        required: true
      attempt:
        range: PdfRecordInteger
        required: true
      holder:
        required: true
      state:
        range: PdfStageState
        required: true
  PdfStageReceipt:
    description: Immutable receipt over one actual uploaded bounded batch, distinct from publication.
    attributes:
      build_id:
        required: true
      replay_key:
        required: true
      content_digest:
        required: true
      row_count:
        range: PdfRecordInteger
        required: true
        minimum_value: 0
  PdfFrozenBuild:
    attributes:
      build_id:
        range: PdfRecordString
        required: true
      frozen_digest:
        range: PdfRecordString
        required: true
      kind:
        range: PdfPublicationKind
        required: true
  PdfRecordCompanion:
    attributes:
      product_id:
        range: PdfRecordString
        required: true
      revision_id:
        range: PdfRecordString
        required: true
      family:
        range: PdfCompanionFamily
        required: true
      local_id:
        range: PdfRecordString
        required: true
      body:
        range: PdfRecordJson
        required: true
      ordinal:
        range: PdfRecordInteger
        required: true
  PdfRecordCompanionField:
    description: Fixed typed companion value fields stored as verified segmented bytes.
    attributes:
      product_id:
        range: PdfRecordString
        required: true
      revision_id:
        range: PdfRecordString
        required: true
      family:
        range: PdfCompanionFamily
        required: true
      local_id:
        range: PdfRecordString
        required: true
      field_name:
        range: PdfCompanionFieldName
        required: true
      stream_id:
        range: PdfRecordString
        required: true
      scalar_kind:
        range: PdfCompanionScalarKind
        required: true
  PdfRecordEndpoint:
    attributes:
      product_id:
        range: PdfRecordString
        required: true
      revision_id:
        range: PdfRecordString
        required: true
      relation_id:
        range: PdfRecordString
        required: true
      ordinal:
        range: PdfRecordInteger
        required: true
      target_task_id:
        range: PdfRecordInteger
        required: true
      target_product_key:
        range: PdfRecordString
        required: true
      target_content_digest:
        range: PdfRecordString
        required: true
      occurrence_id:
        range: PdfRecordString
        required: true
      role:
        range: PdfRecordString
        required: true
  PdfPublishedRevision:
    attributes:
      build_id:
        range: PdfRecordString
        required: true
      task_id:
        range: PdfRecordInteger
        required: true
      product_key:
        range: PdfRecordString
        required: true
      logical_digest:
        range: PdfRecordString
        required: true
      release_id:
        range: PdfRecordString
        required: true
      source_digest:
        range: PdfRecordString
        required: true
      schema_digest:
        range: PdfRecordString
        required: true
      recipe_digest:
        range: PdfRecordString
        required: true
      frozen_digest:
        range: PdfRecordString
        required: true
      kind:
        range: PdfPublicationKind
        required: true
  PdfBuildValidation:
    attributes:
      build_id:
        range: PdfRecordString
        required: true
      frozen_digest:
        range: PdfRecordString
        required: true
      logical_digest:
        range: PdfRecordString
        required: true
      contract_digest:
        range: PdfRecordString
        required: true
      native_callbacks:
        range: boolean
        required: true
      native_contract_digest:
        required: true
  PdfRecordAccess:
    annotations:
      pds:record_boundary_role: derived_core
    attributes:
      product_id:
        required: true
      revision_id:
        required: true
      pointer:
        range: string
        required: true
      ordinal:
        range: integer
        required: true
      label:
        range: string
        required: true
      parent_pointer:
        range: string
        required: false
      section_pointer:
        range: string
        required: false
      content_layer:
        range: string
        required: true
      text:
        range: string
        required: false
      native_json:
        range: json_payload
        required: true
  PdfRecordRegion:
    annotations:
      pds:record_boundary_role: derived_core
    attributes:
      product_id:
        required: true
      revision_id:
        required: true
      pointer:
        range: string
        required: true
      region_index:
        range: integer
        required: true
      page_no:
        range: integer
        required: true
      page_width:
        range: exact_numeric
        required: true
      page_height:
        range: exact_numeric
        required: true
      left:
        range: exact_numeric
        required: true
      top:
        range: exact_numeric
        required: true
      right:
        range: exact_numeric
        required: true
      bottom:
        range: exact_numeric
        required: true
      origin:
        range: string
        required: true
  PdfStageRecipe:
    attributes:
      task_id:
        range: PdfRecordInteger
        required: true
      source_digest:
        range: PdfRecordString
        required: true
      root_recipe_digest:
        range: PdfRecordString
        required: true
      stage_recipe_digest:
        range: PdfRecordString
        required: true
      release_id:
        range: PdfRecordString
        required: true
  PdfNativeValidationOutcome:
    description: Pinned native callback outcome over an exact immutable captured candidate, distinct from
      independent server closure.
    attributes:
      build_id:
        range: PdfRecordString
        required: true
      frozen_digest:
        range: PdfRecordString
        required: true
      contract_digest:
        range: PdfRecordString
        required: true
      passed:
        range: boolean
        required: true
  PdfValidationCheck:
    description: Protected check result over one sealed projection and live build attempt.
    attributes:
      build_id: {required: true}
      attempt: {range: PdfRecordInteger, required: true}
      holder: {required: true}
      frozen_digest: {required: true}
      contract_digest: {required: true}
      check_name: {required: true}
      result_digest: {required: true}
      predecessor_build_id: {}
