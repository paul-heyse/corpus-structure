id: https://corpus-structure.dev/semantic/core
name: semantic_core
prefixes:
  cs: https://corpus-structure.dev/semantic/
  xsd: http://www.w3.org/2001/XMLSchema#
  prov: http://www.w3.org/ns/prov#
  core: https://corpus-structure.dev/core/
default_prefix: cs
default_range: string
types:
  string:
    base: str
    uri: xsd:string
  decimal:
    base: Decimal
    uri: xsd:decimal
  boolean:
    base: bool
    uri: xsd:boolean
  integer:
    base: int
    uri: xsd:integer
  datetime:
    base: datetime
    uri: xsd:dateTime
  date:
    base: date
    uri: xsd:date
  float:
    base: float
    uri: xsd:double
classes:
  Value:
    abstract: true
    attributes:
      kind:
        required: true
  TextValue:
    is_a: Value
    attributes:
      kind:
        equals_string: text
      text:
        required: true
  NumberValue:
    is_a: Value
    attributes:
      kind:
        equals_string: number
      number:
        range: decimal
        required: true
  QuantityValue:
    is_a: Value
    attributes:
      kind:
        equals_string: quantity
      number:
        range: decimal
        required: true
      unit:
        required: true
      basis:
        description: The reference basis stated by the source, when present.
  EntityValue:
    is_a: Value
    attributes:
      kind:
        equals_string: entity
      target:
        range: Entity
        required: true
  CollectionValue:
    is_a: Value
    attributes:
      kind:
        equals_string: collection
      members:
        range: Value
        multivalued: true
        inlined: true
        required: true
  RoleBinding:
    attributes:
      role:
        required: true
      ordinal:
        range: integer
        minimum_value: 0
        required: true
      value:
        range: Value
        inlined: true
        required: true
  RecordValue:
    is_a: Value
    attributes:
      kind:
        equals_string: record
      roles:
        range: RoleBinding
        multivalued: true
        inlined: true
        required: true
  Entity:
    attributes:
      id:
        identifier: true
      label:
        description: Source display name; selection does not replace source naming
          occurrences.
        annotations:
          cs:role: display
          cs:display_order: 0
          cs:constraint_scope: accepted_value
      aliases:
        multivalued: true
        description: Source naming alternatives, independent of semantic identity
          rules.
        annotations:
          cs:role: display
          cs:display_order: 1
  SemanticScope:
    attributes:
      extent:
        range: ScopeExtent
        required: true
      locator:
        required: true
  Qualification:
    attributes:
      modality:
        required: true
        range: ClaimModality
      polarity:
        range: boolean
        required: true
      hedge:
        range: TextValue
        inlined: true
        description: Source hedging language; retained as meaning-bearing context.
      attribution:
        range: Entity
        description: The entity to which the source attributes the assertion.
      scope:
        range: SemanticScope
        inlined: true
      condition:
        range: Condition
        inlined: true
      valid_time:
        range: ValidityInterval
        inlined: true
        description: Source-stated validity, including partial or symbolic bounds.
      valid_from:
        range: datetime
      valid_until:
        range: datetime
  AssertionOccurrence:
    attributes:
      id:
        identifier: true
      subject:
        range: Entity
        required: true
      predicate:
        required: true
      object:
        range: Value
        inlined: true
        required: true
      qualification:
        range: Qualification
        inlined: true
        required: true
      source:
        required: true
      item:
        required: true
      establishment:
        range: Establishment
        required: true
  SemanticFact:
    attributes:
      id:
        identifier: true
      subject:
        range: Entity
        required: true
      predicate:
        required: true
      object:
        range: Value
        inlined: true
        required: true
      qualification:
        range: Qualification
        inlined: true
        required: true
  ExpressionValue:
    is_a: MathematicalExpression
    attributes:
      kind:
        equals_string: expression
  IntervalValue:
    is_a: Value
    attributes:
      kind:
        equals_string: interval
      lower:
        range: NumberValue
        inlined: true
      upper:
        range: NumberValue
        inlined: true
      lower_closed:
        range: boolean
        required: true
      upper_closed:
        range: boolean
        required: true
  BooleanValue:
    is_a: Value
    attributes:
      kind:
        equals_string: boolean
      boolean:
        range: boolean
        required: true
  DateValue:
    is_a: Value
    attributes:
      kind:
        equals_string: date
      date:
        range: date
        required: true
  InstantValue:
    is_a: Value
    attributes:
      kind:
        equals_string: instant
      instant:
        range: datetime
        required: true
  ExpressionBinding:
    abstract: true
    attributes:
      kind:
        required: true
      symbol:
        required: true
  VariableBinding:
    is_a: ExpressionBinding
    attributes:
      kind:
        equals_string: variable
      entity:
        range: Entity
        required: true
  FamilyParameterBinding:
    is_a: ExpressionBinding
    attributes:
      kind:
        equals_string: family_param
      entity:
        range: Entity
        required: true
  ParameterOfBinding:
    is_a: ExpressionBinding
    attributes:
      kind:
        equals_string: param_of
      claim:
        required: true
        annotations:
          cs:reference_role: fact
      parameter:
        required: true
  ParameterExpressionOfBinding:
    is_a: ExpressionBinding
    attributes:
      kind:
        equals_string: param_expr_of
      claim:
        required: true
        annotations:
          cs:reference_role: fact
      parameter:
        required: true
  FreeBinding:
    is_a: ExpressionBinding
    attributes:
      kind:
        equals_string: free
  ConstantBinding:
    is_a: ExpressionBinding
    attributes:
      kind:
        equals_string: constant
  UnresolvedBinding:
    is_a: ExpressionBinding
    attributes:
      kind:
        equals_string: unresolved
  MathematicalExpression:
    is_a: Value
    abstract: true
    attributes:
      language:
        required: true
      expression:
        required: true
      form:
        range: ExpressionForm
      bindings:
        range: ExpressionBinding
        multivalued: true
        inlined: true
      macro_context:
        range: ExpressionMacro
        multivalued: true
        inlined: true
        description: Source-bound definitions needed to interpret this expression;
          supplied by source projection.
  ValidityInterval:
    is_a: Value
    description: An absent validity bound is unbounded; absent inclusivity remains unknown.
    attributes:
      kind:
        equals_string: validity_interval
      start:
        range: Value
        inlined: true
      end:
        range: Value
        inlined: true
      start_incl:
        range: boolean
      end_incl:
        range: boolean
  PartialDateValue:
    is_a: Value
    description: An ISO date at the precision stated by the source, kept verbatim.
    attributes:
      kind:
        equals_string: partial_date
      lexical:
        required: true
  MissingValue:
    is_a: Value
    attributes:
      kind:
        equals_string: missing
      reason:
        range: MissingReason
        required: true
  ClassMembership:
    attributes:
      entity:
        range: Entity
        required: true
      class_iri:
        required: true
      establishment:
        required: true
      supports:
        multivalued: true
        required: true
  Evidence:
    class_uri: prov:Entity
    attributes:
      id:
        identifier: true
      source_uri:
        required: true
      locator:
        required: true
      provider:
        required: true
      operation_version:
        required: true
  Coverage:
    attributes:
      family:
        required: true
      scope:
        required: true
      outcome:
        range: CoverageOutcome
        required: true
      reason: {}
  Condition:
    abstract: true
    attributes:
      kind:
        required: true
  AtomicCondition:
    is_a: Condition
    attributes:
      kind:
        equals_string: atomic
      predicate:
        required: true
      arguments:
        range: Value
        inlined: true
        multivalued: true
        required: true
  MembershipCondition:
    is_a: Condition
    description: The expression denotes a member of the declared set expression.
    attributes:
      kind:
        equals_string: member
      x:
        range: MathematicalExpression
        inlined: true
        required: true
      set:
        range: MathematicalExpression
        inlined: true
        required: true
  ComparisonCondition:
    is_a: Condition
    description: Two expressions compare by the explicit relation; no predicate-name heuristic.
    attributes:
      kind:
        equals_string: compare
      relation:
        range: ComparisonRelation
        required: true
      lhs:
        range: MathematicalExpression
        inlined: true
        required: true
      rhs:
        range: MathematicalExpression
        inlined: true
        required: true
  ForallCondition:
    is_a: Condition
    attributes:
      kind:
        equals_string: forall
      variable:
        required: true
      set:
        range: MathematicalExpression
        inlined: true
        required: true
      body:
        range: Condition
        inlined: true
        required: true
  ClaimCondition:
    is_a: Condition
    description: A source-local claim reference, resolved under the sealed source binding.
    attributes:
      kind:
        equals_string: claim
      ref:
        required: true
        annotations:
          cs:reference_role: fact
  AllCondition:
    is_a: Condition
    attributes:
      kind:
        equals_string: all
      terms:
        range: Condition
        inlined: true
        multivalued: true
        required: true
  AnyCondition:
    is_a: Condition
    attributes:
      kind:
        equals_string: any
      terms:
        range: Condition
        inlined: true
        multivalued: true
        required: true
  NotCondition:
    is_a: Condition
    attributes:
      kind:
        equals_string: not
      term:
        range: Condition
        inlined: true
        required: true
  EscapeCondition:
    is_a: Condition
    attributes:
      kind:
        equals_string: escape
      text:
        required: true
      reason:
        required: true
  Derivation:
    attributes:
      conclusion:
        range: SemanticFact
        required: true
      rule:
        required: true
      rule_version:
        required: true
      premises:
        range: SemanticFact
        multivalued: true
        required: true
  SourceStatement:
    is_a: Entity
    description: A source statement anchored in the rendition; relations are independent
      source occurrences.
    attributes:
      statement_kind:
        range: StatementKind
      locator:
        required: true
      proves:
        range: SourceStatement
        multivalued: true
        slot_uri: core:proves
        annotations:
          cs:constraint_scope: accepted_value
          cs:role: predicate
        in_subset:
        - structural
        description: The source presents this block as a proof or solution of the
          referenced statement. Mathematical verification is assessed separately.
  FloatValue:
    is_a: Value
    attributes:
      kind:
        equals_string: float
      number:
        range: float
        required: true
  ExpressionMacro:
    abstract: true
    attributes:
      kind:
        required: true
      name:
        identifier: true
      body:
        required: true
  PlainExpressionMacro:
    is_a: ExpressionMacro
    attributes:
      kind:
        equals_string: plain
      nargs:
        range: integer
        required: true
        minimum_value: 0
        maximum_value: 9
  OptionalExpressionMacro:
    is_a: ExpressionMacro
    attributes:
      kind:
        equals_string: optional
      nargs:
        range: integer
        required: true
        minimum_value: 1
        maximum_value: 9
      default:
        required: true
enums:
  ComparisonRelation:
    permissible_values:
      '<': {}
      '<=': {}
      '=': {}
      '!=': {}
      '>': {}
      '>=': {}
  ExpressionForm:
    permissible_values:
      formula: {in_subset: [symbol_definition, binding_symbol_expression]}
      set: {}
      relation: {}
      membership: {}
      list: {}
  ScopeExtent:
    permissible_values:
      statement: {}
      section: {}
      document: {}
  Establishment:
    permissible_values:
      stated: {in_subset: [source_admissible]}
      derived: {}
      agent_asserted: {in_subset: [source_admissible]}
  MissingReason:
    permissible_values:
      absent: {}
      explicit_null: {}
      unknown: {}
      not_applicable: {}
  CoverageOutcome:
    permissible_values:
      complete: {}
      partial: {}
      unanalysed: {}
      failed: {}
  StatementKind:
    description: What the source calls a statement (D1 §4.3).
    permissible_values:
      definition:
        description: Stipulates what a term means.
        in_subset:
        - claim_bearing
      theorem:
        description: A stated result.
        in_subset:
        - claim_bearing
      proposition:
        description: A stated result.
        in_subset:
        - claim_bearing
      lemma:
        description: A stated auxiliary result.
        in_subset:
        - claim_bearing
      corollary:
        description: A result stated to follow from another.
        in_subset:
        - claim_bearing
      proof:
        description: A proof of another statement.
      example:
        description: A worked example with setup values.
        in_subset:
        - claim_bearing
      exercise:
        description: An exercise with setup values and an asked quantity.
        in_subset:
        - claim_bearing
      solution:
        description: A solution of an exercise.
      remark:
        description: A remark; explicit claims only.
        in_subset:
        - claim_bearing
      convention:
        description: A convention the source adopts.
        in_subset:
        - claim_bearing
      notation:
        description: A notation the source introduces.
        in_subset:
        - claim_bearing
      assumption:
        description: A statement whose only content is a supposition (a context premise).
        in_subset:
        - claim_bearing
        - global_premise_context
      narrative:
        description: Narrative text between units that states claims.
        in_subset:
        - claim_bearing
  ClaimModality:
    description: How the source holds a claim (D1 §5.2; guideline §10.6).
    permissible_values:
      asserted:
        description: Concluded or stated as true; structural claims.
        in_subset:
        - conflict_bearing
      supposed:
        description: 'A supposition: suppose, assume, if, or let about something taken
          as given.'
        in_subset:
        - premise_forming
      defined:
        description: What a definition stipulates, including a formula introducing
          a variable.
        in_subset:
        - conflict_bearing
      conventional:
        description: A convention.
      exemplified:
        description: Setup values in examples and exercises.
      posed:
        description: Reserved until an asks_for predicate exists (OPEN-D2-15).
        in_subset:
        - reserved
      cited:
        description: Attributed to another source.
        in_subset:
        - attribution_identifying
  StatementRole:
    description: The part a claim plays in its statement (guideline §10.3).
    permissible_values:
      premise:
        in_subset: [participates_as_premise, supplies_binding_symbol]
        description: A supposition the statement makes.
      conclusion:
        description: What a theorem, corollary or remark concludes.
      definiens:
        description: What a definition stipulates, or a formula introducing a variable.
      restriction:
        description: Reserved; restrictions are condition nodes in guideline v1.
      example_value:
        in_subset: [supplies_binding_symbol]
        description: A setup value of an example or exercise.
  EvidenceRole:
    description: The part an evidence span plays for its claim (guideline §10.8).
    permissible_values:
      primary:
        description: The minimal span that states the claim.
      supporting:
        description: An introducer that determines the modality.
      condition:
        description: The span of a condition.
      definition:
        description: The span of a definition the claim relies on.
