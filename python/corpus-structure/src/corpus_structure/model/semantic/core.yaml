id: https://corpus-structure.dev/semantic/core
name: semantic_core
prefixes:
  cs: https://corpus-structure.dev/semantic/
  xsd: http://www.w3.org/2001/XMLSchema#
  prov: http://www.w3.org/ns/prov#
default_prefix: cs
default_range: string
types:
  string: {base: str, uri: xsd:string}
  decimal: {base: Decimal, uri: xsd:decimal}
  boolean: {base: bool, uri: xsd:boolean}
  integer: {base: int, uri: xsd:integer}
  datetime: {base: datetime, uri: xsd:dateTime}
classes:
  Value:
    abstract: true
    attributes:
      kind: {required: true}
  TextValue:
    is_a: Value
    attributes:
      kind: {equals_string: text}
      text: {required: true}
  NumberValue:
    is_a: Value
    attributes:
      kind: {equals_string: number}
      number: {range: decimal, required: true}
  QuantityValue:
    is_a: Value
    attributes:
      kind: {equals_string: quantity}
      number: {range: decimal, required: true}
      unit: {required: true}
  EntityValue:
    is_a: Value
    attributes:
      kind: {equals_string: entity}
      target: {required: true}
  CollectionValue:
    is_a: Value
    attributes:
      kind: {equals_string: collection}
      members: {range: Value, multivalued: true, inlined: true, required: true}
  RoleBinding:
    attributes:
      role: {required: true}
      ordinal: {range: integer, minimum_value: 0, required: true}
      value: {range: Value, inlined: true, required: true}
  RecordValue:
    is_a: Value
    attributes:
      kind: {equals_string: record}
      roles: {range: RoleBinding, multivalued: true, inlined: true, required: true}
  Entity:
    attributes:
      id: {identifier: true}
  Qualification:
    attributes:
      modality: {required: true}
      polarity: {range: boolean, required: true}
      attribution: {}
      condition: {range: Condition, inlined: true}
      valid_from: {range: datetime}
      valid_until: {range: datetime}
  AssertionOccurrence:
    attributes:
      id: {identifier: true}
      subject: {range: Entity, required: true}
      predicate: {required: true}
      object: {range: Value, inlined: true, required: true}
      qualification: {range: Qualification, inlined: true, required: true}
      source: {required: true}
      item: {required: true}
  SemanticFact:
    attributes:
      id: {identifier: true}
      subject: {range: Entity, required: true}
      predicate: {required: true}
      object: {range: Value, inlined: true, required: true}
      qualification: {range: Qualification, inlined: true, required: true}
  IntervalValue:
    is_a: Value
    attributes:
      kind: {equals_string: interval}
      lower: {range: NumberValue, inlined: true}
      upper: {range: NumberValue, inlined: true}
      lower_closed: {range: boolean, required: true}
      upper_closed: {range: boolean, required: true}
  ExpressionValue:
    is_a: Value
    attributes:
      kind: {equals_string: expression}
      language: {required: true}
      expression: {required: true}
  MissingValue:
    is_a: Value
    attributes:
      kind: {equals_string: missing}
      reason: {range: MissingReason, required: true}
  ClassMembership:
    attributes:
      entity: {range: Entity, required: true}
      class_iri: {required: true}
      establishment: {required: true}
      supports: {multivalued: true, required: true}
  Evidence:
    class_uri: prov:Entity
    attributes:
      id: {identifier: true}
      source_uri: {required: true}
      locator: {required: true}
      provider: {required: true}
      operation_version: {required: true}
  Coverage:
    attributes:
      family: {required: true}
      scope: {required: true}
      outcome: {range: CoverageOutcome, required: true}
      reason: {}
  Condition:
    abstract: true
    attributes:
      kind: {required: true}
  AtomicCondition:
    is_a: Condition
    attributes:
      kind: {equals_string: atomic}
      predicate: {required: true}
      arguments: {range: Value, inlined: true, multivalued: true, required: true}
  AllCondition:
    is_a: Condition
    attributes:
      kind: {equals_string: all}
      terms: {range: Condition, inlined: true, multivalued: true, required: true}
  AnyCondition:
    is_a: Condition
    attributes:
      kind: {equals_string: any}
      terms: {range: Condition, inlined: true, multivalued: true, required: true}
  NotCondition:
    is_a: Condition
    attributes:
      kind: {equals_string: not}
      term: {range: Condition, inlined: true, required: true}
  EscapeCondition:
    is_a: Condition
    attributes:
      kind: {equals_string: escape}
      text: {required: true}
      reason: {required: true}
  Derivation:
    attributes:
      conclusion: {range: SemanticFact, required: true}
      rule: {required: true}
      rule_version: {required: true}
      premises: {range: SemanticFact, multivalued: true, required: true}
enums:
  MissingReason:
    permissible_values:
      absent: {}
      explicit_null: {}
      unknown: {}
      not_applicable: {}
  CoverageOutcome:
    permissible_values:
      complete: {}
      partial: {}
      unanalysed: {}
      failed: {}
