id: https://corpus-structure.dev/semantic/characterization
name: semantic_characterization
prefixes:
  cstc: https://corpus-structure.dev/semantic/characterization/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: cstc
default_range: string
classes:
  CharacterizationSourceSelector:
    is_a: SourceRecordProduct
    attributes:
      projection: &id001
        required: true
        pattern: '^.+$(?![\s\S])'
      native_pointer: {}
      page:
        range: integer
        minimum_value: 1
      start:
        range: integer
        minimum_value: 0
      end:
        range: integer
        minimum_value: 0
  CharacterizationScore:
    is_a: SourceRecordProduct
    attributes:
      scheme: *id001
      value:
        required: true
        range: SourceMeasurementValue
        inlined: true
      meaning: *id001
  CharacterizationAnnotation:
    is_a: SourceRecordProduct
    attributes:
      navigation:
        range: CharacterizationNavigation
        inlined: true
      named_match:
        range: CharacterizationNamedMatch
        inlined: true
      required_choices:
        range: string
        multivalued: true
      native_mention:
        range: CharacterizationNativeMention
        inlined: true
      native_edu:
        range: CharacterizationNativeEdu
        inlined: true
      native_boundary:
        range: CharacterizationNativeBoundary
        inlined: true
      native_rst:
        range: CharacterizationNativeRst
        inlined: true
      context:
        range: CharacterizationContext
        inlined: true
      model_answer:
        range: CharacterizationModelAnswer
        inlined: true
      required_external_choices:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      native_token:
        range: CharacterizationNativeToken
        inlined: true
      native_batch:
        range: SourceValue
        inlined: true
      formal_input:
        range: CharacterizationFormalInput
        inlined: true
      formal:
        range: CharacterizationFormalNode
        inlined: true
      local_id: *id001
      kind: *id001
      vocabulary: *id001
      occurrences:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
      native_scheme: {}
      native_label: {}
      status:
        required: true
        pattern: '^(native_evidence|interpreted|unknown|private_proposal)$(?![\s\S])'
      premises:
        range: string
        multivalued: true
      rule_id: {}
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      provenance:
        range: string
        multivalued: true
      external_premises:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      family:
        required: true
        pattern: '^\S+$(?![\s\S])'
  CharacterizationMembership:
    is_a: SourceRecordProduct
    attributes:
      required_choices:
        range: string
        multivalued: true
      required_external_choices:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      local_id: *id001
      group: *id001
      member: *id001
      role: *id001
      order:
        range: integer
        minimum_value: 0
      occurrences:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
      premises:
        range: string
        multivalued: true
      scope: *id001
      structural:
        required: true
        range: boolean
      family:
        required: true
        pattern: '^\S+$(?![\s\S])'
      external_premises:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
  CharacterizationAttachmentBasis:
    is_a: SourceRecordProduct
    attributes:
      construction:
        range: string
        pattern: '^.+$(?![\s\S])'
      binding:
        range: string
        pattern: '^.+$(?![\s\S])'
      production:
        range: string
        pattern: '^.+$(?![\s\S])'
      support_codec:
        range: string
        pattern: '^.+$(?![\s\S])'
      production_name:
        range: string
        pattern: '^.+$(?![\s\S])'
      support_roles:
        range: string
        pattern: '^.+$(?![\s\S])'
      required_external_choices:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      kind:
        required: true
        pattern: '^(native_prediction|released_construction|contextual_proposal)$(?![\s\S])'
      status:
        required: true
        pattern: '^(recorded|witnessed|private_proposal)$(?![\s\S])'
      rule_id: {}
      premises:
        range: string
        multivalued: true
      native_scheme: {}
      native_label: {}
      choice_refs:
        range: string
        multivalued: true
      external_premises:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
  CharacterizationNativeBasis:
    is_a: CharacterizationAttachmentBasis
    attributes:
      kind:
        required: true
        equals_string: native_prediction
      status:
        required: true
        equals_string: recorded
      native_scheme: *id001
      native_label: *id001
  CharacterizationConstructionBasis:
    is_a: CharacterizationAttachmentBasis
    attributes:
      kind:
        required: true
        equals_string: released_construction
      status:
        required: true
        equals_string: witnessed
      rule_id: *id001
  CharacterizationProposalBasis:
    is_a: CharacterizationAttachmentBasis
    attributes:
      kind:
        required: true
        equals_string: contextual_proposal
      status:
        required: true
        equals_string: private_proposal
  CharacterizationRole:
    is_a: SourceRecordProduct
    attributes:
      required_choices:
        range: string
        multivalued: true
      required_external_choices:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      local_id: *id001
      owner: *id001
      member: *id001
      role: *id001
      scheme: *id001
      occurrences:
        range: string
        multivalued: true
      basis:
        range: CharacterizationAttachmentBasis
        inlined: true
        required: true
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      provenance:
        range: string
        multivalued: true
      family:
        required: true
        pattern: '^\S+$(?![\s\S])'
  CharacterizationTermEdge:
    is_a: SourceRecordProduct
    attributes:
      role: *id001
      target:
        range: string
        pattern: '^.+$(?![\s\S])'
      choice_group:
        range: string
        pattern: '^.+$(?![\s\S])'
      structural:
        required: true
        range: boolean
      order:
        range: integer
        minimum_value: 0
  CharacterizationTerm:
    is_a: SourceRecordProduct
    attributes:
      required_external_choices:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      local_id: *id001
      kind:
        required: true
        pattern: '^(predicate|participant|operator|binder|attribution|clause_relation|unknown)$(?![\s\S])'
      vocabulary: *id001
      value: *id001
      status:
        required: true
        pattern: '^(interpreted|unknown|implicit|private_proposal)$(?![\s\S])'
      occurrences:
        range: string
        multivalued: true
      children:
        range: CharacterizationTermEdge
        inlined: true
        multivalued: true
      required_choices:
        range: string
        multivalued: true
      premises:
        range: string
        multivalued: true
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      provenance:
        range: string
        multivalued: true
      family:
        required: true
        pattern: '^\S+$(?![\s\S])'
      external_premises:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
  CharacterizationChoiceMember:
    is_a: SourceRecordProduct
    attributes:
      required_external_choices:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      local_id: *id001
      root: *id001
      required_choices:
        range: string
        multivalued: true
      premises:
        range: string
        multivalued: true
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      external_premises:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
  CharacterizationChoiceGroup:
    is_a: SourceRecordProduct
    attributes:
      local_id: *id001
      compatibility:
        required: true
        pattern: '^(exclusive|compatible|unknown)$(?![\s\S])'
      members:
        range: CharacterizationChoiceMember
        inlined: true
        multivalued: true
        required: true
        minimum_cardinality: 1
      family:
        required: true
        pattern: '^\S+$(?![\s\S])'
  CharacterizationFamilyCoverage:
    is_a: SourceRecordProduct
    attributes:
      family: *id001
      operation: *id001
      eligible:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      examined:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      unexamined:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      availability:
        required: true
        pattern: '^(available|unknown|unsupported|unavailable)$(?![\s\S])'
      outcome:
        required: true
        pattern: '^(complete|empty|partial|failed|unknown|unsupported)$(?![\s\S])'
      reason: {}
      profile: *id001
  CharacterizationNativeToken:
    is_a: SourceRecordProduct
    attributes:
      index:
        range: integer
        required: true
        minimum_value: 0
      container:
        range: string
        required: true
      native_run:
        range: string
        required: true
      sentence:
        range: string
      text:
        range: string
        required: true
      space:
        range: boolean
        required: true
      whitespace:
        range: string
        required: true
      source_role:
        range: string
        required: true
        pattern: '^(prose|math|reference)$(?![\s\S])'
      lemma:
        range: string
      pos:
        range: string
      tag:
        range: string
      morphology:
        range: string
        multivalued: true
      dependency:
        range: string
      native_head:
        range: integer
        minimum_value: 0
      head_index_base:
        range: integer
        minimum_value: 0
        maximum_value: 1
      prepared_text:
        range: string
      subword_positions:
        range: integer
        multivalued: true
        minimum_value: 0
  CharacterizationFormalDiagnostic:
    is_a: SourceRecordProduct
    attributes:
      category:
        range: string
        required: true
      message:
        range: string
        required: true
      position:
        range: integer
        minimum_value: 0
      rule:
        range: string
  CharacterizationFormalCorrespondence:
    is_a: SourceRecordProduct
    attributes:
      input_start:
        range: integer
        required: true
        minimum_value: 0
      input_end:
        range: integer
        required: true
        minimum_value: 0
      relation:
        range: string
        required: true
        pattern: '^(exact|contained_in_atom|normalized|synthetic)$(?![\s\S])'
      source_occurrences:
        range: string
        multivalued: true
      boundary:
        range: integer
        minimum_value: 0
  CharacterizationFormalNormalized:
    is_a: SourceRecordProduct
    attributes:
      kind:
        range: string
        required: true
        pattern: '^(decimal|comparator|identifier|date|unit|interval|threshold)$(?![\s\S])'
      value:
        range: string
      comparator:
        range: string
        pattern: '^(>|>=|<|<=|=)$(?![\s\S])'
      quantity:
        range: string
      lower:
        range: string
      upper:
        range: string
      lower_closed:
        range: boolean
      upper_closed:
        range: boolean
      unit:
        range: string
      domain_status:
        range: string
        required: true
        pattern: '^(not_requested|valid|invalid|unresolved)$(?![\s\S])'
      reason:
        range: string
  CharacterizationFormalInput:
    is_a: SourceRecordProduct
    attributes:
      normalization_recipe:
        range: string
        pattern: '^.+$(?![\s\S])'
      symbol_outcome:
        range: string
        pattern: '^(complete|partial|failed|not_requested)$(?![\s\S])'
      parent_occurrence:
        range: string
        required: true
      representation:
        range: string
        required: true
        pattern: '^(source_text|recognized_latex|normalized_latex)$(?![\s\S])'
      text:
        range: string
        required: true
      original_text:
        range: string
      grammar:
        range: string
        required: true
      start_symbol:
        range: string
        required: true
      macro_identity:
        range: string
        required: true
      syntax_outcome:
        range: string
        required: true
        pattern: '^(complete|partial|ambiguous|failed)$(?![\s\S])'
      interpretation_outcome:
        range: string
        required: true
        pattern: '^(not_requested|resolved|unresolved|invalid|failed)$(?![\s\S])'
      diagnostic:
        range: CharacterizationFormalDiagnostic
        inlined: true
      correspondence:
        range: CharacterizationFormalCorrespondence
        inlined: true
        multivalued: true
  CharacterizationFormalNode:
    is_a: SourceRecordProduct
    attributes:
      symbol_parent:
        range: string
        pattern: '^.+$(?![\s\S])'
      input_id:
        range: string
        required: true
      node_kind:
        range: string
        required: true
        pattern: '^(token|rule)$(?![\s\S])'
      rule:
        range: string
        required: true
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
      synthetic:
        range: boolean
      line:
        range: integer
        minimum_value: 0
      column:
        range: integer
        minimum_value: 0
      end_line:
        range: integer
        minimum_value: 0
      end_column:
        range: integer
        minimum_value: 0
      container_start:
        range: integer
        minimum_value: 0
      container_end:
        range: integer
        minimum_value: 0
      container_line:
        range: integer
        minimum_value: 0
      container_column:
        range: integer
        minimum_value: 0
      container_end_line:
        range: integer
        minimum_value: 0
      container_end_column:
        range: integer
        minimum_value: 0
      normalized:
        range: CharacterizationFormalNormalized
        inlined: true
  CharacterizationNativeMention:
    is_a: SourceRecordProduct
    attributes:
      coordinate_unit:
        range: string
        required: true
        pattern: '^(inclusive_canonical_token|inclusive_subtoken)$(?![\s\S])'
      first:
        range: integer
        required: true
        minimum_value: 0
      last:
        range: integer
        required: true
        minimum_value: 0
      detected:
        range: boolean
        required: true
      supplied:
        range: boolean
        required: true
      clustered:
        range: boolean
        required: true
      mapping_status:
        range: string
        required: true
        pattern: '^(mapped|unmapped)$(?![\s\S])'
      reason:
        range: string
      native_run:
        range: string
        required: true
  CharacterizationNativeEdu:
    is_a: SourceRecordProduct
    attributes:
      native_run:
        range: string
        required: true
      mode:
        range: string
        required: true
        pattern: '^(learned|layout_forced|supplied|predicted)$(?![\s\S])'
      index:
        range: integer
        required: true
        minimum_value: 0
      token_start:
        range: integer
        required: true
        minimum_value: 0
      token_end:
        range: integer
        required: true
        minimum_value: 0
      provider_start:
        range: integer
        required: true
        minimum_value: 0
      provider_end:
        range: integer
        required: true
        minimum_value: 0
      text:
        range: string
        required: true
  CharacterizationNativeBoundary:
    is_a: SourceRecordProduct
    attributes:
      token_end:
        range: integer
        required: true
        minimum_value: 0
      learned:
        range: boolean
        required: true
      forced:
        range: boolean
        required: true
      disposition:
        range: string
        required: true
        pattern: '^(retained|merged)$(?![\s\S])'
  CharacterizationNativeRst:
    is_a: SourceRecordProduct
    attributes:
      left_start:
        range: integer
        required: true
        minimum_value: 0
      left_end:
        range: integer
        required: true
        minimum_value: 0
      right_start:
        range: integer
        required: true
        minimum_value: 0
      right_end:
        range: integer
        required: true
        minimum_value: 0
      nuclearity:
        range: string
        required: true
        pattern: '^(NN|NS|SN)$(?![\s\S])'
  CharacterizationContextGap:
    is_a: SourceRecordProduct
    attributes:
      left_selector:
        range: CharacterizationSourceSelector
        inlined: true
      right_selector:
        range: CharacterizationSourceSelector
        inlined: true
      reason:
        range: string
        required: true
  CharacterizationContext:
    is_a: SourceRecordProduct
    attributes:
      focal:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      examined:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      gaps:
        range: CharacterizationContextGap
        inlined: true
        multivalued: true
  CharacterizationAnswerAlternative:
    is_a: SourceRecordProduct
    attributes:
      key:
        range: string
        required: true
      state:
        range: string
        required: true
      score:
        range: CharacterizationScore
        inlined: true
  CharacterizationModelAnswer:
    is_a: SourceRecordProduct
    attributes:
      family:
        range: string
        required: true
      question_key:
        range: string
        required: true
      declaration_digest:
        range: string
        required: true
        pattern: '^[0-9a-f]{64}$(?![\s\S])'
      stage:
        range: string
        required: true
      answer_kind:
        range: string
        required: true
        pattern: '^(text|number|date|choice|noul|gliner_span|gliner_classification)$(?![\s\S])'
      state:
        range: string
        required: true
      request_digest:
        range: string
        required: true
        pattern: '^[0-9a-f]{64}$(?![\s\S])'
      native_answer:
        range: SourceValue
        inlined: true
        required: true
      candidate_list_digest:
        range: string
        pattern: '^[0-9a-f]{64}$(?![\s\S])'
      source_field:
        range: string
      observed_keys:
        range: string
        multivalued: true
      selected_keys:
        range: string
        multivalued: true
      alternatives:
        range: CharacterizationAnswerAlternative
        inlined: true
        multivalued: true
      depends_on:
        range: string
        multivalued: true
      diagnostic:
        range: CharacterizationFormalDiagnostic
        inlined: true
  CharacterizationNamedSentence:
    is_a: SourceRecordProduct
    attributes:
      token_index:
        range: integer
        required: true
        minimum_value: 0
      sentence:
        range: integer
        minimum_value: 0
  CharacterizationNamedBinding:
    is_a: SourceRecordProduct
    attributes:
      demonstrative:
        range: boolean
      antecedent_status:
        range: string
        pattern: '^(resolved|unresolved|unavailable|not_applicable)$(?![\s\S])'
      antecedent_members:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      antecedent_reason:
        range: string
      role:
        range: string
        required: true
      node:
        range: string
        required: true
      head:
        range: DdoSemanticMemberReference
        required: true
        inlined: true
      expansion:
        range: string
        required: true
      members:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      status:
        range: string
        required: true
      reason:
        range: string
  CharacterizationNamedMatch:
    is_a: SourceRecordProduct
    attributes:
      rule:
        range: string
        required: true
      variant:
        range: string
        required: true
      mechanism:
        range: string
        required: true
      protocol:
        range: string
        required: true
      dependency_digest:
        range: string
        required: true
        pattern: '^[0-9a-f]{64}$(?![\s\S])'
      native_container:
        range: DdoSemanticMemberReference
        required: true
        inlined: true
      nodes:
        range: DdoSemanticMemberReference
        inlined: true
        multivalued: true
      piece_indices:
        range: integer
        multivalued: true
        minimum_value: 0
      sentences:
        range: CharacterizationNamedSentence
        inlined: true
        multivalued: true
      bindings:
        range: CharacterizationNamedBinding
        inlined: true
        multivalued: true
      status:
        range: string
        required: true
      reason:
        range: string
      negation_occurrences:
        range: string
        multivalued: true
  CharacterizationNavigationRole:
    is_a: SourceRecordProduct
    attributes:
      role: {range: string, required: true, pattern: '^.+$(?![\s\S])'}
      occurrences: {range: string, required: true, multivalued: true, minimum_cardinality: 1}
  CharacterizationNavigationToken:
    is_a: SourceRecordProduct
    attributes:
      name: {range: string, required: true, pattern: '^.+$(?![\s\S])'}
      index: {range: integer, required: true, minimum_value: 0}
      native_node: {range: DdoSemanticMemberReference, required: true, inlined: true}
  CharacterizationNavigationLabel:
    is_a: SourceRecordProduct
    attributes:
      kind: {range: string, required: true, pattern: '^(numbering_namespace|revision)$(?![\s\S])'}
      value: {range: string, required: true, pattern: '^.+$(?![\s\S])'}
      occurrences: {range: string, required: true, multivalued: true, minimum_cardinality: 1}
  CharacterizationNavigation:
    is_a: SourceRecordProduct
    attributes:
      codec: {equals_string: source-navigation-v1, required: true}
      kind: {range: string, required: true, pattern: '^(named_link|named_availability|lexical_named_link|symbol_declaration|declaration_template|declaration_cue|recap|artifact_mention|artifact_reference|artifact_explicit_reference|artifact_relation|artifact_work|section_heading|note_scope|table_schematic|table_role|table_geometry)$(?![\s\S])'}
      pointer: {range: string, required: true, pattern: '^.+$(?![\s\S])'}
      status: {range: string, required: true, pattern: '^(complete|partial|unavailable)$(?![\s\S])'}
      roles: {range: CharacterizationNavigationRole, inlined: true, multivalued: true}
      native_tokens: {range: CharacterizationNavigationToken, inlined: true, multivalued: true}
      rule: {range: string}
      variant: {range: string}
      mechanism: {range: string}
      annotation: {range: string}
      block: {range: string}
      resolution: {range: string}
      relation_kind: {range: string}
      designator: {range: string}
      artifact_kind: {range: string}
      source_labels: {range: CharacterizationNavigationLabel, inlined: true, multivalued: true}
      alias_state: {range: string, pattern: '^(observed|known_empty|unknown)$(?![\s\S])'}
      numbering_namespace: {range: string}
      work: {range: string}
      revision: {range: string}
      cell_index: {range: integer, minimum_value: 0}
      axis: {range: string, pattern: '^(all|row|column|band)$(?![\s\S])'}
      label: {range: string}
      measure_role: {range: string, pattern: '^(row_sum|column_sum|sample_count|observed_count|value_role|unit)$(?![\s\S])'}
      geometry_role: {range: string, pattern: '^(frequency|relative_frequency|row_key)$(?![\s\S])'}
      introducer: {range: string, pattern: '^(let|where|suppose|define)$(?![\s\S])'}
      definition_subject_kind: {range: string, pattern: '^(term|identifier)$(?![\s\S])'}

imports:
- observations
