id: https://corpus-structure.dev/semantic/characterization
name: semantic_characterization
prefixes:
  cstc: https://corpus-structure.dev/semantic/characterization/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: cstc
default_range: string
classes:
  CharacterizationSourceSelector:
    is_a: SourceRecordProduct
    attributes:
      projection: &id001
        required: true
        pattern: ^.+$
      native_pointer: {}
      page:
        range: integer
        minimum_value: 1
      start:
        range: integer
        minimum_value: 0
      end:
        range: integer
        minimum_value: 0
  CharacterizationSourceViewPin:
    is_a: SourceRecordProduct
    attributes:
      source_view_id:
        required: true
        range: integer
        minimum_value: 1
      key: *id001
      base_document:
        range: CharacterizationProductReference
        inlined: true
        required: true
      section_pointer: *id001
      membership:
        required: true
        pattern: ^(direct|descendants)$
      projection_digest: &id002
        required: true
        pattern: ^[0-9a-f]{64}$
      recipe_digest: *id002
  CharacterizationSourceScope:
    is_a: SourceRecordProduct
    attributes:
      source_view_ids:
        range: integer
        multivalued: true
        required: true
        minimum_cardinality: 1
      source_views:
        range: CharacterizationSourceViewPin
        inlined: true
        multivalued: true
        required: true
        minimum_cardinality: 1
      profile: *id001
      selectors:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
        required: true
        minimum_cardinality: 1
  CharacterizationOperation:
    is_a: SourceRecordProduct
    attributes:
      key: *id001
      version: *id001
      runtime: *id001
      model: *id001
      grammar: *id001
      configuration: *id001
      input: *id001
      context: *id001
      produced_families:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
      required_layers:
        range: CharacterizationProductReference
        inlined: true
        multivalued: true
      preconditions:
        range: string
        multivalued: true
      effects:
        range: string
        multivalued: true
      result_determinants:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
      outcomes:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        pattern: ^(complete|partial|failed)$
  CharacterizationExtent:
    is_a: SourceRecordProduct
    attributes:
      projection: *id001
      source_view_id:
        required: true
        range: integer
        minimum_value: 1
      native_pointer: *id001
      page:
        range: integer
        minimum_value: 1
      start:
        range: integer
        minimum_value: 0
      end:
        range: integer
        minimum_value: 0
      text: {}
      synthetic:
        required: true
        range: boolean
  CharacterizationSourceOccurrence:
    is_a: SourceRecordProduct
    attributes:
      local_id: *id002
      extents:
        range: CharacterizationExtent
        inlined: true
        multivalued: true
        required: true
        minimum_cardinality: 1
  CharacterizationScore:
    is_a: SourceRecordProduct
    attributes:
      scheme: *id001
      value:
        required: true
        range: SourceMeasurementValue
        inlined: true
      meaning: *id001
  CharacterizationAnnotation:
    is_a: SourceRecordProduct
    attributes:
      navigation:
        range: CharacterizationNavigation
        inlined: true
      named_match:
        range: CharacterizationNamedMatch
        inlined: true
      required_choices:
        range: string
        multivalued: true
      native_mention:
        range: CharacterizationNativeMention
        inlined: true
      native_edu:
        range: CharacterizationNativeEdu
        inlined: true
      native_boundary:
        range: CharacterizationNativeBoundary
        inlined: true
      native_rst:
        range: CharacterizationNativeRst
        inlined: true
      context:
        range: CharacterizationContext
        inlined: true
      model_answer:
        range: CharacterizationModelAnswer
        inlined: true
      required_external_choices:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
      native_token:
        range: CharacterizationNativeToken
        inlined: true
      native_batch:
        range: SourceValue
        inlined: true
      formal_input:
        range: CharacterizationFormalInput
        inlined: true
      formal:
        range: CharacterizationFormalNode
        inlined: true
      local_id: *id001
      kind: *id001
      vocabulary: *id001
      occurrences:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
      native_scheme: {}
      native_label: {}
      status:
        required: true
        pattern: ^(native_evidence|interpreted|unknown|private_proposal)$
      premises:
        range: string
        multivalued: true
      rule_id: {}
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      provenance:
        range: string
        multivalued: true
      external_premises:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
      family:
        required: true
        pattern: ^\S+$
  CharacterizationMembership:
    is_a: SourceRecordProduct
    attributes:
      required_choices:
        range: string
        multivalued: true
      required_external_choices:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
      local_id: *id001
      group: *id001
      member: *id001
      role: *id001
      order:
        range: integer
        minimum_value: 0
      occurrences:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
      premises:
        range: string
        multivalued: true
      scope: *id001
      structural:
        required: true
        range: boolean
      family:
        required: true
        pattern: ^\S+$
      external_premises:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
  CharacterizationAttachmentBasis:
    is_a: SourceRecordProduct
    attributes:
      construction:
        range: string
        pattern: ^.+$
      binding:
        range: string
        pattern: ^.+$
      production:
        range: string
        pattern: ^.+$
      support_codec:
        range: string
        pattern: ^.+$
      production_name:
        range: string
        pattern: ^.+$
      support_roles:
        range: string
        pattern: ^.+$
      required_external_choices:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
      kind:
        required: true
        pattern: ^(native_prediction|released_construction|contextual_proposal)$
      status:
        required: true
        pattern: ^(recorded|witnessed|private_proposal)$
      rule_id: {}
      premises:
        range: string
        multivalued: true
      native_scheme: {}
      native_label: {}
      choice_refs:
        range: string
        multivalued: true
      external_premises:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
  CharacterizationNativeBasis:
    is_a: CharacterizationAttachmentBasis
    attributes:
      kind:
        required: true
        equals_string: native_prediction
      status:
        required: true
        equals_string: recorded
      native_scheme: *id001
      native_label: *id001
  CharacterizationConstructionBasis:
    is_a: CharacterizationAttachmentBasis
    attributes:
      kind:
        required: true
        equals_string: released_construction
      status:
        required: true
        equals_string: witnessed
      rule_id: *id001
  CharacterizationProposalBasis:
    is_a: CharacterizationAttachmentBasis
    attributes:
      kind:
        required: true
        equals_string: contextual_proposal
      status:
        required: true
        equals_string: private_proposal
  CharacterizationRole:
    is_a: SourceRecordProduct
    attributes:
      required_choices:
        range: string
        multivalued: true
      required_external_choices:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
      local_id: *id001
      owner: *id001
      member: *id001
      role: *id001
      scheme: *id001
      occurrences:
        range: string
        multivalued: true
      basis:
        range: CharacterizationAttachmentBasis
        inlined: true
        required: true
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      provenance:
        range: string
        multivalued: true
      family:
        required: true
        pattern: ^\S+$
  CharacterizationTermEdge:
    is_a: SourceRecordProduct
    attributes:
      role: *id001
      target:
        range: string
        pattern: ^.+$
      choice_group:
        range: string
        pattern: ^.+$
      structural:
        required: true
        range: boolean
      order:
        range: integer
        minimum_value: 0
  CharacterizationTerm:
    is_a: SourceRecordProduct
    attributes:
      required_external_choices:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
      local_id: *id001
      kind:
        required: true
        pattern: ^(predicate|participant|operator|binder|attribution|clause_relation|unknown)$
      vocabulary: *id001
      value: *id001
      status:
        required: true
        pattern: ^(interpreted|unknown|implicit|private_proposal)$
      occurrences:
        range: string
        multivalued: true
      children:
        range: CharacterizationTermEdge
        inlined: true
        multivalued: true
      required_choices:
        range: string
        multivalued: true
      premises:
        range: string
        multivalued: true
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      provenance:
        range: string
        multivalued: true
      family:
        required: true
        pattern: ^\S+$
      external_premises:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
  CharacterizationChoiceMember:
    is_a: SourceRecordProduct
    attributes:
      required_external_choices:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
      local_id: *id001
      root: *id001
      required_choices:
        range: string
        multivalued: true
      premises:
        range: string
        multivalued: true
      scores:
        range: CharacterizationScore
        inlined: true
        multivalued: true
      external_premises:
        range: CharacterizationQualifiedReference
        inlined: true
        multivalued: true
  CharacterizationChoiceGroup:
    is_a: SourceRecordProduct
    attributes:
      local_id: *id001
      compatibility:
        required: true
        pattern: ^(exclusive|compatible|unknown)$
      members:
        range: CharacterizationChoiceMember
        inlined: true
        multivalued: true
        required: true
        minimum_cardinality: 1
      family:
        required: true
        pattern: ^\S+$
  CharacterizationFamilyCoverage:
    is_a: SourceRecordProduct
    attributes:
      family: *id001
      operation: *id001
      eligible:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      examined:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      unexamined:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      availability:
        required: true
        pattern: ^(available|unknown|unsupported|unavailable)$
      outcome:
        required: true
        pattern: ^(complete|empty|partial|failed|unknown|unsupported)$
      reason: {}
      profile: *id001
  AnnotationLayer:
    is_a: SourceRecordProduct
    attributes:
      native_runs:
        range: CharacterizationNativeRun
        inlined: true
        multivalued: true
      format:
        required: true
        equals_string: characterization-layer-v1
      base_document:
        range: CharacterizationProductReference
        inlined: true
        required: true
      release_id: *id001
      operation:
        range: CharacterizationOperation
        inlined: true
        required: true
      source_scope:
        range: CharacterizationSourceScope
        inlined: true
        required: true
      outcome:
        required: true
        pattern: ^(complete|partial|failed)$
      dependencies:
        range: CharacterizationProductReference
        inlined: true
        multivalued: true
      occurrences:
        range: CharacterizationSourceOccurrence
        inlined: true
        multivalued: true
      annotations:
        range: CharacterizationAnnotation
        inlined: true
        multivalued: true
      memberships:
        range: CharacterizationMembership
        inlined: true
        multivalued: true
      roles:
        range: CharacterizationRole
        inlined: true
        multivalued: true
      terms:
        range: CharacterizationTerm
        inlined: true
        multivalued: true
      choices:
        range: CharacterizationChoiceGroup
        inlined: true
        multivalued: true
      coverage:
        range: CharacterizationFamilyCoverage
        inlined: true
        multivalued: true
        required: true
        minimum_cardinality: 1
  EnrichedDocumentView:
    is_a: SourceRecordProduct
    attributes:
      format:
        required: true
        equals_string: enriched-document-view-v1
      base_document:
        range: CharacterizationProductReference
        inlined: true
        required: true
      release_id: *id001
      source_scope:
        range: CharacterizationSourceScope
        inlined: true
        required: true
      layers:
        range: CharacterizationProductReference
        inlined: true
        multivalued: true
      active_layers:
        range: CharacterizationProductReference
        inlined: true
        multivalued: true
      profile: *id001
      coverage:
        range: CharacterizationFamilyCoverage
        inlined: true
        multivalued: true
  CharacterizationNativeToken:
    is_a: SourceRecordProduct
    attributes:
      index:
        range: integer
        required: true
        minimum_value: 0
      container:
        range: string
        required: true
      native_run:
        range: string
        required: true
      sentence:
        range: string
      text:
        range: string
        required: true
      space:
        range: boolean
        required: true
      whitespace:
        range: string
        required: true
      source_role:
        range: string
        required: true
        pattern: ^(prose|math|reference)$
      lemma:
        range: string
      pos:
        range: string
      tag:
        range: string
      morphology:
        range: string
        multivalued: true
      dependency:
        range: string
      native_head:
        range: integer
        minimum_value: 0
      head_index_base:
        range: integer
        minimum_value: 0
        maximum_value: 1
      prepared_text:
        range: string
      subword_positions:
        range: integer
        multivalued: true
        minimum_value: 0
  CharacterizationNativeComponent:
    is_a: SourceRecordProduct
    attributes:
      name:
        range: string
        required: true
      factory:
        range: string
        required: true
  CharacterizationNativeAvailability:
    is_a: SourceRecordProduct
    attributes:
      family:
        range: string
        required: true
      attribute:
        range: string
        required: true
      status:
        range: string
        required: true
        pattern: ^(complete|partial|absent|not_applicable)$
      reason:
        range: string
  CharacterizationNativePackage:
    is_a: SourceRecordProduct
    attributes:
      name:
        range: string
        required: true
      version:
        range: string
        required: true
  CharacterizationNativeArtifact:
    is_a: SourceRecordProduct
    attributes:
      name:
        range: string
        required: true
      sha256:
        range: string
        required: true
        pattern: ^[0-9a-f]{64}$
      size:
        range: integer
        minimum_value: 0
  CharacterizationNativeLimit:
    is_a: SourceRecordProduct
    attributes:
      name:
        range: string
        required: true
      value:
        range: integer
        required: true
        minimum_value: 0
  CharacterizationNativeRun:
    is_a: SourceRecordProduct
    attributes:
      local_id:
        range: string
        required: true
      provider:
        range: string
        required: true
      profile:
        range: string
        required: true
      model:
        range: string
        required: true
      model_version:
        range: string
        required: true
      runtime_version:
        range: string
        required: true
      execution_profile:
        range: SourceObject
        inlined: true
        description: Exact frozen requested execution profile; absent on historical observations.
      startup_observation:
        range: SourceObject
        inlined: true
        description: Actual detached startup values checked against the requested profile.
      configuration:
        range: string
        required: true
      configuration_codec:
        range: string
        required: true
        pattern: ^(spacy-config-v1|hanlp-config-json-v1|maverick-config-json-v1|dipo-config-json-v1)$
      configuration_digest:
        range: string
        required: true
        pattern: ^[0-9a-f]{64}$
      layout_recipe:
        range: string
        required: true
      layout_digest:
        range: string
        required: true
      text_digest:
        range: string
        required: true
      components:
        range: CharacterizationNativeComponent
        inlined: true
        multivalued: true
      availability:
        range: CharacterizationNativeAvailability
        inlined: true
        multivalued: true
      runtime_packages:
        range: CharacterizationNativePackage
        inlined: true
        multivalued: true
      artifacts:
        range: CharacterizationNativeArtifact
        inlined: true
        multivalued: true
      limits:
        range: CharacterizationNativeLimit
        inlined: true
        multivalued: true
      diagnostics:
        range: string
        multivalued: true
  CharacterizationFormalDiagnostic:
    is_a: SourceRecordProduct
    attributes:
      category:
        range: string
        required: true
      message:
        range: string
        required: true
      position:
        range: integer
        minimum_value: 0
      rule:
        range: string
  CharacterizationFormalCorrespondence:
    is_a: SourceRecordProduct
    attributes:
      input_start:
        range: integer
        required: true
        minimum_value: 0
      input_end:
        range: integer
        required: true
        minimum_value: 0
      relation:
        range: string
        required: true
        pattern: ^(exact|contained_in_atom|normalized|synthetic)$
      source_occurrences:
        range: string
        multivalued: true
      boundary:
        range: integer
        minimum_value: 0
  CharacterizationFormalNormalized:
    is_a: SourceRecordProduct
    attributes:
      kind:
        range: string
        required: true
        pattern: ^(decimal|comparator|identifier|date|unit|interval|threshold)$
      value:
        range: string
      comparator:
        range: string
        pattern: ^(>|>=|<|<=|=)$
      quantity:
        range: string
      lower:
        range: string
      upper:
        range: string
      lower_closed:
        range: boolean
      upper_closed:
        range: boolean
      unit:
        range: string
      domain_status:
        range: string
        required: true
        pattern: ^(not_requested|valid|invalid|unresolved)$
      reason:
        range: string
  CharacterizationFormalInput:
    is_a: SourceRecordProduct
    attributes:
      normalization_recipe:
        range: string
        pattern: ^.+$
      symbol_outcome:
        range: string
        pattern: ^(complete|partial|failed|not_requested)$
      parent_occurrence:
        range: string
        required: true
      representation:
        range: string
        required: true
        pattern: ^(source_text|recognized_latex|normalized_latex)$
      text:
        range: string
        required: true
      original_text:
        range: string
      grammar:
        range: string
        required: true
      start_symbol:
        range: string
        required: true
      macro_identity:
        range: string
        required: true
      syntax_outcome:
        range: string
        required: true
        pattern: ^(complete|partial|ambiguous|failed)$
      interpretation_outcome:
        range: string
        required: true
        pattern: ^(not_requested|resolved|unresolved|invalid|failed)$
      diagnostic:
        range: CharacterizationFormalDiagnostic
        inlined: true
      correspondence:
        range: CharacterizationFormalCorrespondence
        inlined: true
        multivalued: true
  CharacterizationFormalNode:
    is_a: SourceRecordProduct
    attributes:
      symbol_parent:
        range: string
        pattern: ^.+$
      input_id:
        range: string
        required: true
      node_kind:
        range: string
        required: true
        pattern: ^(token|rule)$
      rule:
        range: string
        required: true
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
      synthetic:
        range: boolean
      line:
        range: integer
        minimum_value: 0
      column:
        range: integer
        minimum_value: 0
      end_line:
        range: integer
        minimum_value: 0
      end_column:
        range: integer
        minimum_value: 0
      container_start:
        range: integer
        minimum_value: 0
      container_end:
        range: integer
        minimum_value: 0
      container_line:
        range: integer
        minimum_value: 0
      container_column:
        range: integer
        minimum_value: 0
      container_end_line:
        range: integer
        minimum_value: 0
      container_end_column:
        range: integer
        minimum_value: 0
      normalized:
        range: CharacterizationFormalNormalized
        inlined: true
  CharacterizationNativeMention:
    is_a: SourceRecordProduct
    attributes:
      coordinate_unit:
        range: string
        required: true
        pattern: ^(inclusive_canonical_token|inclusive_subtoken)$
      first:
        range: integer
        required: true
        minimum_value: 0
      last:
        range: integer
        required: true
        minimum_value: 0
      detected:
        range: boolean
        required: true
      supplied:
        range: boolean
        required: true
      clustered:
        range: boolean
        required: true
      mapping_status:
        range: string
        required: true
        pattern: ^(mapped|unmapped)$
      reason:
        range: string
      native_run:
        range: string
        required: true
  CharacterizationNativeEdu:
    is_a: SourceRecordProduct
    attributes:
      native_run:
        range: string
        required: true
      mode:
        range: string
        required: true
        pattern: ^(learned|layout_forced|supplied|predicted)$
      index:
        range: integer
        required: true
        minimum_value: 0
      token_start:
        range: integer
        required: true
        minimum_value: 0
      token_end:
        range: integer
        required: true
        minimum_value: 0
      provider_start:
        range: integer
        required: true
        minimum_value: 0
      provider_end:
        range: integer
        required: true
        minimum_value: 0
      text:
        range: string
        required: true
  CharacterizationNativeBoundary:
    is_a: SourceRecordProduct
    attributes:
      token_end:
        range: integer
        required: true
        minimum_value: 0
      learned:
        range: boolean
        required: true
      forced:
        range: boolean
        required: true
      disposition:
        range: string
        required: true
        pattern: ^(retained|merged)$
  CharacterizationNativeRst:
    is_a: SourceRecordProduct
    attributes:
      left_start:
        range: integer
        required: true
        minimum_value: 0
      left_end:
        range: integer
        required: true
        minimum_value: 0
      right_start:
        range: integer
        required: true
        minimum_value: 0
      right_end:
        range: integer
        required: true
        minimum_value: 0
      nuclearity:
        range: string
        required: true
        pattern: ^(NN|NS|SN)$
  CharacterizationContextGap:
    is_a: SourceRecordProduct
    attributes:
      left_selector:
        range: CharacterizationSourceSelector
        inlined: true
      right_selector:
        range: CharacterizationSourceSelector
        inlined: true
      reason:
        range: string
        required: true
  CharacterizationContext:
    is_a: SourceRecordProduct
    attributes:
      focal:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      examined:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
      gaps:
        range: CharacterizationContextGap
        inlined: true
        multivalued: true
  CharacterizationAnswerAlternative:
    is_a: SourceRecordProduct
    attributes:
      key:
        range: string
        required: true
      state:
        range: string
        required: true
      score:
        range: CharacterizationScore
        inlined: true
  CharacterizationModelAnswer:
    is_a: SourceRecordProduct
    attributes:
      family:
        range: string
        required: true
      question_key:
        range: string
        required: true
      declaration_digest:
        range: string
        required: true
        pattern: ^[0-9a-f]{64}$
      stage:
        range: string
        required: true
      answer_kind:
        range: string
        required: true
        pattern: ^(text|number|date|choice|noul|gliner_span|gliner_classification)$
      state:
        range: string
        required: true
      request_digest:
        range: string
        required: true
        pattern: ^[0-9a-f]{64}$
      native_answer:
        range: SourceValue
        inlined: true
        required: true
      candidate_list_digest:
