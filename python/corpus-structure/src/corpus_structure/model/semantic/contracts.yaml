      version: {range: string, required: true, slot_uri: execution:AnalysisProfile_version}
      demands: {range: AnalysisDemand, required: true, multivalued: true, minimum_cardinality: 1, inlined: true, inlined_as_list: true, slot_uri: execution:AnalysisProfile_demands}
      binding_roles: {range: BindingRoleRule, required: true, multivalued: true, inlined: true, inlined_as_list: true, slot_uri: execution:AnalysisProfile_binding_roles}
      builtin_functions: {range: string, multivalued: true, slot_uri: execution:AnalysisProfile_builtin_functions}
      local_declaration_rules: {range: string, multivalued: true, slot_uri: execution:AnalysisProfile_local_declaration_rules}
      ownership: {range: InputOwnershipContract, required: true, multivalued: true, minimum_cardinality: 1, inlined: true, inlined_as_list: true, slot_uri: execution:AnalysisProfile_ownership}
  AnalysisSymbolDeclaration:
    description: Source-local syntactic authority; entity attachment remains a separate binding.
    attributes:
      symbol: {range: string, required: true, slot_uri: execution:AnalysisSymbolDeclaration_symbol}
      role: {range: AnalysisSymbolRole, required: true, slot_uri: execution:AnalysisSymbolDeclaration_role}
      authority: {range: AnalysisDeclarationAuthority, required: true, slot_uri: execution:AnalysisSymbolDeclaration_authority}
      evidence: {range: string, required: true, slot_uri: execution:AnalysisSymbolDeclaration_evidence}
      source_id: {range: string, slot_uri: execution:AnalysisSymbolDeclaration_source_id}
      scope: {range: string, slot_uri: execution:AnalysisSymbolDeclaration_scope}
      start: {range: integer, minimum_value: 0, slot_uri: execution:AnalysisSymbolDeclaration_start}
      end: {range: integer, minimum_value: 0, slot_uri: execution:AnalysisSymbolDeclaration_end}
  AnalysisComputationResult:
    attributes:
      demand: {range: string, required: true, slot_uri: execution:AnalysisComputationResult_demand}
