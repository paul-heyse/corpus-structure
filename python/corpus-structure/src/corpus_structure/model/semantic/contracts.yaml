      alignment_policy: {range: AlignmentPolicyDefinition, inlined: true}
      placement_policy: {range: PlacementPolicyDefinition, inlined: true}
      grammar_recipe: {range: string, slot_uri: execution:AnalysisProfile_grammar_recipe}
      transformer_recipe: {range: string, slot_uri: execution:AnalysisProfile_transformer_recipe}
      shared_consumers: {range: string, multivalued: true, slot_uri: execution:AnalysisProfile_shared_consumers}
      scientific_profiles: {range: ScientificComputationProfile, multivalued: true, inlined: true, inlined_as_list: true, slot_uri: execution:AnalysisProfile_scientific_profiles}
