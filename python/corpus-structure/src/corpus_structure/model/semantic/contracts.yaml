id: https://corpus-structure.dev/semantic/contracts
name: semantic_contracts
imports:
- semantic_reference
- native_adapters
- pdf_products
description: Trusted execution companion types. These are definitions, not domain-extractable
  corpus classes.
prefixes:
  execution: https://corpus-structure.dev/execution/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: execution
default_range: string
types:
  string:
    base: str
    uri: xsd:string
  integer:
    base: int
    uri: xsd:integer
  boolean:
    base: bool
    uri: xsd:boolean
classes:
  PdfProjectionWriteProfile:
    description: Native projection-write admission requires a fresh statement snapshot after the build fence.
    attributes:
      allowed_isolation:
        range: PdfProjectionWriteIsolation
        required: true
        multivalued: true
        minimum_cardinality: 1
      rationale:
        range: string
  AnalysisDemand:
    attributes:
      id: {range: string, required: true, slot_uri: execution:AnalysisDemand_id}
      prerequisites: {range: string, multivalued: true, slot_uri: execution:AnalysisDemand_prerequisites}
      dependencies: {range: string, required: true, multivalued: true, minimum_cardinality: 1, slot_uri: execution:AnalysisDemand_dependencies}
  BindingRoleRule:
    attributes:
      kind: {range: string, required: true, slot_uri: execution:BindingRoleRule_kind}
      role: {range: AnalysisSymbolRole, required: true, slot_uri: execution:BindingRoleRule_role}
  InputOwnershipContract:
    attributes:
      id: {range: string, required: true, slot_uri: execution:InputOwnershipContract_id}
      concept: {range: string, required: true, slot_uri: execution:InputOwnershipContract_concept}
      operation: {range: string, required: true, slot_uri: execution:InputOwnershipContract_operation}
      lifetime: {range: string, required: true, slot_uri: execution:InputOwnershipContract_lifetime}
      dependencies: {range: string, required: true, multivalued: true, minimum_cardinality: 1, slot_uri: execution:InputOwnershipContract_dependencies}
  ScientificComputationProfile:
    attributes:
      policy_id: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_policy_id}
      symbolic_method: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_symbolic_method}
      numeric_method: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_numeric_method}
      backend: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_backend}
      simplify_seconds: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_simplify_seconds}
      points: {range: integer, required: true, slot_uri: execution:ScientificComputationProfile_points}
      max_draws: {range: integer, required: true, slot_uri: execution:ScientificComputationProfile_max_draws}
      minimum_valid_points: {range: integer, required: true, slot_uri: execution:ScientificComputationProfile_minimum_valid_points}
      relative_tolerance: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_relative_tolerance}
      absolute_tolerance: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_absolute_tolerance}
      seed: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_seed}
      numeric_requires: {range: string, required: true, slot_uri: execution:ScientificComputationProfile_numeric_requires}
  TextPreparationPolicy:
    attributes:
      recipe: {range: string, required: true, slot_uri: execution:TextPreparationPolicy_recipe}
      offsets: {range: string, required: true, slot_uri: execution:TextPreparationPolicy_offsets}
      atoms: {range: string, required: true, slot_uri: execution:TextPreparationPolicy_atoms}
      segmentation: {range: string, required: true, slot_uri: execution:TextPreparationPolicy_segmentation}
  AlignmentPolicyDefinition:
    attributes:
      recipe: {range: string, required: true, slot_uri: execution:AlignmentPolicyDefinition_recipe}
      max_iterations: {range: integer, required: true, slot_uri: execution:AlignmentPolicyDefinition_max_iterations}
      solver: {range: string, required: true, slot_uri: execution:AlignmentPolicyDefinition_solver}
      topology: {range: string, required: true, slot_uri: execution:AlignmentPolicyDefinition_topology}
      ambiguity: {range: string, required: true, slot_uri: execution:AlignmentPolicyDefinition_ambiguity}
  PlacementPolicyDefinition:
    attributes:
      candidate_limit: {range: integer, required: true, minimum_value: 1}
      recipe: {range: string, required: true, slot_uri: execution:PlacementPolicyDefinition_recipe}
      token_cutoff: {range: integer, required: true, slot_uri: execution:PlacementPolicyDefinition_token_cutoff}
      token_pad: {range: integer, required: true, slot_uri: execution:PlacementPolicyDefinition_token_pad}
      char_cutoff: {range: integer, required: true, slot_uri: execution:PlacementPolicyDefinition_char_cutoff}
      char_pad: {range: string, required: true, slot_uri: execution:PlacementPolicyDefinition_char_pad}
      char_errors: {range: string, required: true, slot_uri: execution:PlacementPolicyDefinition_char_errors}
      pick_cutoff: {range: integer, required: true, slot_uri: execution:PlacementPolicyDefinition_pick_cutoff}
      regex_timeout: {range: string, required: true, slot_uri: execution:PlacementPolicyDefinition_regex_timeout}
      refine_timeout: {range: string, required: true, slot_uri: execution:PlacementPolicyDefinition_refine_timeout}
  CapturePolicyDefinition:
    attributes:
      modes: {range: string, required: true, multivalued: true, minimum_cardinality: 1, slot_uri: execution:CapturePolicyDefinition_modes}
      manifest: {range: string, required: true, slot_uri: execution:CapturePolicyDefinition_manifest}
      digest: {range: string, required: true, slot_uri: execution:CapturePolicyDefinition_digest}
      ordering: {range: string, required: true, slot_uri: execution:CapturePolicyDefinition_ordering}
      completeness: {range: string, required: true, slot_uri: execution:CapturePolicyDefinition_completeness}
      storage: {range: string, required: true, slot_uri: execution:CapturePolicyDefinition_storage}
  CaptureSnapshotBinding:
    attributes:
      release_id: {range: string, required: true}
      realization_id: {range: string, required: true}
      data_revision: {range: integer, required: true, minimum_value: 0}
      capture_id: {range: string, required: true}
  CaptureRelationManifest:
    attributes:
      name: {range: string, identifier: true}
      rows: {range: integer, required: true, minimum_value: 0}
      logical_digest: {range: string, required: true}
      arrow_schema: {range: string, required: true}
      file: {range: string}
      sha256: {range: string}
  CaptureManifest:
    attributes:
      format: {range: string, required: true}
      digest_recipe: {range: string, required: true}
      complete: {range: boolean, required: true}
      binding: {range: CaptureSnapshotBinding, required: true, inlined: true}
      projection_id: {range: string, required: true}
      profile_digest: {range: string, required: true}
      logical_digest: {range: string, required: true}
      relations: {range: CaptureRelationManifest, required: true, multivalued: true, minimum_cardinality: 1, inlined: true, inlined_as_list: false}
  InvocationPolicyDefinition:
    attributes:
      logical_recipe: {range: string, required: true}
      executable_recipe: {range: string, required: true}
      dependencies: {range: string, required: true, multivalued: true}
      skipped_packet: {range: string, required: true}
      executable_packet: {range: string, required: true}
  InvocationDecision:
    attributes:
      recipe: {range: string, required: true}
      release: {range: string, required: true}
      source: {range: string, required: true}
      configuration: {range: string, required: true}
      policy: {range: string, required: true}
      unit: {range: string, required: true}
      disposition: {range: string, required: true}
      packet: {range: string}
  ScientificQuestionRule:
    attributes:
      question: {range: string, required: true, slot_uri: execution:ScientificQuestionRule_question}
      prerequisites: {range: string, required: true, multivalued: true, minimum_cardinality: 1, slot_uri: execution:ScientificQuestionRule_prerequisites}
