        multivalued: true
        minimum_cardinality: 0
        slot_uri: execution:RelationshipDefinition_qualifications
      invariants:
        range: string
        required: true
        multivalued: true
        minimum_cardinality: 1
        slot_uri: execution:RelationshipDefinition_invariants
      endpoints:
        range: EndpointRole
        required: true
        multivalued: true
