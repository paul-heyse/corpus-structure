        (''available'',''failed'',''cancelled'')", "semantic_state IN (''ok'',''ambiguous'',''invalid'',''unsupported'',''unknown'')",
        "provenance_state IN (''complete'',''partial'',''unknown'',''unsupported'')",
        "recipe IN (''source-products-v1'')"]'
  parsing_representation:
    in_subset:
    - kb
    attributes:
      task_id:
        range: integer
        required: true
      representation_id:
        range: string
