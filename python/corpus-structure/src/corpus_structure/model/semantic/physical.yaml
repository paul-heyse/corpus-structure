        {"columns": ["task_id", "representation_id", "unit"], "target": "kb.parsing_representation.task_id,representation_id,unit"}]'
      ph:checks: '["(origin = ''literal'' AND num_nonnulls(representation_id,unit,start_offset,end_offset) = 4 AND origin_reason IS NULL) OR (origin IN (''synthetic'',''derived'') AND num_nonnulls(representation_id,unit,start_offset,end_offset) = 0 AND origin_reason IS NOT NULL)", "start_offset >= 0 AND end_offset >= start_offset"]'

