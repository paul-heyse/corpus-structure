  occurrence_evidence:
    in_subset:
    - data
    attributes:
      realization_id:
        range: string
        required: true
      release_id:
        range: string
        required: true
      occurrence_id:
        range: string
        required: true
      evidence_id:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - realization_id
        - release_id
        - occurrence_id
        - evidence_id
    annotations:
      ph:foreign_keys: '[{"columns": ["realization_id", "release_id"], "target": "data.realization.realization_id,release_id"},
        {"columns": ["realization_id", "release_id", "occurrence_id"], "target": "data.occurrence.realization_id,release_id,occurrence_id"},
        {"columns": ["realization_id", "release_id", "evidence_id"], "target": "data.evidence.realization_id,release_id,evidence_id"}]'
  membership_support:
    in_subset:
