      scope:
        range: string
        required: true
      outcome:
        range: string
        required: true
      reason:
        range: string
        required: false
    unique_keys:
      primary_key:
        unique_key_slots:
        - realization_id
        - release_id
        - coverage_id
    annotations:
      ph:foreign_keys: '[{"columns": ["realization_id", "release_id"], "target": "data.realization.realization_id,release_id"}]'
      ph:checks: '["outcome IN (''complete'',''partial'',''unanalysed'',''failed'')"]'
  sql_admission:
    description: Derived authored-SQL admission tied to the frozen dependency and physical catalog.
    in_subset:
    - sem
    attributes:
      release_id:
        required: true
      input_kind:
        required: true
        annotations:
          ph:default: '''dependency'''
      input_name:
        required: true
      physical_id:
        required: true
      content:
        range: bytes
        required: true
      content_digest:
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - input_name
        - physical_id
    annotations:
      ph:foreign_keys: '[{"columns": ["release_id", "input_kind", "input_name"], "target": "sem.input.release_id,input_kind,input_name"}]'
      ph:checks: '["input_kind = ''dependency''"]'
