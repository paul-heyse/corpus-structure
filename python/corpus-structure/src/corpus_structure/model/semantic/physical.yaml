        required: true
      batch_id:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - realization_id
        - release_id
        - occurrence_id
      unique_0:
        unique_key_slots:
        - realization_id
        - release_id
        - occurrence_id
        - fact_id
    annotations:
      ph:foreign_keys: '[{"columns": ["realization_id", "release_id"], "target": "data.realization.realization_id,release_id"},
        {"columns": ["realization_id", "release_id", "fact_id"], "target": "data.fact.realization_id,release_id,fact_id"},
        {"columns": ["realization_id", "release_id", "batch_id"], "target": "data.batch.realization_id,release_id,batch_id"}]'
      ph:indexes: '[["realization_id", "release_id", "source", "item"]]'
  support:
    in_subset:
    - data
    attributes:
      realization_id:
        range: string
        required: true
      release_id:
        range: string
        required: true
      fact_id:
        range: string
        required: true
      occurrence_id:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - realization_id
        - release_id
        - fact_id
        - occurrence_id
    annotations:
      ph:foreign_keys: '[{"columns": ["realization_id", "release_id"], "target": "data.realization.realization_id,release_id"},
        {"columns": ["realization_id", "release_id", "occurrence_id", "fact_id"], "target": "data.occurrence.realization_id,release_id,occurrence_id,fact_id"}]'
  selection:
