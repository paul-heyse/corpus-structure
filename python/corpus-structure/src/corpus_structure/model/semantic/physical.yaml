      ph:checks: '["kind IN (''original'',''decoded'',''canonical'',''expanded'')",
        "unit IN (''byte'',''codepoint'')", "extent_length >= 0", "(unit = ''byte''
        AND kind = ''original'' AND text_content IS NULL AND text_content_utf8_base64 IS NULL) OR (unit = ''codepoint'' AND
        kind <> ''original'' AND num_nonnulls(text_content,text_content_utf8_base64)=1 AND (text_content IS NULL OR extent_length = char_length(text_content)))",
        "partition_state IN (''complete'',''partial'',''unknown'',''unsupported'')",
        "recognition_state IN (''complete'',''partial'',''unknown'',''unsupported'')",
        "kind <> ''decoded'' OR (encoding IS NOT NULL AND decoder IS NOT NULL AND newline_policy
