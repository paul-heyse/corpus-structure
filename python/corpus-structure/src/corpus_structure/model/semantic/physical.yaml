    annotations:
      ph:foreign_keys: '[{"columns": ["realization_id", "release_id"], "target": "data.realization.realization_id,release_id"},
        {"columns": ["realization_id", "release_id", "conclusion_fact_id"], "target": "data.fact.realization_id,release_id,fact_id"}]'
  derivation_premise:
    in_subset:
    - data
    attributes:
      realization_id:
        range: string
        required: true
      release_id:
        range: string
        required: true
      derivation_id:
        range: string
        required: true
      position:
        range: integer
        required: true
      premise_fact_id:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - realization_id
        - release_id
        - derivation_id
