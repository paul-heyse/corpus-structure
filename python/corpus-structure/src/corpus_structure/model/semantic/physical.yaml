id: https://corpus-structure.org/model/semantic/physical
name: semantic_physical
version: 2026-11-16-current-declared-operations-1
description: Current declared-operation PostgreSQL realization; semantic releases
  never supply physical annotations.
prefixes:
  cp: https://corpus-structure.dev/companion-projections/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  ph: https://corpus-structure.org/physical/
imports:
- linkml:types
- pdf-records
- pdf-staging
- data-operation-physical
- data-operation-task-physical
default_range: string
subsets:
  sem: {}
  data: {}
  ops: {}
  kb: {}
  eval: {}
types:
  timestamp:
    typeof: string
    annotations:
      ph:sql_type: timestamptz
  bytes:
    typeof: string
    annotations:
      ph:sql_type: bytea
  json_payload:
    typeof: string
    annotations:
      ph:sql_type: jsonb
  exact_numeric:
    typeof: decimal
    annotations:
      ph:sql_type: numeric
  numeric_range:
    typeof: string
    annotations:
      ph:sql_type: numrange
  integer_range:
    typeof: string
    annotations:
      ph:sql_type: int8range
  search_vector_value:
    typeof: string
    annotations:
      ph:sql_type: tsvector
  contextual_vector_value:
    typeof: string
    annotations:
      ph:sql_type: vector
classes:
  runtime_binding:
    description: Immutable implementation provenance bound to one semantic release;
      implementation changes do not mint a semantic release.
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      runtime_id:
        range: string
        required: true
        annotations:
          ph:python_type: corpus_structure.semantic.identifiers.RuntimeId
      manifest_bytes:
        range: bytes
        required: true
      execution_profile:
        range: string
        required: true
      archive_bytes:
        range: bytes
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - runtime_id
    annotations:
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
      ph:immutability: intrinsic
  physical_contract:
    in_subset:
    - sem
    attributes:
      physical_id:
        range: string
        required: true
      checks:
        range: json_payload
        required: true
      source_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - physical_id
    annotations:
      ph:immutability: physical
  release_finalization:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      content_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
    annotations:
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
      ph:immutability: immutable
  deployment_admission:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      physical_id:
        range: string
        required: true
      deployment_id:
        range: string
        required: true
      kind:
        range: string
        required: true
      content:
        range: bytes
        required: true
      content_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - physical_id
        - deployment_id
        - kind
    annotations:
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
      ph:immutability: immutable
  release:
    in_subset:
    - sem
    attributes:
      release_id:
        annotations:
          ph:python_type: corpus_structure.semantic.identifiers.ReleaseId
        range: string
        required: true
      parent_release_id:
        range: string
        required: false
      content_digest:
        range: string
        required: true
      profile:
        range: string
        required: true
      prepared_bytes:
        range: bytes
        required: true
      manifest_bytes:
        range: bytes
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: header
      ph:foreign_keys: '[{"columns": ["parent_release_id"], "target": "sem.release.release_id"}]'
  input:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      input_kind:
        range: string
        required: true
      input_name:
        range: string
        required: true
      content:
        range: bytes
        required: true
      content_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - input_kind
        - input_name
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: input
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
  artifact:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      artifact_name:
        range: string
        required: true
      media_type:
        range: string
        required: true
      content:
        range: bytes
        required: true
      content_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - artifact_name
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: artifact
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
  registry_row:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      kind:
        range: string
        required: true
      name:
        range: string
        required: true
      body:
        range: bytes
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - kind
        - name
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
  class_definition:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      class_id:
        range: string
        required: true
      name:
        range: string
        required: true
      iri:
        range: string
        required: true
      abstract:
        range: boolean
        required: true
        annotations:
          ph:default: 'false'
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - class_id
      unique_0:
        unique_key_slots:
        - release_id
        - iri
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
  property_definition:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      property_id:
        range: string
        required: true
      name:
        range: string
        required: true
      iri:
        range: string
        required: true
      value_kind:
        range: string
        required: false
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - property_id
      unique_0:
        unique_key_slots:
        - release_id
        - iri
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
  class_hierarchy:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      class_id:
        range: string
        required: true
      ancestor_id:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - class_id
        - ancestor_id
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id", "class_id"], "target": "sem.class_definition.release_id,class_id"},
        {"columns": ["release_id", "ancestor_id"], "target": "sem.class_definition.release_id,class_id"}]'
  property_applicability:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      class_id:
        range: string
        required: true
      property_id:
        range: string
        required: true
      range_name:
        range: string
        required: true
      required:
        range: boolean
        required: true
      multivalued:
        range: boolean
        required: true
      minimum_cardinality:
        range: integer
        required: false
      maximum_cardinality:
        range: integer
        required: false
      constraint_scope:
        range: string
        required: true
      constraints:
        range: json_payload
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - class_id
        - property_id
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id", "class_id"], "target": "sem.class_definition.release_id,class_id"},
        {"columns": ["release_id", "property_id"], "target": "sem.property_definition.release_id,property_id"}]'
      ph:checks: '["minimum_cardinality IS NULL OR minimum_cardinality >= 0", "maximum_cardinality
        IS NULL OR maximum_cardinality >= 0", "minimum_cardinality IS NULL OR maximum_cardinality
        IS NULL OR minimum_cardinality <= maximum_cardinality"]'
  identity_slot:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      class_id:
        range: string
        required: true
      group_id:
        range: string
        required: true
      position:
        range: integer
        required: true
      property_id:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - class_id
        - group_id
        - position
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id", "class_id"], "target": "sem.class_definition.release_id,class_id"},
        {"columns": ["release_id", "property_id"], "target": "sem.property_definition.release_id,property_id"}]'
      ph:checks: '["position >= 0"]'
  vocabulary_member:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      vocabulary_id:
        range: string
        required: true
      value:
        range: string
        required: true
      meaning:
        range: string
        required: false
      label:
        range: string
        required: false
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - vocabulary_id
        - value
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"}]'
  project:
    in_subset:
    - data
    attributes:
      project_id:
        range: string
        required: true
        annotations:
          ph:python_type: corpus_structure.semantic.identifiers.ProjectId
      active_release_id:
        range: string
        required: false
      generation:
        range: integer
        required: true
        annotations:
          ph:default: '0'
    unique_keys:
      primary_key:
        unique_key_slots:
        - project_id
    annotations:
      ph:foreign_keys: '[{"columns": ["active_release_id"], "target": "sem.release.release_id"}]'
      ph:checks: '["generation >= 0"]'
  sql_admission:
    description: Derived authored-SQL admission tied to the frozen dependency and
      physical catalog.
    in_subset:
    - sem
    attributes:
      release_id:
        required: true
      input_kind:
        required: true
        annotations:
          ph:default: '''dependency'''
      input_name:
        required: true
      physical_id:
        required: true
      content:
        range: bytes
        required: true
      content_digest:
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - input_name
        - physical_id
    annotations:
      ph:immutability: deployment
      ph:foreign_keys: '[{"columns": ["release_id", "input_kind", "input_name"], "target":
        "sem.input.release_id,input_kind,input_name"}]'
      ph:checks: '["input_kind = ''dependency''"]'
  document:
    in_subset:
    - kb
    attributes:
      id:
        range: integer
        required: true
        annotations:
          ph:python_type: corpus_structure.semantic.identifiers.DocumentId
          ph:identity: 'true'
      project_id:
        annotations:
          cp:type_source: physical:data.project.project_id
        range: string
        required: true
      key:
        range: string
        required: true
      source_uri:
        range: string
        required: true
      content_hash:
        range: string
        required: true
      original_path:
        range: string
        required: true
      mime:
        range: string
        required: true
      title:
        range: string
        required: false
      meta:
        range: json_payload
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - id
      unique_0:
        unique_key_slots:
        - project_id
        - key
      unique_1:
        unique_key_slots:
        - project_id
        - id
    annotations:
      ph:foreign_keys: '[{"columns": ["project_id"], "target": "data.project.project_id"}]'
      ph:checks: '[]'
  conditional_rule:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      rule_id:
        range: string
        required: true
      class_id:
        range: string
        required: true
      scope:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - rule_id
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id"], "target": "sem.release.release_id"},
        {"columns": ["release_id", "class_id"], "target": "sem.class_definition.release_id,class_id"}]'
      ph:checks: '["scope IN (''shape'',''accepted_value'')"]'
  conditional_atom:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      rule_id:
        range: string
        required: true
      branch:
        range: string
        required: true
      position:
        range: integer
        required: true
      property_name:
        range: string
        required: true
      presence:
        range: string
        required: true
      choices:
        range: json_payload
        required: false
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - rule_id
        - branch
        - position
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns": ["release_id", "rule_id"], "target": "sem.conditional_rule.release_id,rule_id"}]'
      ph:checks: '["branch IN (''if'',''then'',''else'')", "position>=0", "presence
        IN (''present'',''absent'',''optional'')", "choices IS NULL OR choices=''null''::jsonb
        OR jsonb_typeof(choices)=''array''"]'
  metric_definition:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      metric_id:
        range: string
        required: true
      value_type:
        range: string
        required: true
      subject_kind:
        range: string
        required: true
      detail_schema:
        range: string
        required: true
      description:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - metric_id
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns":["release_id"],"target":"sem.release.release_id"}]'
  operation_property_role:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      class_id:
        range: string
        required: true
      property_id:
        range: string
        required: true
      role:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - class_id
        - property_id
        - role
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns":["release_id","class_id","property_id"],"target":"sem.property_applicability.release_id,class_id,property_id"}]'
  scientific_decision_rule:
    in_subset:
    - sem
    attributes:
      release_id:
        range: string
        required: true
      policy_id:
        range: string
        required: true
      evidence_tier:
        range: string
        required: true
      agreement:
        range: string
        required: true
      decision:
        range: string
        required: true
      decision_tier:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - release_id
        - policy_id
        - evidence_tier
        - agreement
    annotations:
      ph:immutability: intrinsic
      ph:archive_role: projection
      ph:foreign_keys: '[{"columns":["release_id"],"target":"sem.release.release_id"}]'
  source_artifact:
    in_subset:
    - kb
    attributes:
      artifact_digest:
        range: string
        required: true
      content:
        range: bytes
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - artifact_digest
    annotations:
      ph:immutability: immutable
      ph:checks: '["artifact_digest = encode(sha256(content),''hex'')"]'
  source_build:
    in_subset:
    - ops
    attributes:
      task_id:
        range: integer
        required: true
      release_id:
        range: string
        required: true
      artifact_digest:
        range: string
        required: true
      recipe_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - task_id
      unique_0:
        unique_key_slots:
        - task_id
        - release_id
    annotations:
      ph:immutability: immutable
      ph:foreign_keys: '[{"columns": ["task_id", "release_id"], "target": "ops.task.id,release_id"},
        {"columns": ["artifact_digest"], "target": "kb.source_artifact.artifact_digest"},
        {"columns": ["recipe_digest"], "target": "kb.source_artifact.artifact_digest"}]'
  pdf_product:
    in_subset:
    - ops
    attributes:
      task_id:
        range: integer
        required: true
      product_key:
        range: string
        required: true
        annotations:
          ph:python_type: corpus_structure.semantic.identifiers.ProductKey
      content_digest:
        range: string
        required: true
        annotations:
          ph:python_type: corpus_structure.semantic.identifiers.ContentDigest
      kind:
        range: string
        required: true
      artifact_digest:
        range: string
        required: true
      release_id:
        range: string
        required: true
      contract_digest:
        range: string
        required: true
      publication_context:
        range: json_payload
        description: Native-stamped first observation publication custody, separate from payload meaning. Absent historical custody cannot authorize an observation-set effect.
    unique_keys:
      primary_key:
        unique_key_slots:
        - task_id
        - product_key
      unique_0:
        unique_key_slots:
        - task_id
        - product_key
        - content_digest
    annotations:
      ph:immutability: immutable
      ph:foreign_keys: '[{"columns": ["task_id", "release_id"], "target": "ops.source_build.task_id,release_id"},
        {"columns": ["artifact_digest"], "target": "kb.source_artifact.artifact_digest"}]'
      ph:checks: '["kind IN (''native'',''recognition_observation'',''integrated'')",
        "product_key <> ''''", "content_digest ~ ''^[0-9a-f]{64}$''", "contract_digest
        ~ ''^[0-9a-f]{64}$''"]'
  pdf_product_body:
    in_subset:
    - ops
    attributes:
      task_id:
        range: integer
        required: true
      product_key:
        range: string
        required: true
      payload:
        range: bytes
        required: true
      descriptor:
        range: json_payload
        required: true
      recipe_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - task_id
        - product_key
    annotations:
      ph:immutability: immutable
      ph:checks: '["descriptor = ops.pdf_product_descriptor(payload)"]'
      ph:foreign_keys: '[{"columns": ["task_id", "product_key"], "target": "ops.pdf_product.task_id,product_key"},
        {"columns": ["recipe_digest"], "target": "kb.source_artifact.artifact_digest"}]'
  pdf_product_input:
    in_subset:
    - ops
    attributes:
      task_id:
        range: integer
        required: true
      product_key:
        range: string
        required: true
      input_index:
        range: integer
        required: true
      role:
        range: string
        required: true
      input_task_id:
        range: integer
        required: true
      input_product_key:
        range: string
        required: true
      input_content_digest:
        range: string
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - task_id
        - product_key
        - input_index
      unique_0:
        unique_key_slots:
        - task_id
        - product_key
        - role
        - input_task_id
        - input_product_key
    annotations:
      ph:immutability: immutable
      ph:foreign_keys: '[{"columns": ["task_id", "product_key"], "target": "ops.pdf_product.task_id,product_key"},
        {"columns": ["input_task_id", "input_product_key", "input_content_digest"],
        "target": "ops.pdf_product.task_id,product_key,content_digest"}]'
      ph:checks: '["input_index >= 0", "role IN (''structural'',''recognition'',''alternative'',''policy_input'')",
        "task_id <> input_task_id OR product_key <> input_product_key"]'
      ph:indexes: '[["input_task_id", "input_product_key", "task_id", "product_key"]]'
  pdf_occurrence:
    in_subset:
    - kb
    attributes:
      task_id:
        range: integer
        required: true
      product_key:
        range: string
        required: true
      occurrence_id:
        range: string
        required: true
      kind:
        range: string
        required: true
      address_space:
        range: string
        required: true
      precision:
        range: string
        required: true
      body:
        range: json_payload
        required: true
      pointer:
        range: string
        required: false
    unique_keys:
      primary_key:
        unique_key_slots:
        - task_id
        - product_key
        - occurrence_id
    annotations:
      ph:immutability: immutable
      ph:foreign_keys: '[{"columns": ["task_id", "product_key"], "target": "ops.pdf_product.task_id,product_key"}]'
      ph:checks: '["occurrence_id <> ''''", "kind IN (''item'',''cell'',''formula'',''chart'',''text'',''region'')",
        "pointer IS NOT DISTINCT FROM body->>''pointer''", "precision IN (''unknown'',''coarse'',''inherited'',''block'',''item'',''cell'',''word'',''glyph'')"]'
      ph:indexes: '[["task_id", "product_key", "pointer", "occurrence_id"]]'
  pdf_relation:
    in_subset:
    - kb
    attributes:
      task_id:
        range: integer
        required: true
      product_key:
        range: string
        required: true
      relation_id:
        range: string
        required: true
      kind:
        range: string
        required: true
      body:
        range: json_payload
        required: true
    unique_keys:
      primary_key:
        unique_key_slots:
        - task_id
        - product_key
        - relation_id
    annotations:
      ph:immutability: immutable
      ph:foreign_keys: '[{"columns": ["task_id", "product_key"], "target": "ops.pdf_product.task_id,product_key"}]'
