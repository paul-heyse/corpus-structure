        required: true
      subject_id:
        range: string
        required: true
      property_id:
        range: string
        required: true
      object_value_id:
        range: string
        required: true
      qualification_value_id:
        range: string
        required: false
    unique_keys:
      primary_key:
        unique_key_slots:
        - realization_id
        - release_id
        - fact_id
    annotations:
      ph:foreign_keys: '[{"columns": ["realization_id", "release_id"], "target": "data.realization.realization_id,release_id"},
        {"columns": ["realization_id", "release_id", "subject_id"], "target": "data.entity.realization_id,release_id,entity_id"},
        {"columns": ["release_id", "property_id"], "target": "sem.property_definition.release_id,property_id"},
        {"columns": ["realization_id", "release_id", "object_value_id"], "target": "data.typed_value.realization_id,release_id,value_id"},
        {"columns": ["realization_id", "release_id", "qualification_value_id"], "target": "data.typed_value.realization_id,release_id,value_id"}]'
      ph:indexes: '[["realization_id", "release_id", "property_id", "subject_id"], ["realization_id",
        "release_id", "property_id", "object_value_id"]]'
  occurrence:
