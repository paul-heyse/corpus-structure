      coverage_id: {range: PdfString, required: true, slot_uri: 'pdf:PdfCoverageSupport_coverage_id'}

  PdfIntegrationPolicy:
    description: Versioned application selection rules; confidence alone never licenses replacement.
    attributes:
      comparison_demand: {range: PdfSelectionComparisonDemand, required: true, description: "Omitted authored values normalize to lexical before admission; version 1 selection does not request positioned syntax or symbolic comparison.", slot_uri: pdf:PdfIntegrationPolicy_comparison_demand}
