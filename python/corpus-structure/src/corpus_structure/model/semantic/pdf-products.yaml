  PdfViewPiece:
    attributes:
      item_ref:
        range: PdfPointer
        required: false
        slot_uri: pdf:PdfViewPiece_item_ref
      start:
        range: PdfInteger
        required: true
        minimum_value: 0
        slot_uri: pdf:PdfViewPiece_start
      end:
        range: PdfInteger
        required: true
        minimum_value: 0
        slot_uri: pdf:PdfViewPiece_end
      kind:
