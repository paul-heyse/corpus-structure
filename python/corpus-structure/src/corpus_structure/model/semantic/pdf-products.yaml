        required: false
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: pdf:PdfNativeEnvelope_derivation_mappings
  PdfFormulaOutcome:
    attributes:
      pointer:
        range: PdfPointer
        required: true
        slot_uri: pdf:PdfFormulaOutcome_pointer
      outcome:
        range: PdfRecognitionOutcome
        required: true
        slot_uri: pdf:PdfFormulaOutcome_outcome
