      conflict_action: {range: PdfIntegrationAction, required: true, slot_uri: 'pdf:PdfIntegrationPolicy_conflict_action'}
      unmatched_action: {range: PdfIntegrationAction, required: true, slot_uri: 'pdf:PdfIntegrationPolicy_unmatched_action'}
      specialized_crop_precedence: {range: PdfBoolean, required: true, slot_uri: 'pdf:PdfIntegrationPolicy_specialized_crop_precedence'}

  PdfMappingDisposition:
    description: Attributed outcome for a raw block or unparsed raw tail; retained independently of selected content.
    attributes:
