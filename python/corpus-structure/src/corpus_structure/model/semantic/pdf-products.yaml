        required: true
        inlined: true
        slot_uri: pdf:PdfNativeEnvelope_health
      parent_task_id:
        range: PdfInteger
        required: false
        minimum_value: 1
        slot_uri: pdf:PdfNativeEnvelope_parent_task_id
      parent_product_key:
        range: PdfString
        required: false
        slot_uri: pdf:PdfNativeEnvelope_parent_product_key
      parent_digest:
        range: PdfDigest
        required: false
        slot_uri: pdf:PdfNativeEnvelope_parent_digest
      items:
        range: PdfItemProjection
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: pdf:PdfNativeEnvelope_items
      regions:
        range: PdfPageRegion
        required: false
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: pdf:PdfNativeEnvelope_regions
      recognition_coverage:
