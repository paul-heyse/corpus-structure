id: https://corpus-structure.dev/semantic/pdf-products
name: pdf_products
prefixes:
  pdf: https://corpus-structure.dev/pdf/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: pdf
default_range: PdfString
types:
  PdfString:
    base: str
    uri: xsd:string
  PdfDigest:
    base: str
    uri: xsd:string
    pattern: ^[0-9a-f]{64}$
  PdfPointer:
    base: str
    uri: xsd:string
    pattern: ^#(/[^/]+)+$
  PdfInteger:
    base: int
    uri: xsd:integer
  PdfNumber:
    base: float
    uri: xsd:double
  PdfBoolean:
    base: bool
    uri: xsd:boolean
