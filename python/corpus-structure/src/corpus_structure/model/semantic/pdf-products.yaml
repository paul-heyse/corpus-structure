      normalization: {range: PdfNormalization, required: false, slot_uri: pdf:PdfMappingDisposition_normalization}

  PdfRecognitionRecoveryPolicy:
    description: One attributed repetition recovery variant; failed observations remain immutable inputs.
    attributes:
      policy_id: {range: string, required: true, equals_string: length-repetition-recovery-v1, slot_uri: pdf:PdfRecognitionRecoveryPolicy_policy_id}
      eligible_finish_reason: {range: string, required: true, equals_string: length, slot_uri: pdf:PdfRecognitionRecoveryPolicy_eligible_finish_reason}
      min_identical_character_run: {range: PdfInteger, required: true, minimum_value: 64, slot_uri: pdf:PdfRecognitionRecoveryPolicy_min_identical_character_run}
