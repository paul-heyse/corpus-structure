      items:
        range: PdfPointer
        required: true
        multivalued: true
        slot_uri: pdf:PdfViewProjection_items
      ancestors:
        range: PdfPointer
        required: false
        multivalued: true
        slot_uri: pdf:PdfViewProjection_ancestors
      health:
