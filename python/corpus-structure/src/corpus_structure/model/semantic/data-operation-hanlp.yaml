id: https://corpus-structure.dev/semantic/data-operation-hanlp
name: data_operation_hanlp
prefixes:
  dsh: https://corpus-structure.dev/semantic/data-operation-hanlp/
default_prefix: dsh
default_range: string
classes:
  DdoHanlpSubwords:
    is_a: SourceRecordProduct
    attributes:
      positions:
        range: integer
        multivalued: true
        required: true
        minimum_cardinality: 1
  DdoHanlpManifestPacket:
    is_a: SourceRecordProduct
    attributes:
      member_id:
        required: true
      kind_contract:
        required: true
      context:
        range: DdoSentenceContext
        inlined: true
        required: true
      body:
        range: DdoHanlpManifest
        inlined: true
        required: true
  DdoHanlpInventory:
    is_a: DdoCharacterizationEnvelope
    annotations:
      cs:data_universe: source
    attributes:
      canonical_input: {range: DdoSemanticReference, inlined: true, required: true}
      rows:
        range: DdoHanlpPartitionRow
        inlined: true
        multivalued: true
        annotations:
          'cs:collection': '{"unit":"partitioned","partition_key":"block_id","item_order":["sentence_ordinal","record_type","ordinal"],"address":["sentence_ordinal","record_type","ordinal"],"field_groups":{"addresses":["sentence_ordinal","record_type","ordinal","sentence","token","tokens"],"annotations":["lemma","pos","dependency_head","dependency_label","path","label","start","end","children","roles","prepared_words","word_subwords","token_id_standing","vocabulary_namespace","input_ids"]}}'
      outcome:
        required: true
        pattern: '^(complete|partial)$(?![\s\S])'
      members:
        range: DdoHanlpManifestPacket
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
  DdoHanlpPartitionRow:
    is_a: SourceRecordProduct
    attributes:
      record_type: {required: true, pattern: '^(token|constituent|srl_group|alignment)$(?![\s\S])'}
      sentence_ordinal: {range: integer, required: true, minimum_value: 0}
      ordinal: {range: integer, required: true, minimum_value: 0}
      sentence: {range: DdoSemanticReference, required: true, inlined: true}
      token: {range: DdoSemanticReference, inlined: true}
      tokens: {range: DdoSemanticReference, inlined: true, multivalued: true}
      lemma: {}
      pos: {}
      dependency_head: {range: integer}
      dependency_label: {}
      path: {range: integer, multivalued: true}
      label: {}
      start: {range: integer}
      end: {range: integer}
      children: {range: DdoHanlpPartitionChild, inlined: true, multivalued: true}
      roles: {range: DdoHanlpPartitionSrlRole, inlined: true, multivalued: true}
      prepared_words: {multivalued: true}
      word_subwords: {range: DdoHanlpSubwords, inlined: true, multivalued: true}
      token_id_standing: {}
      vocabulary_namespace: {}
      input_ids: {range: integer, multivalued: true}
  DdoHanlpPartitionChild:
    is_a: SourceRecordProduct
    attributes:
      kind: {required: true}
      constituent_path: {range: integer, multivalued: true}
      token: {range: DdoSemanticReference, inlined: true}
  DdoHanlpPartitionSrlRole:
    is_a: SourceRecordProduct
    attributes:
      native_text: {}
      label: {required: true}
      start: {range: integer, required: true}
      end: {range: integer, required: true}
      tokens: {range: DdoSemanticReference, inlined: true, multivalued: true, required: true}
  DdoHanlpManifest:
    is_a: SourceRecordProduct
    mixins:
    - DdoCharacterizedProduct
