id: https://corpus-structure.dev/semantic/data-operation-sentences
name: data_operation_sentences
prefixes:
  dss: https://corpus-structure.dev/semantic/data-operation-sentences/
default_prefix: dss
default_range: string
classes:
  DdoSentenceCoverage:
    is_a: SourceRecordProduct
    attributes:
      block_id:
        required: true
      native_pointer: {}
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
      outcome:
        required: true
        pattern: '^(complete|empty|unsupported)$(?![\s\S])'
      reason: {}
  DdoSentenceScope:
    is_a: SourceRecordProduct
    attributes:
      source:
        range: DdoNativeSourceCoordinate
        inlined: true
        required: true
      selectors:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
        required: true
        minimum_cardinality: 1
  DdoSentenceContext:
    is_a: SourceRecordProduct
    attributes:
      subject_definition: {required: true}
      subject:
        required: true
      original_source:
        required: true
      analyzed_scope:
        range: DdoSentenceScope
        inlined: true
        required: true
  DdoCanonicalManifestPacket:
    is_a: SourceRecordProduct
    attributes:
      member_id:
        required: true
      kind_contract:
        required: true
      context:
        range: DdoSentenceContext
        inlined: true
        required: true
      body:
        range: DdoCanonicalManifest
        inlined: true
        required: true
  DdoSentencePartitionRow:
    is_a: SourceRecordProduct
    attributes:
      record_type: {required: true, pattern: '^(token|sentence)$(?![\s\S])'}
      ordinal: {range: integer, required: true, minimum_value: 0}
      start: {range: integer, required: true, minimum_value: 0}
      end: {range: integer, required: true, minimum_value: 1}
      extent: {range: integer, required: true, minimum_value: 1}
      sentence: {range: integer, minimum_value: 0}
      space: {range: boolean}
      role: {}
      piece_indices: {range: integer, multivalued: true}
  DdoCanonicalPartitionRow:
    is_a: DdoSentencePartitionRow
    attributes:
      annotation: {range: DdoSemanticReference, required: true, inlined: true}
  DdoAnnotationPartitionRow:
    is_a: DdoSentencePartitionRow
    attributes:
      lemma: {}
      pos: {}
      tag: {}
      dependency: {}
      morphology: {multivalued: true}
      head: {range: integer, minimum_value: 0}
      lower: {}
      is_alpha: {range: boolean}
      is_space: {range: boolean}
      is_punct: {range: boolean}
      is_quote: {range: boolean}
      like_num: {range: boolean}
      sent_start: {range: boolean}
  DdoCanonicalSentences:
    annotations:
      cs:data_universe: source
    is_a: DdoCharacterizationEnvelope
    description: Declared canonical sentence/tokenization members independent of native
      linguistic labels.
    attributes:
      source:
        range: DdoNativeSourceCoordinate
        inlined: true
        required: true
      selectors:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
        required: true
      outcome:
        required: true
        pattern: '^(complete|partial)$(?![\s\S])'
      block_coverage:
        range: DdoSentenceCoverage
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
      coverage:
        range: DdoCharacterizationCoverage
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
      rows:
        range: DdoCanonicalPartitionRow
        inlined: true
        multivalued: true
        annotations:
          'cs:collection': '{"unit":"partitioned","partition_key":"block_id","item_order":["record_type","ordinal"],"address":["record_type","ordinal"],"field_groups":{"geometry":["record_type","ordinal","start","end","extent","sentence","space","role","piece_indices"],"references":["annotation"]}}'
      members:
        range: DdoCanonicalManifestPacket
        inlined: true
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
  DdoAnnotationComponent:
    is_a: SourceRecordProduct
    attributes:
      name:
        range: string
        required: true
      factory:
        range: string
        required: true
  DdoAnnotationAvailability:
    is_a: SourceRecordProduct
    attributes:
      attribute:
        range: string
        required: true
      status:
        range: string
        required: true
        pattern: '^(complete|partial|absent|not_applicable)$(?![\s\S])'
  DdoAnnotationExtent:
    is_a: SourceRecordProduct
    attributes:
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
  DdoAnnotationPiece:
    is_a: SourceRecordProduct
    attributes:
      item_ref:
        range: string
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
      kind:
        range: string
        required: true
        pattern: '^(native_text|synthetic_separator)$(?![\s\S])'
      cell_index:
        range: integer
      source_field:
        range: string
  DdoAnnotationBlockLayout:
    is_a: SourceRecordProduct
    attributes:
      source:
        range: RecordSourcePin
        required: true
        inlined: true
      block_id:
        range: string
        required: true
      kind:
        range: string
        required: true
        pattern: '^(paragraph|list_item|table_cell|caption)$(?![\s\S])'
      block_start:
        range: integer
        required: true
        minimum_value: 0
      block_end:
        range: integer
        required: true
        minimum_value: 1
      display_spans:
        range: DdoAnnotationExtent
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
      text_digest:
        range: string
        required: true
      native_pieces:
        range: DdoAnnotationPiece
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
      layout_digest:
        range: string
        required: true
      layout_recipe:
        range: string
        required: true
      profile_recipe:
        range: string
        required: true
      profile_digest:
        range: string
        required: true
      spacy_version:
        range: string
        required: true
      model:
        range: string
        required: true
      model_version:
        range: string
        required: true
      pipeline_config_digest:
        range: string
        required: true
      dependency_digest:
        range: string
        required: true
      components:
        range: DdoAnnotationComponent
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
      availability:
        range: DdoAnnotationAvailability
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
  DdoSourceAnnotationPlacement:
    is_a: SourceRecordProduct
    attributes:
      annotation:
        range: DdoAnnotationBlockLayout
        required: true
        inlined: true
      piece_offset:
        range: integer
        required: true
        minimum_value: 0
  DdoSourceAnnotationManifest:
    is_a: SourceRecordProduct
    mixins:
    - DdoCharacterizedProduct
    attributes:
      record_type: {required: true, equals_string: manifest}
      source:
        range: DdoNativeSourceCoordinate
        required: true
        inlined: true
      selectors:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
        minimum_cardinality: 1
        value_presence: PRESENT
        required: true
      coverage:
        range: DdoCharacterizationCoverage
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
      outcome:
        range: string
        required: true
        pattern: '^(complete|partial)$(?![\s\S])'
  DdoSourceAnnotationPacket:
    is_a: SourceRecordProduct
    attributes:
      member_id:
        range: string
        required: true
      kind_contract:
        range: string
        required: true
      context:
        range: DdoSentenceContext
        required: true
        inlined: true
      body:
        range: DdoSourceAnnotationManifest
        required: true
        inlined: true
  DdoSourceAnnotations:
    is_a: DdoCharacterizationEnvelope
    description: One authoritative detached spaCy annotation population. A compact
      manifest member supports document fan-in without hydrating full block annotations.
    annotations:
      cs:data_universe: source
    attributes:
      source:
        range: DdoNativeSourceCoordinate
        required: true
        inlined: true
      selectors:
        range: CharacterizationSourceSelector
        inlined: true
        multivalued: true
        minimum_cardinality: 1
        value_presence: PRESENT
        required: true
      execution_profile:
        range: string
        required: true
      outcome:
        range: string
        required: true
        pattern: '^(complete|partial)$(?![\s\S])'
      block_coverage:
        range: DdoSentenceCoverage
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
      coverage:
        range: DdoCharacterizationCoverage
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
      block_layouts:
        range: DdoSourceAnnotationPlacement
        inlined: true
        multivalued: true
        minimum_cardinality: 0
      rows:
        range: DdoAnnotationPartitionRow
        inlined: true
        multivalued: true
        annotations:
          'cs:collection': '{"unit":"partitioned","partition_key":"block_id","item_order":["record_type","ordinal"],"address":["record_type","ordinal"],"field_groups":{"geometry":["record_type","ordinal","start","end","extent","sentence","space","role","piece_indices"],"lexical":["lemma","pos","tag","dependency","morphology","head","lower","is_alpha","is_space","is_punct","is_quote","like_num","sent_start"]}}'
      members:
        range: DdoSourceAnnotationPacket
        inlined: true
        multivalued: true
        minimum_cardinality: 0
        value_presence: PRESENT
      configuration:
        range: DdoSentenceConfiguration
        inlined: true
        required: true
  DdoSentenceConfiguration:
    is_a: SourceRecordProduct
    attributes:
      variant:
        required: true
      spacy_version:
        required: true
      model:
        required: true
      model_version:
        required: true
      exclude:
        multivalued: true
        value_presence: PRESENT
        minimum_cardinality: 0
      batch_size:
        range: integer
        required: true
        minimum_value: 1
  DdoCanonicalManifest:
    is_a: SourceRecordProduct
    mixins:
    - DdoCharacterizedProduct
