id: https://corpus-structure.dev/semantic/data-operation-sentences
name: data_operation_sentences
prefixes:
  dss: https://corpus-structure.dev/semantic/data-operation-sentences/
default_prefix: dss
default_range: string
classes:
  DdoNativeUnit:
    is_a: SourceRecordProduct
    abstract: true
    attributes:
      record_type: {required: true}
  DdoNativeToken:
    annotations:
      cs:data_universe: source
    is_a: DdoNativeUnit
    description: Existing atom-preserving spaCy token with absolute original projection offsets.
    attributes:
      record_type: {equals_string: token, required: true}
      local_id: {required: true, pattern: '^[0-9a-f]{64}$'}
      block_id: {required: true}
      ordinal: {range: integer, required: true, minimum_value: 0}
      start: {range: integer, required: true, minimum_value: 0}
      end: {range: integer, required: true, minimum_value: 1}
      space: {range: boolean, required: true}
      role: {required: true, pattern: '^(prose|math|reference)$'}
      sentence_ref: {}
      lemma: {value_presence: PRESENT}
      pos: {value_presence: PRESENT}
      tag: {value_presence: PRESENT}
      morphology: {multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
      dependency: {value_presence: PRESENT}
      sent_start: {range: boolean}
      head_ref: {}
      piece_indices: {range: integer, multivalued: true, required: true, minimum_cardinality: 1}
  DdoNativeSentence:
    annotations:
      cs:data_universe: source
    is_a: DdoNativeUnit
    attributes:
      record_type: {equals_string: sentence, required: true}
      local_id: {required: true, pattern: '^[0-9a-f]{64}$'}
      block_id: {required: true}
      ordinal: {range: integer, required: true, minimum_value: 0}
      start: {range: integer, required: true, minimum_value: 0}
      end: {range: integer, required: true, minimum_value: 1}
      token_ids: {multivalued: true, required: true, minimum_cardinality: 1}
  DdoSentenceCoverage:
    is_a: SourceRecordProduct
    attributes:
      block_id: {required: true}
      start: {range: integer, required: true, minimum_value: 0}
      end: {range: integer, required: true, minimum_value: 0}
      outcome: {required: true, pattern: '^(complete|empty|unsupported)$'}
      reason: {}
  DdoNativeAnnotationAvailability:
    is_a: SourceRecordProduct
    attributes:
      LEMMA: {required: true, pattern: '^(complete|partial|absent|not_applicable)$'}
      POS: {required: true, pattern: '^(complete|partial|absent|not_applicable)$'}
      TAG: {required: true, pattern: '^(complete|partial|absent|not_applicable)$'}
      MORPH: {required: true, pattern: '^(complete|partial|absent|not_applicable)$'}
      DEP: {required: true, pattern: '^(complete|partial|absent|not_applicable)$'}
      SENT_START: {required: true, pattern: '^(complete|partial|absent|not_applicable)$'}
  DdoNativeBlockAnnotations:
    is_a: SourceRecordProduct
    attributes:
      block_id: {required: true}
      start: {range: integer, required: true, minimum_value: 0}
      end: {range: integer, required: true, minimum_value: 1}
      attributes: {range: DdoNativeAnnotationAvailability, inlined: true, required: true}
  DdoSentenceScope:
    is_a: SourceRecordProduct
    attributes:
      source: {range: DdoNativeSourceCoordinate, inlined: true, required: true}
      selectors: {range: CharacterizationSourceSelector, inlined: true, multivalued: true, required: true}
  DdoSentenceContext:
    is_a: SourceRecordProduct
    attributes:
      subject: {required: true}
      original_source: {required: true}
      analyzed_scope: {range: DdoSentenceScope, inlined: true, required: true}
  DdoSentencePacket:
    is_a: SourceRecordProduct
    attributes:
      member_id: {required: true}
      kind_contract: {required: true}
      context: {range: DdoSentenceContext, inlined: true, required: true}
      body: {range: DdoNativeUnit, inlined: true, required: true}
  DdoSentenceInventory:
    annotations:
      cs:data_universe: source
    is_a: SourceRecordProduct
    description: Typed original token and sentence members; execution placement and model custody remain derivation evidence.
    attributes:
      source: {range: DdoNativeSourceCoordinate, inlined: true, required: true}
      selectors: {range: CharacterizationSourceSelector, inlined: true, multivalued: true, required: true}
      outcome: {required: true, pattern: '^(complete|partial)$'}
      coverage: {range: DdoSentenceCoverage, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
      annotation_columns: {range: DdoNativeBlockAnnotations, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
      members: {range: DdoSentencePacket, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}

  DdoCanonicalToken:
    is_a: SourceRecordProduct
    attributes:
      local_id: {required: true}
      ordinal: {range: integer, required: true, minimum_value: 0}
      start: {range: integer, required: true, minimum_value: 0}
      end: {range: integer, required: true, minimum_value: 1}
      space: {range: boolean, required: true}
      role: {required: true, pattern: '^(prose|math|reference)$'}
      piece_indices: {range: integer, multivalued: true, required: true, minimum_cardinality: 1}
  DdoCanonicalSentence:
    is_a: SourceRecordProduct
    attributes:
      local_id: {required: true}
      block_id: {required: true}
      ordinal: {range: integer, required: true, minimum_value: 0}
      start: {range: integer, required: true, minimum_value: 0}
      end: {range: integer, required: true, minimum_value: 1}
      tokens: {range: DdoCanonicalToken, inlined: true, multivalued: true, required: true}
  DdoCanonicalSentences:
    annotations:
      cs:data_universe: source
    is_a: SourceRecordProduct
    description: Declared cheap canonical sentence/tokenization value; native linguistic labels do not salt its identity.
    attributes:
      source: {range: DdoNativeSourceCoordinate, inlined: true, required: true}
      selectors: {range: CharacterizationSourceSelector, inlined: true, multivalued: true, required: true}
      outcome: {required: true, pattern: '^(complete|partial)$'}
      coverage: {range: DdoSentenceCoverage, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
      sentences: {range: DdoCanonicalSentence, inlined: true, multivalued: true, value_presence: PRESENT, minimum_cardinality: 0}
