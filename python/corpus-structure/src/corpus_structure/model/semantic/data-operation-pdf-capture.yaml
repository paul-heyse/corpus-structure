id: https://corpus-structure.dev/semantic/data-operation-pdf-capture
name: data_operation_pdf_capture
prefixes:
  dpc: https://corpus-structure.dev/semantic/data-operation-pdf-capture/
default_prefix: dpc
default_range: string
enums:
  DdoPdfObservationOutcome:
    permissible_values:
      succeeded: {}
      partial: {}
      failed: {}
      unknown: {}
      unsupported: {}
classes:
  DdoPdfObservedRequest:
    is_a: SourceRecordProduct
    description: Attributed retained request meaning. Physical publication attempt and raw artifacts remain in the separately authenticated execution evidence.
    attributes:
      ordinal: {range: integer, minimum_value: 0, required: true}
      meaning_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      pass_role: {required: true, pattern: '^[ABC]$'}
      outcome: {range: DdoPdfObservationOutcome, required: true}
  DdoPdfObservedPage:
    is_a: SourceRecordProduct
    attributes:
      page_no: {range: integer, minimum_value: 1, required: true}
      recipe_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      outcome: {range: DdoPdfObservationOutcome, required: true}
      observations: {range: DdoPdfObservedRequest, required: true, minimum_cardinality: 1, multivalued: true, inlined: true, inlined_as_list: true}
  DdoPdfObservationSet:
    is_a: SourceRecordProduct
    annotations: {cs:data_universe: source}
    description: Ordered retained page/request observations, including failures and unknown source coverage. Retention does not establish recognized completeness or accepted source truth.
    attributes:
      document: {required: true}
      source_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      recipe_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      pages: {range: DdoPdfObservedPage, required: true, minimum_cardinality: 1, multivalued: true, inlined: true, inlined_as_list: true}
  DdoPdfCaptureHealth:
    is_a: SourceRecordProduct
    attributes:
      conversion: {required: true}
      display_coverage: {required: true}
      inline_coverage: {required: true}
      cell_coverage: {required: true}
  DdoPdfPublication:
    is_a: SourceRecordProduct
    annotations: {cs:data_universe: source}
    description: The exact whole sealed publication projection authenticated by the PDF owner. Physical build/attempt attribution is in its original PDF execution receipt.
    attributes:
      document: {required: true}
      source_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      logical_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      schema_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      recipe_digest: {required: true, pattern: '^[0-9a-f]{64}$'}
      kind: {required: true}
      health: {range: DdoPdfCaptureHealth, inlined: true, required: true}

  DdoPdfCapture:
    is_a: DdoPdfPublication
    attributes:
      kind: {equals_string: native, required: true}
  DdoPdfEnrichedPublication:
    is_a: DdoPdfPublication
    attributes:
      kind: {equals_string: native, required: true}
  DdoPdfIntegratedPublication:
    is_a: DdoPdfPublication
    attributes:
      kind: {equals_string: integrated, required: true}
  DdoPdfOrganizedPublication:
    is_a: DdoPdfPublication
    attributes:
      kind: {equals_string: native, required: true}
