id: https://corpus-structure.dev/semantic/analytics
name: semantic_analytics
prefixes:
  ca: https://corpus-structure.dev/semantic/analytics/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: ca
default_range: string
types:
  analytical_integer: {base: int, uri: xsd:integer}
classes:
  AnalyticalProfile:
    description: Release-bound bounded numeric projection; source lexical values and identities remain exact.
    attributes:
      version: {required: true, equals_string: analytical-1}
      precision: {range: analytical_integer, required: true, minimum_value: 38, maximum_value: 38}
      scale: {range: analytical_integer, required: true, minimum_value: 0, maximum_value: 38}
      rounding: {required: true, equals_string: HALF_EVEN}
      overflow: {required: true, equals_string: refuse}
