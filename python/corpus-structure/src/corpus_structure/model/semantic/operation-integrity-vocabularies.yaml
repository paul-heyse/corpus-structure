      corpus_sem_writer:
        annotations:
          cs:login: true
          cs:memberships: {tag: 'cs:memberships', value: []}
          cs:publisher: false
      corpus_sem_reader:
        annotations:
          cs:login: true
          cs:memberships: {tag: 'cs:memberships', value: []}
          cs:publisher: false
      corpus_sem_admitter:
        annotations:
          cs:login: true
          cs:memberships: {tag: 'cs:memberships', value: []}
          cs:publisher: false
      corpus_sem_evaluator:
        annotations:
          cs:login: true
          cs:memberships: {tag: 'cs:memberships', value: []}
          cs:publisher: false
      corpus_sem_fitter:
        annotations:
          cs:login: true
          cs:memberships: {tag: 'cs:memberships', value: []}
