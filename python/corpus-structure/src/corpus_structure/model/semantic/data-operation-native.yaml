  publish_data_derivation_result:
    type: object
    properties:
      receipt_id:
        $ref: '#/definitions/identifier'
      derivation_id:
        $ref: '#/definitions/identifier'
      replayed:
        type: boolean
      trust_snapshot:
        $ref: '#/definitions/trust_snapshot'
    required:
    - receipt_id
    - derivation_id
    - replayed
    - trust_snapshot
    additionalProperties: false
  inspect_data_completion_request:
    type: object
    properties:
      intent_id:
        $ref: '#/definitions/identifier'
      demand_id:
        $ref: '#/definitions/identifier'
      request_id:
        $ref: '#/definitions/identifier'
      generation:
        $ref: '#/definitions/positive_integer'
    required:
    - intent_id
    additionalProperties: false
    anyOf:
    - required:
      - demand_id
    - required:
      - request_id
      - generation
    dependencies:
      request_id:
      - generation
      generation:
      - request_id
  inspect_data_completion_result:
    oneOf:
    - type: object
      properties:
        state:
          const: known-uncommitted
        intent_retained:
          const: false
      required:
      - state
      - intent_retained
      additionalProperties: false
    - type: object
      properties:
        state:
          const: known-uncommitted
        intent_retained:
          const: true
        producer_task_id:
          $ref: '#/definitions/task_id'
        producer_attempt:
          $ref: '#/definitions/positive_integer'
      required:
      - state
      - intent_retained
      - producer_task_id
      - producer_attempt
      additionalProperties: false
    - type: object
      properties:
        state:
          const: committed
        intent_retained:
          const: true
        receipt_id:
          $ref: '#/definitions/identifier'
        derivation_id:
          $ref: '#/definitions/identifier'
        producer_task_id:
          $ref: '#/definitions/task_id'
        producer_attempt:
          $ref: '#/definitions/positive_integer'
        runtime_id:
          $ref: '#/definitions/identifier'
        trust_snapshot:
          $ref: '#/definitions/trust_snapshot'
        semantic_outcome:
          $ref: '#/definitions/identifier'
        completion_state:
          type: string
          enum:
          - success
          - empty
          - failed
      required:
      - state
      - intent_retained
      - receipt_id
      - derivation_id
      - producer_task_id
      - producer_attempt
      - runtime_id
      - trust_snapshot
      - semantic_outcome
      - completion_state
      additionalProperties: false
    - type: object
      properties:
        state:
          const: unavailable
        intent_retained:
          const: false
        reason:
          const: intent-request-binding-unavailable
      required:
      - state
      - intent_retained
      - reason
      additionalProperties: false
