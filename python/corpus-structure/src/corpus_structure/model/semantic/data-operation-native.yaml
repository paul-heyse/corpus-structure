    additionalProperties: false
  claim_data_request_result:
    oneOf:
    - type: object
      properties:
        state:
          const: no-work
      required:
      - state
      additionalProperties: false
    - type: object
      properties:
        state:
          const: claimed
        request_id:
          $ref: '#/definitions/identifier'
        generation:
          $ref: '#/definitions/positive_integer'
        task_id:
          $ref: '#/definitions/task_id'
        attempt:
          $ref: '#/definitions/positive_integer'
        holder:
          $ref: '#/definitions/identifier'
        lease_until:
          type: string
          minLength: 1
        trust_snapshot:
          $ref: '#/definitions/trust_snapshot'
