      producer_task_id:
        $ref: '#/definitions/task_id'
      producer_attempt:
        $ref: '#/definitions/positive_integer'
    required:
    - intent_id
    - producer_task_id
    - producer_attempt
    additionalProperties: false
  publish_data_derivation_request:
    type: object
    properties:
      request_id:
        $ref: '#/definitions/identifier'
      generation:
        $ref: '#/definitions/positive_integer'
      task_id:
        $ref: '#/definitions/task_id'
      attempt:
        $ref: '#/definitions/positive_integer'
      holder:
        $ref: '#/definitions/identifier'
      intent_id:
        $ref: '#/definitions/identifier'
      trust_snapshot:
        $ref: '#/definitions/trust_snapshot'
    required:
    - request_id
    - generation
