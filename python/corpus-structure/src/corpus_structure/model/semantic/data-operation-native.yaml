    allOf:
    - if:
        properties:
          view:
            const: frontier
      then:
        properties:
          uses:
            items:
              properties:
                products:
                  items:
                    properties:
                      body_state:
                        const: not_requested
    - if:
        properties:
          view:
            const: products
      then:
        properties:
