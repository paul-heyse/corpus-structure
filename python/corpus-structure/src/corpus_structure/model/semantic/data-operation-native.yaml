    additionalProperties: false
  record_data_fate_result:
    type: object
    properties:
      use_id:
        $ref: '#/definitions/identifier'
      fate:
        $ref: '#/definitions/fate'
    required:
    - use_id
    - fate
    additionalProperties: false
  close_data_population_request:
    type: object
    properties:
      demand_id:
        $ref: '#/definitions/identifier'
      name:
        $ref: '#/definitions/identifier'
      product_id:
        $ref: '#/definitions/identifier'
      derivation_id:
        $ref: '#/definitions/identifier'
      member_role:
        $ref: '#/definitions/identifier'
    required:
    - demand_id
    - name
    - product_id
    - derivation_id
    - member_role
    additionalProperties: false
  close_data_population_result:
    type: object
    properties:
      population_id:
        $ref: '#/definitions/identifier'
      name:
        $ref: '#/definitions/identifier'
      complete:
