    additionalProperties: false
  record_data_fate_request:
    type: object
    properties:
      obligation_id:
        $ref: '#/definitions/identifier'
      fate:
        $ref: '#/definitions/fate'
      selection:
        $ref: '#/definitions/reason_selection'
