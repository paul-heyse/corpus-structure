  expand_data_obligation_request:
    type: object
    properties:
      demand_id:
        $ref: '#/definitions/identifier'
      operation_id:
        $ref: '#/definitions/identifier'
      subject:
        $ref: '#/definitions/identifier'
      original_source:
        $ref: '#/definitions/identifier'
      analyzed_scope:
        $ref: '#/definitions/json_value'
      parameters:
        $ref: '#/definitions/parameter_map'
      population_id:
        $ref: '#/definitions/identifier'
    required:
    - demand_id
