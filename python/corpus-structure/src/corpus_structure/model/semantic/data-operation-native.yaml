# Authoritative closed native wire contracts. Python, SQL and effective kinds derive from these schemas.
version: data-operation-native-v1
wire_schema_version: draft7-closed-v1
definitions:
  data_task_state:
    type: string
    enum: [pending, running, done, empty, failed, cancelled]
    x-ddo-lifecycle:
      initial: pending
      running: running
      terminal: [done, empty, failed, cancelled]
      receipt_required: [done, empty, failed]
      new_attempt: [[pending, running], [running, running]]
      same_attempt: [[running, pending], [running, done], [running, empty], [running, failed], [running, cancelled]]
  identifier:
    type: string
    minLength: 1
  text:
    type: string
  nonnegative_integer:
    type: integer
    minimum: 0
    maximum: 2147483647
  positive_integer:
    type: integer
    minimum: 1
    maximum: 2147483647
  task_id:
    type: integer
    minimum: 1
    maximum: 9223372036854775807
  json_value:
    type:
    - object
    - array
    - string
    - number
    - boolean
    - 'null'
  parameter_map:
    type: object
    additionalProperties:
      $ref: '#/definitions/json_value'
  trust_snapshot:
    type: object
    propertyNames:
      minLength: 1
    additionalProperties:
      $ref: '#/definitions/nonnegative_integer'
  tagged_mapping:
    type: array
    items:
    - const: mapping
    - type: array
      items:
        type: array
        items:
        - type: string
        - $ref: '#/definitions/semantic_value'
        minItems: 2
        maxItems: 2
        additionalItems: false
      minItems: 0
    minItems: 2
    maxItems: 2
    additionalItems: false
  # Disjoint leading tags select one recursive branch; never traverse rejected payload branches.
  semantic_value:
    if:
      type: array
      minItems: 1
      items:
      - enum:
        - 'null'
        - known-absent
        - unknown
        - unavailable
    then:
      type: array
      items:
      - enum:
        - 'null'
        - known-absent
        - unknown
        - unavailable
      minItems: 1
      maxItems: 1
      additionalItems: false
    else:
      if:
        type: array
        minItems: 1
        items:
        - const: boolean
      then:
        type: array
        items:
        - const: boolean
        - type: boolean
        minItems: 2
        maxItems: 2
        additionalItems: false
      else:
        if:
          type: array
          minItems: 1
          items:
          - enum:
            - string
            - date
            - datetime
            - float
        then:
          type: array
          items:
          - enum:
            - string
            - date
            - datetime
            - float
          - type: string
          minItems: 2
          maxItems: 2
          additionalItems: false
        else:
          if:
            type: array
            minItems: 1
            items:
            - const: integer
          then:
            type: array
            items:
            - const: integer
            - type: string
              pattern: '^[+-]?[0-9]+$(?![\s\S])'
            minItems: 2
            maxItems: 2
            additionalItems: false
          else:
            if:
              type: array
              minItems: 1
              items:
              - const: decimal
            then:
              type: array
              items:
              - const: decimal
              - type: string
                pattern: '^[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?$(?![\s\S])'
              minItems: 2
              maxItems: 2
              additionalItems: false
            else:
              if:
                type: array
                minItems: 1
                items:
                - const: present
              then:
                type: array
                items:
                - const: present
                - $ref: '#/definitions/semantic_value'
                minItems: 2
                maxItems: 2
                additionalItems: false
              else:
                if:
                  type: array
                  minItems: 1
                  items:
                  - enum:
                    - sequence
                    - ordered-bag
                    - bag
                    - set
                then:
                  type: array
                  items:
                  - enum:
                    - sequence
                    - ordered-bag
                    - bag
                    - set
                  - type: array
                    items:
                      $ref: '#/definitions/semantic_value'
                    minItems: 0
                  minItems: 2
                  maxItems: 2
                  additionalItems: false
                else:
                  if:
                    type: array
                    minItems: 1
                    items:
                    - const: mapping
                  then:
                    $ref: '#/definitions/tagged_mapping'
                  else: false
  request_meaning:
    oneOf:
    - $ref: '#/definitions/semantic_value'
    - type: array
      items:
      - const: ddo
      - const: semantic-request
      - const: '1'
      - $ref: '#/definitions/semantic_value'
      minItems: 4
      maxItems: 4
      additionalItems: false
  original_source_selection:
    oneOf:
    - {$ref: '#/definitions/original_document_selection'}
    - {$ref: '#/definitions/authored_fact_selection'}
  authored_fact_selector:
    type: object
    properties:
      scope: {const: authored-fact}
    required: [scope]
    additionalProperties: false
  authored_fact_selection:
    type: object
    properties:
      reference: {$ref: '#/definitions/AuthoredFactRef'}
      selectors: {type: array, minItems: 1, maxItems: 1, items: {$ref: '#/definitions/authored_fact_selector'}}
    required: [reference, selectors]
    additionalProperties: false
  original_document_selector:
    type: object
    properties:
      scope: {const: whole-document}
    required: [scope]
    additionalProperties: false
  original_document_selection:
    type: object
    properties:
      reference: {$ref: '#/definitions/OriginalDocumentRef'}
      selectors: {type: array, minItems: 1, maxItems: 1, items: {$ref: '#/definitions/original_document_selector'}}
    required: [reference, selectors]
    additionalProperties: false
  semantic_source_reference:
    type: object
    properties:
      product_id: {$ref: '#/definitions/identifier'}
      member_id: {$ref: '#/definitions/identifier'}
    required: [product_id]
    additionalProperties: false
  producer_output_occurrence:
    type: object
    properties:
      member_id: {anyOf: [{$ref: '#/definitions/identifier'}, {type: 'null'}]}
      role: {$ref: '#/definitions/identifier'}
      position: {type: integer, minimum: 0}
      multiplicity: {type: integer, minimum: 1}
    required: [member_id, role, position, multiplicity]
    additionalProperties: false
  selected_source_support:
    type: object
    properties:
      kind: {const: computation}
      derivation_id: {$ref: '#/definitions/identifier'}
      admission_use_id: {$ref: '#/definitions/identifier'}
    required: [kind, derivation_id, admission_use_id]
    additionalProperties: false
  selected_source_proof:
    type: object
    properties:
      anchor_use_id: {$ref: '#/definitions/identifier'}
      product_id: {$ref: '#/definitions/identifier'}
      member_id: {anyOf: [{$ref: '#/definitions/identifier'}, {type: 'null'}]}
      support: {$ref: '#/definitions/selected_source_support'}
      output: {$ref: '#/definitions/producer_output_occurrence'}
    required: [anchor_use_id, product_id, member_id, support, output]
    additionalProperties: false
  selected_source_read:
    type: object
    properties:
      project_id: {$ref: '#/definitions/identifier'}
      demand_id: {$ref: '#/definitions/identifier'}
      read_id: {$ref: '#/definitions/identifier'}
      release_id: {$ref: '#/definitions/identifier'}
      runtime_id: {$ref: '#/definitions/identifier'}
      cut_id: {$ref: '#/definitions/identifier'}
      cut_canonical_json: {$ref: '#/definitions/identifier'}
    required: [project_id, demand_id, read_id, release_id, runtime_id, cut_id, cut_canonical_json]
    additionalProperties: false
  source_read_basis:
    type: object
    properties:
      selection: {$ref: '#/definitions/selected_source_read'}
      proofs:
        type: array
        items: {$ref: '#/definitions/selected_source_proof'}
        minItems: 1
        uniqueItems: true
    required: [selection, proofs]
    additionalProperties: false
  source_set_acquisition:
    oneOf:
    - type: object
      properties:
        kind: {const: selected-support-v1}
        reads:
          type: array
          items: {$ref: '#/definitions/source_read_basis'}
          uniqueItems: true
      required: [kind, reads]
      additionalProperties: false
    - type: object
      properties:
        kind: {const: all-admissible-support-v1}
      required: [kind]
      additionalProperties: false
  frozen_source_set:
    type: object
    properties:
      entries:
        type: array
        items: {$ref: '#/definitions/source_set_entry'}
        uniqueItems: true
      acquisition: {$ref: '#/definitions/source_set_acquisition'}
    required: [entries, acquisition]
    additionalProperties: false
  source_set_entry:
    type: object
    properties:
      project_id: {$ref: '#/definitions/identifier'}
      original_source: {anyOf: [{$ref: '#/definitions/identifier'}, {type: 'null'}]}
      subject: {$ref: '#/definitions/identifier'}
      subject_definition: {$ref: '#/definitions/identifier'}
      analyzed_scope: {$ref: '#/definitions/json_value'}
      product: {$ref: '#/definitions/identifier'}
      member:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      source_reference: {$ref: '#/definitions/identifier'}
      reference: {$ref: '#/definitions/semantic_source_reference'}
    required: [project_id, original_source, subject, subject_definition, analyzed_scope, product, member, source_reference, reference]
    additionalProperties: false
  root_subject:
    type: object
    properties:
      subject:
        $ref: '#/definitions/identifier'
      original_source: {anyOf: [{$ref: '#/definitions/identifier'}, {type: 'null'}]}
      analyzed_scope:
        $ref: '#/definitions/json_value'
    required:
    - subject
    - original_source
    - analyzed_scope
    additionalProperties: false
  selected_operation:
    type: object
    properties:
      operation:
        $ref: '#/definitions/identifier'
      parameters:
        $ref: '#/definitions/parameter_map'
      choices:
        $ref: '#/definitions/parameter_map'
      replicate:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      dependencies:
        type: array
        items:
          $ref: '#/definitions/identifier'
        minItems: 0
      definition:
        $ref: '#/definitions/identifier'
      recipe:
        $ref: '#/definitions/identifier'
      eligibility:
        $ref: '#/definitions/identifier'
      parameter_meaning:
        $ref: '#/definitions/tagged_mapping'
    required:
    - operation
    - parameters
    - choices
    - replicate
    - dependencies
    - definition
    - recipe
    - eligibility
    - parameter_meaning
    additionalProperties: false
  discovery_selection:
    type: object
    properties:
      producer:
        $ref: '#/definitions/identifier'
      output_role:
        $ref: '#/definitions/identifier'
      target:
        $ref: '#/definitions/identifier'
      population:
        $ref: '#/definitions/identifier'
      target_role:
        $ref: '#/definitions/identifier'
    required:
    - producer
    - output_role
    - target
    - population
    additionalProperties: false
  demand_intent:
    type: object
    properties:
      version:
        const: data-demand-intent-v2
      model:
        type: string
        pattern: ^[0-9a-f]{64}$
        minLength: 64
        maxLength: 64
      roots:
        type: array
        items:
          $ref: '#/definitions/root_subject'
        minItems: 0
      targets:
        type: array
        items:
          $ref: '#/definitions/identifier'
        minItems: 1
      operations:
        type: array
        items:
          $ref: '#/definitions/selected_operation'
        minItems: 1
      root_operations:
        type: array
        items:
          $ref: '#/definitions/identifier'
        minItems: 1
      discovery:
        type: array
        items:
          $ref: '#/definitions/discovery_selection'
        minItems: 0
      inference:
        $ref: '#/definitions/identifier'
      execution_profile:
        $ref: '#/definitions/identifier'
      original_sources:
        type: object
        additionalProperties:
          $ref: '#/definitions/original_source_selection'
      source_sets:
        type: object
        additionalProperties: {$ref: '#/definitions/frozen_source_set'}
    required:
    - version
    - model
    - roots
    - targets
    - operations
    - root_operations
    - discovery
    - inference
    - execution_profile
    additionalProperties: false
  public_demand_selection:
    description: Native disclosure of an exact demand intent without private authored values or source proofs.
    type: object
    properties:
      version: {const: data-demand-public-selection-v1}
      model: {type: string, pattern: '^[0-9a-f]{64}$', minLength: 64, maxLength: 64}
      intent_digest: {$ref: '#/definitions/identifier'}
      roots: {type: array, items: {$ref: '#/definitions/root_subject'}}
      targets: {type: array, minItems: 1, items: {$ref: '#/definitions/identifier'}}
      root_operations: {type: array, minItems: 1, items: {$ref: '#/definitions/identifier'}}
      discovery: {type: array, items: {$ref: '#/definitions/discovery_selection'}}
    required: [version, model, intent_digest, roots, targets, root_operations, discovery]
    additionalProperties: false
  read_demand_selection:
    oneOf:
    - {$ref: '#/definitions/demand_intent'}
    - {$ref: '#/definitions/public_demand_selection'}
  authority_selection:
    description: The native authority leaf owns issuer custody and withholds its protected binding.
    type: object
    properties:
      kind: {const: native-authority}
      protected_dependencies: {const: undisclosed}
    required: [kind, protected_dependencies]
    additionalProperties: false
  binding_reason:
    type: object
    properties:
      code:
        $ref: '#/definitions/identifier'
      location:
        $ref: '#/definitions/text'
      detail:
        $ref: '#/definitions/text'
    required:
    - code
    - location
    - detail
    additionalProperties: false
  reason_selection:
    type: object
    properties:
      inputs_watermark: {type: string, minLength: 1}
      reasons:
        type: array
        items:
          $ref: '#/definitions/binding_reason'
        minItems: 0
    required: []
    additionalProperties: false
  input_member:
    type: object
    properties:
      role:
        $ref: '#/definitions/identifier'
      position:
        $ref: '#/definitions/nonnegative_integer'
      multiplicity:
        $ref: '#/definitions/positive_integer'
      product_id:
        $ref: '#/definitions/identifier'
      member_id:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      producer_output:
        anyOf:
        - $ref: '#/definitions/producer_output_occurrence'
        - type: 'null'
      support_derivation_ids:
        type: array
        items:
          $ref: '#/definitions/identifier'
        uniqueItems: true
        minItems: 0
    required:
    - role
    - position
    - multiplicity
    - product_id
    - support_derivation_ids
    - producer_output
    additionalProperties: false
  support_member:
    oneOf:
    - $ref: '#/definitions/computational_support_member'
    - $ref: '#/definitions/original_source_support_member'
    - $ref: '#/definitions/authored_fact_support_member'
  authored_fact_support_member:
    type: object
    properties:
      kind: {const: authored}
      admission_id: {$ref: '#/definitions/identifier'}
      source_reference: {$ref: '#/definitions/identifier'}
      role: {$ref: '#/definitions/identifier'}
      position: {$ref: '#/definitions/nonnegative_integer'}
    required: [kind, admission_id, source_reference, role, position]
    additionalProperties: false
  original_source_support_member:
    type: object
    properties:
      kind: {const: original-source}
      admission_id: {$ref: '#/definitions/identifier'}
      source_reference: {$ref: '#/definitions/identifier'}
      role: {$ref: '#/definitions/identifier'}
      position: {$ref: '#/definitions/nonnegative_integer'}
    required: [kind, admission_id, source_reference, role, position]
    additionalProperties: false
  computational_support_member:
    type: object
    properties:
      kind: {const: computation}
      derivation_id:
        $ref: '#/definitions/identifier'
      role:
        $ref: '#/definitions/identifier'
      position:
        $ref: '#/definitions/nonnegative_integer'
      admission_use_id:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
    required:
    - derivation_id
    - role
    - position
    additionalProperties: false
  binding:
    type: object
    properties:
      inputs:
        type: array
        items:
          $ref: '#/definitions/input_member'
        minItems: 0
      support:
        type: array
        items:
          $ref: '#/definitions/support_member'
        minItems: 0
      parameters:
        $ref: '#/definitions/tagged_mapping'
      request_inputs:
        $ref: '#/definitions/tagged_mapping'
      inference:
        $ref: '#/definitions/identifier'
      populations:
        type: array
        items:
          $ref: '#/definitions/population_reference'
      read_id:
        $ref: '#/definitions/read_id'
    required:
    - inputs
    - support
    - parameters
    - request_inputs
    - inference
    - populations
    - read_id
    additionalProperties: false
  coordinate:
    type: object
    properties:
      original_source:
        $ref: '#/definitions/identifier'
      start:
        $ref: '#/definitions/nonnegative_integer'
      end:
        $ref: '#/definitions/nonnegative_integer'
      page:
        anyOf:
        - $ref: '#/definitions/nonnegative_integer'
        - type: 'null'
    required:
    - original_source
    - start
    - end
    additionalProperties: false
  role_member:
    type: object
    properties:
      role:
        $ref: '#/definitions/identifier'
      position:
        $ref: '#/definitions/nonnegative_integer'
      multiplicity:
        $ref: '#/definitions/positive_integer'
    required:
    - role
    - position
    - multiplicity
    additionalProperties: false
  endpoint:
    oneOf:
    - type: object
      properties:
        scope:
          const: local
        role:
          $ref: '#/definitions/identifier'
        member_id:
          $ref: '#/definitions/identifier'
      required:
      - scope
      - role
      - member_id
      additionalProperties: false
    - type: object
      properties:
        scope:
          const: external
        role:
          $ref: '#/definitions/identifier'
        member_id:
          $ref: '#/definitions/identifier'
        product_id:
          $ref: '#/definitions/identifier'
      required:
      - scope
      - role
      - member_id
      - product_id
      additionalProperties: false
  coverage:
    type: object
    properties:
      scope:
        $ref: '#/definitions/identifier'
      start:
        $ref: '#/definitions/nonnegative_integer'
      end:
        $ref: '#/definitions/nonnegative_integer'
      complete:
        type: boolean
    required:
    - scope
    - start
    - end
    - complete
    additionalProperties: false
  choice:
    type: object
    properties:
      choice_group:
        $ref: '#/definitions/identifier'
      alternative:
        $ref: '#/definitions/identifier'
      selected:
        type: boolean
    required:
    - choice_group
    - alternative
    - selected
    additionalProperties: false
  product_member:
    type: object
    properties:
      member_id:
        $ref: '#/definitions/identifier'
      body:
        $ref: '#/definitions/semantic_value'
      coordinates:
        type: array
        items:
          $ref: '#/definitions/coordinate'
        minItems: 0
      roles:
        type: array
        items:
          $ref: '#/definitions/role_member'
        minItems: 0
      endpoints:
        type: array
        items:
          $ref: '#/definitions/endpoint'
        minItems: 0
      coverage:
        type: array
        items:
          $ref: '#/definitions/coverage'
        minItems: 0
      choices:
        type: array
        items:
          $ref: '#/definitions/choice'
        minItems: 0
      context:
        $ref: '#/definitions/member_context'
      kind_contract:
        $ref: '#/definitions/identifier'
    required:
    - member_id
    - body
    - context
    - kind_contract
    additionalProperties: false
  product_partition_placement:
    type: object
    properties:
      start: {$ref: '#/definitions/nonnegative_integer'}
      end: {$ref: '#/definitions/nonnegative_integer'}
    required: [start, end]
    additionalProperties: false
  product_partition:
    type: object
    properties:
      collection: {$ref: '#/definitions/identifier'}
      partition_key: {$ref: '#/definitions/identifier'}
      ordinal: {$ref: '#/definitions/nonnegative_integer'}
      placement: {$ref: '#/definitions/product_partition_placement'}
      partition_digest: {$ref: '#/definitions/identifier'}
      body: {$ref: '#/definitions/semantic_value'}
    required: [collection, partition_key, ordinal, placement, partition_digest, body]
    additionalProperties: false
  product:
    type: object
    properties:
      kind_contract:
        $ref: '#/definitions/identifier'
      body:
        $ref: '#/definitions/semantic_value'
      members:
        type: array
        items:
          $ref: '#/definitions/product_member'
        minItems: 0
      artifact_digest:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      partitions:
        type: array
        items: {$ref: '#/definitions/product_partition'}
    required:
    - kind_contract
    - body
    - members
    additionalProperties: false
  output_member:
    type: object
    properties:
      role:
        $ref: '#/definitions/identifier'
      position:
        $ref: '#/definitions/nonnegative_integer'
      multiplicity:
        $ref: '#/definitions/positive_integer'
      product:
        $ref: '#/definitions/product'
      member_id:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
    required:
    - role
    - position
    - multiplicity
    - product
    additionalProperties: false
  completion:
    type: object
    properties:
      outcome:
        $ref: '#/definitions/identifier'
      outputs:
        type: array
        items:
          $ref: '#/definitions/output_member'
        minItems: 0
      support:
        type: array
        items:
          $ref: '#/definitions/support_member'
        minItems: 0
      inputs:
        type: array
        items:
          $ref: '#/definitions/input_member'
        minItems: 0
      implementation_revision:
        $ref: '#/definitions/identifier'
      execution_evidence:
        $ref: '#/definitions/native_execution_evidence'
    required:
    - outcome
    - outputs
    - support
    - inputs
    - implementation_revision
    additionalProperties: false
  fate:
    type: string
    enum:
    - known-absent
    - unknown
    - unavailable
    - invalid
    - closed
    - awaiting-discovery
    - awaiting-inputs
    - awaiting-population
    - not-applicable
    - failed
    - cancelled
    - partial
  historical_fate:
    type: string
    enum:
    - known-absent
    - unknown
    - unavailable
    - invalid
    - closed
    - awaiting-discovery
    - awaiting-inputs
    - awaiting-population
    - not-applicable
    - failed
    - cancelled
    - partial
    - attached
    - fulfilled
  visible_fate:
    type: string
    enum:
    - known-absent
    - unknown
    - unavailable
    - invalid
    - closed
    - awaiting-discovery
    - awaiting-inputs
    - awaiting-external
    - awaiting-population
    - not-applicable
    - failed
    - cancelled
    - partial
    - attached
    - fulfilled
    - waiting
  population_member:
    type: object
    properties:
      member_id:
        $ref: '#/definitions/identifier'
      subject:
        $ref: '#/definitions/identifier'
      subject_definition:
        $ref: '#/definitions/identifier'
      original_source: {anyOf: [{$ref: '#/definitions/identifier'}, {type: 'null'}]}
      analyzed_scope:
        $ref: '#/definitions/json_value'
    required:
    - member_id
    - subject
    - subject_definition
    - original_source
    - analyzed_scope
    additionalProperties: false
  population_selection_evidence:
    type: object
    properties:
      parent_population_id:
        $ref: '#/definitions/identifier'
      read_id:
        $ref: '#/definitions/read_id'
      obligation_id:
        $ref: '#/definitions/identifier'
      operation_id:
        $ref: '#/definitions/identifier'
      subject:
        $ref: '#/definitions/identifier'
      subject_definition:
        $ref: '#/definitions/identifier'
      original_source: {anyOf: [{$ref: '#/definitions/identifier'}, {type: 'null'}]}
      analyzed_scope:
