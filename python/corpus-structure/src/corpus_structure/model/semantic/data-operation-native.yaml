    properties:
      revocation_id:
        $ref: '#/definitions/identifier'
      scope:
        $ref: '#/definitions/identifier'
      epoch:
        $ref: '#/definitions/nonnegative_integer'
    required:
    - revocation_id
    - scope
    - epoch
    additionalProperties: false
  read_demand_result_request:
    type: object
    properties:
      demand_id:
        $ref: '#/definitions/identifier'
      selection:
        $ref: '#/definitions/demand_intent'
      after:
        $ref: '#/definitions/identifier'
      limit:
        type: integer
        minimum: 1
        maximum: 1000
      trust_snapshot:
        $ref: '#/definitions/trust_snapshot'
      read_id:
        $ref: '#/definitions/read_id'
      read_snapshot:
        $ref: '#/definitions/read_snapshot'
      frontier_at:
        $ref: '#/definitions/frontier_at'
      view:
        type: string
        enum:
        - frontier
        - products
        default: frontier
    required:
    - demand_id
    additionalProperties: false
    dependencies:
      after:
      - selection
      - trust_snapshot
      - read_id
      read_snapshot:
      - read_id
      frontier_at:
      - read_id
  read_demand_result_result:
    type: object
    properties:
      demand_id:
        $ref: '#/definitions/identifier'
      selection:
        $ref: '#/definitions/demand_intent'
      intent:
        $ref: '#/definitions/demand_intent'
      root:
        type: array
        items:
          $ref: '#/definitions/root_subject'
        minItems: 0
      project_id:
        $ref: '#/definitions/identifier'
      release_id:
        $ref: '#/definitions/identifier'
      runtime_id:
        $ref: '#/definitions/identifier'
      trust_snapshot:
        $ref: '#/definitions/trust_snapshot'
      uses:
        type: array
        items:
          $ref: '#/definitions/result_use'
        minItems: 0
      obligations:
        type: array
        items:
          $ref: '#/definitions/result_obligation'
        minItems: 0
      populations:
        type: array
        items:
          $ref: '#/definitions/population'
        minItems: 0
      continuation:
        anyOf:
        - $ref: '#/definitions/continuation'
        - type: 'null'
      read_id:
        $ref: '#/definitions/read_id'
      read_snapshot:
        $ref: '#/definitions/read_snapshot'
      frontier_at:
        $ref: '#/definitions/frontier_at'
      view:
        type: string
        enum:
        - frontier
        - products
    required:
    - demand_id
    - selection
    - intent
    - root
    - project_id
    - release_id
    - runtime_id
    - trust_snapshot
    - uses
    - obligations
    - populations
    - continuation
    - read_id
    - read_snapshot
    - frontier_at
    - view
    additionalProperties: false
    allOf:
    - if:
        properties:
          view:
            const: frontier
      then:
        properties:
          uses:
            items:
              properties:
                products:
                  items:
                    properties:
                      body_state:
                        const: not_requested
    - if:
        properties:
          view:
            const: products
      then:
        properties:
          uses:
            items:
              properties:
                products:
                  items:
                    properties:
                      body_state:
                        const: present
  population_reference:
    type: object
    properties:
      role:
        $ref: '#/definitions/identifier'
      name:
        $ref: '#/definitions/identifier'
      population_id:
        $ref: '#/definitions/identifier'
    required:
    - role
    - name
    - population_id
    additionalProperties: false
  read_id:
    type: string
    minLength: 1
    description: Authenticated server-owned demand read receipt identity.
  read_snapshot:
    type: string
    minLength: 1
    description: Opaque PostgreSQL visibility snapshot pinned by the authenticated read receipt.
  frontier_at:
    type: string
    minLength: 1
    description: Server-selected cutoff timestamp pinned by the authenticated read receipt.
  member_context:
    $ref: '#/definitions/root_subject'
