  admit_external_data_result_result:
    type: object
    properties:
      receipt: {$ref: '#/definitions/ExternalExecutionReceipt'}
      intent_id: {$ref: '#/definitions/identifier'}
    required: [receipt, intent_id]
    additionalProperties: false
  release_external_data_packet_request:
    type: object
    properties:
      packet_id: {$ref: '#/definitions/identifier'}
      request_id: {$ref: '#/definitions/identifier'}
      generation: {$ref: '#/definitions/positive_integer'}
      task_id: {$ref: '#/definitions/task_id'}
      attempt: {$ref: '#/definitions/positive_integer'}
      holder: {$ref: '#/definitions/identifier'}
      reason: {$ref: '#/definitions/identifier'}
    required: [packet_id, request_id, generation, task_id, attempt, holder, reason]
    additionalProperties: false
  release_external_data_packet_result:
    type: object
    properties:
      packet_id: {$ref: '#/definitions/identifier'}
      state: {const: awaiting-external}
      released: {const: true}
    required: [packet_id, state, released]
    additionalProperties: false
  inspect_external_data_result_request:
    type: object
    properties:
      packet_id: {$ref: '#/definitions/identifier'}
    required: [packet_id]
    additionalProperties: false
  inspect_external_data_result_result:
    type: object
    properties:
      packet_id: {$ref: '#/definitions/identifier'}
      state: {enum: [awaiting-external, retained, committed, cancelled, superseded]}
      receipt:
        anyOf:
        - {$ref: '#/definitions/ExternalExecutionReceipt'}
        - {type: 'null'}
      intent_id:
        anyOf:
        - {$ref: '#/definitions/identifier'}
        - {type: 'null'}
      publication: {$ref: '#/definitions/json_value'}
    required: [packet_id, state, receipt, intent_id, publication]
    additionalProperties: false

  claim_external_data_packet_request:
    type: object
    additionalProperties: false
    required: [packet_id, project_id, holder, lease_seconds]
    properties:
      packet_id: {$ref: '#/definitions/identifier'}
      project_id: {$ref: '#/definitions/identifier'}
      demand_id: {$ref: '#/definitions/identifier'}
      holder: {$ref: '#/definitions/identifier'}
      lease_seconds: {type: integer, minimum: 1, maximum: 86400}

  read_selected_feature_fit_frame_request:
    type: object
    properties:
      variant: {type: string, enum: [record-feature-grade, operation-event-frame]}
      project_id: {$ref: '#/definitions/identifier'}
      demand_id: {$ref: '#/definitions/identifier'}
      read_id: {$ref: '#/definitions/read_id'}
      use_id: {$ref: '#/definitions/identifier'}
      product_id: {$ref: '#/definitions/identifier'}
      derivation_id: {$ref: '#/definitions/identifier'}
      expected_cut: {type: string, pattern: '^cut-selection:[0-9a-f]{64}$', minLength: 78, maxLength: 78}
      cut_canonical_json: {type: string, minLength: 1}
      frame_digest: {type: string, pattern: '^[0-9a-f]{64}$', minLength: 64, maxLength: 64}
      max_bytes: {type: integer, minimum: 1024, maximum: 67108864}
    required: [variant, project_id, demand_id, read_id, use_id, product_id, derivation_id, expected_cut, cut_canonical_json, frame_digest]
    additionalProperties: false
  read_selected_feature_fit_frame_result:
    type: object
    properties:
      variant: {type: string, enum: [record-feature-grade, operation-event-frame]}
      cut: {$ref: '#/definitions/cut_selection'}
      product_id: {$ref: '#/definitions/identifier'}
      derivation_id: {$ref: '#/definitions/identifier'}
      receipt_id: {$ref: '#/definitions/identifier'}
      frame:
        anyOf:
        - {$ref: '#/definitions/selected_record_grade'}
        - {$ref: '#/definitions/selected_operation_event_frame'}
    required: [variant, cut, product_id, derivation_id, receipt_id, frame]
    additionalProperties: false
  read_selected_pdf_source_request:
    type: object
    properties:
      project_id: {$ref: '#/definitions/identifier'}
      demand_id: {$ref: '#/definitions/identifier'}
      read_id: {$ref: '#/definitions/read_id'}
      use_id: {$ref: '#/definitions/identifier'}
      product_id: {$ref: '#/definitions/identifier'}
      derivation_id: {$ref: '#/definitions/identifier'}
    required: [project_id, demand_id, read_id, use_id, product_id, derivation_id]
    additionalProperties: false
  read_selected_pdf_source_result:
    type: object
    properties:
      cut: {$ref: '#/definitions/cut_selection'}
      receipt: {$ref: '#/definitions/PdfExecutionReceipt'}
      original_source: {$ref: '#/definitions/identifier'}
    required: [receipt, cut, original_source]
    additionalProperties: false
  read_selected_pdf_observations_result:
    type: object
    properties:
      cut: {$ref: '#/definitions/cut_selection'}
      receipt: {$ref: '#/definitions/PdfObservationExecutionReceipt'}
      original_source: {$ref: '#/definitions/identifier'}
    required: [receipt, cut, original_source]
    additionalProperties: false

  visual_evidence_pin:
    type: object
    properties:
      use_id: {$ref: '#/definitions/identifier'}
      product_id: {$ref: '#/definitions/identifier'}
      derivation_id: {$ref: '#/definitions/identifier'}
    required: [use_id, product_id, derivation_id]
    additionalProperties: false
  read_selected_visual_evidence_request:
    type: object
    properties:
      source: {$ref: '#/definitions/read_selected_pdf_source_request'}
      evidence: {$ref: '#/definitions/visual_evidence_pin'}
      mode: {type: string, enum: [header, rows, artifact]}
      after: {type: integer, minimum: 0}
      limit: {type: integer, minimum: 1, maximum: 1000}
      max_bytes: {type: integer, minimum: 1, maximum: 8388608}
      regions: {type: array, items: {$ref: '#/definitions/visual_read_VisualSourceRegion'}}
      kind: {type: string, enum: [picture, caption, caption_candidate, picture_description, picture_text, formula, mermaid, table, cell_group, cell_text]}
      occurrence_id: {$ref: '#/definitions/identifier'}
      cell_index: {type: integer, minimum: 0}
      query: {$ref: '#/definitions/identifier'}
      artifact_digest: {type: string, pattern: '^[0-9a-f]{64}$', minLength: 64, maxLength: 64}
    required: [source, evidence, mode, after, limit, max_bytes, regions]
    additionalProperties: false
    allOf:
    - if: {properties: {mode: {const: artifact}}}
      then: {required: [artifact_digest]}
    - if: {required: [cell_index]}
      then: {required: [occurrence_id]}
  read_selected_visual_evidence_result: {$ref: '#/definitions/selected_visual_read'}

  initialize_source_project_request:
    type: object
    properties:
      project_id:
        $ref: '#/definitions/identifier'
      release_id:
        $ref: '#/definitions/identifier'
    required:
    - project_id
    - release_id
    additionalProperties: false
  initialize_source_project_result:
    type: object
    properties:
      project_id:
        $ref: '#/definitions/identifier'
      release_id:
        $ref: '#/definitions/identifier'
    required:
    - project_id
    - release_id
    additionalProperties: false
  pdf_search_digest: {type: string, pattern: '^[0-9a-f]{64}$', minLength: 64, maxLength: 64}
  pdf_search_recipe:
    type: object
    properties:
      version: {const: pdf-source-search-v1}
      renderer: {$ref: '#/definitions/pdf_search_digest'}
      policy_digest: {$ref: '#/definitions/pdf_search_digest'}
      organization_owner:
        type: object
        properties:
          task_id: {$ref: '#/definitions/task_id'}
          product_key: {$ref: '#/definitions/identifier'}
          content_digest: {$ref: '#/definitions/pdf_search_digest'}
        required: [task_id, product_key, content_digest]
        additionalProperties: false
      analysis_eligible: {const: true}
    required: [version, renderer, policy_digest, organization_owner, analysis_eligible]
    additionalProperties: false
  pdf_search_piece:
    type: object
    properties:
      kind: {type: string, enum: [native_text, synthetic_separator]}
      start: {$ref: '#/definitions/nonnegative_integer'}
      end: {$ref: '#/definitions/nonnegative_integer'}
      item_ref: {type: string}
      source_field: {type: string}
      cell_index: {$ref: '#/definitions/nonnegative_integer'}
    required: [kind, start, end]
    additionalProperties: false
  pdf_search_outcome:
    type: object
    properties:
      pointer: {$ref: '#/definitions/identifier'}
      outcome: {$ref: '#/definitions/identifier'}
    required: [pointer, outcome]
    additionalProperties: false
  pdf_search_projection_row:
    type: object
    properties:
      section_pointer: {$ref: '#/definitions/identifier'}
      membership: {type: string, enum: [direct, descendants]}
      projection_digest: {$ref: '#/definitions/pdf_search_digest'}
      projection:
        type: object
        properties:
          text: {type: string}
          pieces: {type: array, items: {$ref: '#/definitions/pdf_search_piece'}}
          items: {type: array, items: {$ref: '#/definitions/identifier'}}
          ancestors: {type: array, items: {$ref: '#/definitions/identifier'}}
          health:
            type: object
            properties:
              formula_outcomes: {type: array, items: {$ref: '#/definitions/pdf_search_outcome'}}
            required: [formula_outcomes]
            additionalProperties: false
        required: [text, pieces, items, ancestors, health]
        additionalProperties: false
    required: [section_pointer, membership, projection_digest, projection]
    additionalProperties: false
  ensure_pdf_search_projection_request:
    type: object
    properties:
      source: {$ref: '#/definitions/read_selected_pdf_source_request'}
      recipe: {$ref: '#/definitions/pdf_search_recipe'}
      configuration: {x-corpus-source: pdf-search-configuration}
      fill_max_bytes: {type: integer, minimum: 1, maximum: 134217728}
      rows: {type: array, items: {$ref: '#/definitions/pdf_search_projection_row'}}
    required: [source, recipe, configuration, fill_max_bytes]
    additionalProperties: false
  ensure_pdf_search_projection_result:
    type: object
    properties:
      state: {type: string, enum: [missing, ready]}
      population_id: {$ref: '#/definitions/identifier'}
      set_digest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', minLength: 64, maxLength: 64}
      row_count: {$ref: '#/definitions/nonnegative_integer'}
    required: [state, population_id, set_digest, row_count]
    additionalProperties: false
  pdf_search_binding:
    type: object
    properties:
      version: {const: 5}
      project_id: {$ref: '#/definitions/identifier'}
      demand_id: {$ref: '#/definitions/identifier'}
      read_id: {$ref: '#/definitions/read_id'}
      sources: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/definitions/read_selected_pdf_source_request'}}
      sections: {type: array, uniqueItems: true, items: {type: string}}
      membership: {type: string, enum: [direct, descendants]}
      text: {type: string, minLength: 1, maxLength: 4096}
      max_rows: {type: integer, minimum: 1, maximum: 10000}
      max_bytes: {type: integer, minimum: 1, maximum: 8388608}
    required: [version, project_id, demand_id, read_id, sources, sections, membership, text, max_rows, max_bytes]
    additionalProperties: false
  pdf_search_pin:
    type: object
    properties:
      source: {$ref: '#/definitions/read_selected_pdf_source_request'}
      recipe: {$ref: '#/definitions/pdf_search_recipe'}
    required: [source, recipe]
    additionalProperties: false
  pdf_search_after:
    type: object
    properties:
      selection: {$ref: '#/definitions/pdf_search_digest'}
      score: {type: number, minimum: 0}
      key: {type: string}
    required: [selection, score, key]
    additionalProperties: false
  rank_pdf_search_projection_request:
    type: object
    properties:
      binding: {$ref: '#/definitions/pdf_search_binding'}
      cut_id: {$ref: '#/definitions/identifier'}
      sources: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/definitions/pdf_search_pin'}}
      limit: {type: integer, minimum: 1, maximum: 100}
      after: {$ref: '#/definitions/pdf_search_after'}
    required: [binding, cut_id, sources, limit]
    additionalProperties: false
  pdf_search_hit:
    type: object
    properties:
      source_index: {type: integer, minimum: 0, maximum: 99}
      section_pointer: {$ref: '#/definitions/identifier'}
      membership: {type: string, enum: [direct, descendants]}
      projection_digest: {$ref: '#/definitions/pdf_search_digest'}
      key: {type: string}
      excerpt: {type: string}
      score: {type: number, minimum: 0}
    required: [source_index, section_pointer, membership, projection_digest, key, excerpt, score]
    additionalProperties: false
  rank_pdf_search_projection_result:
    type: object
    properties:
      selection: {$ref: '#/definitions/pdf_search_digest'}
      more: {type: boolean}
      rows: {type: array, maxItems: 100, items: {$ref: '#/definitions/pdf_search_hit'}}
    required: [selection, more, rows]
    additionalProperties: false
