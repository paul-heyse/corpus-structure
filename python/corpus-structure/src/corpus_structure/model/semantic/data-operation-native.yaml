      - request_id
      - generation
      - task_id
      - attempt
      - holder
      - lease_until
      - trust_snapshot
      additionalProperties: false
  retain_data_completion_intent_request:
    type: object
    properties:
      request_id:
        $ref: '#/definitions/identifier'
      generation:
        $ref: '#/definitions/positive_integer'
      task_id:
        $ref: '#/definitions/task_id'
      attempt:
        $ref: '#/definitions/positive_integer'
      holder:
        $ref: '#/definitions/identifier'
      runtime_id:
        $ref: '#/definitions/identifier'
      completion:
        $ref: '#/definitions/completion'
    required:
    - request_id
    - generation
    - task_id
    - attempt
    - holder
    - runtime_id
    - completion
    additionalProperties: false
  retain_data_completion_intent_result:
    type: object
    properties:
      intent_id:
        $ref: '#/definitions/identifier'
      payload_digest:
        $ref: '#/definitions/identifier'
    required:
    - intent_id
    - payload_digest
    additionalProperties: false
  adopt_data_completion_intent_request:
    type: object
    properties:
      request_id:
        $ref: '#/definitions/identifier'
      generation:
        $ref: '#/definitions/positive_integer'
      task_id:
        $ref: '#/definitions/task_id'
      attempt:
        $ref: '#/definitions/positive_integer'
      holder:
        $ref: '#/definitions/identifier'
      intent_id:
        $ref: '#/definitions/identifier'
    required:
    - request_id
    - generation
    - task_id
    - attempt
    - holder
    - intent_id
    additionalProperties: false
  adopt_data_completion_intent_result:
    type: object
    properties:
      intent_id:
