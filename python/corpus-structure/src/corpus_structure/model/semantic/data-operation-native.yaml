      binding:
        $ref: '#/definitions/binding'
      replicate:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      rebind_derivation:
        $ref: '#/definitions/identifier'
      request_key:
        $ref: '#/definitions/identifier'
    required:
    - obligation_id
    - request_meaning
    - binding
    - replicate
    additionalProperties: false
  attach_data_request_result:
    type: object
    properties:
      request_id:
        $ref: '#/definitions/identifier'
      generation:
        $ref: '#/definitions/positive_integer'
      task_id:
        anyOf:
        - $ref: '#/definitions/task_id'
        - type: 'null'
      fate:
        type: string
        enum:
        - attached
        - fulfilled
      derivation_id:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      use_id:
        $ref: '#/definitions/identifier'
      trust_snapshot:
        $ref: '#/definitions/trust_snapshot'
