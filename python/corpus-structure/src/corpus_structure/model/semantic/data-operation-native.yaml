        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      generation:
        anyOf:
        - $ref: '#/definitions/positive_integer'
        - type: 'null'
      derivation_id:
        anyOf:
        - $ref: '#/definitions/identifier'
        - type: 'null'
      trust_snapshot:
        $ref: '#/definitions/trust_snapshot'
    required:
    - obligation_id
    - fate
