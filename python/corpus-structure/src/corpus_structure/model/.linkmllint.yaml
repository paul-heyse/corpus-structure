# linkml-lint configuration for the model's modules (core.yaml, system.yaml), as S4's for the packs
# (schema-rules note L-09). Lint each file on its own; tests/schema runs it.
extends: recommended
rules:
  # Descriptions are model input (D2 §1.3): a class, slot or enum without one fails.
  recommended:
    level: error
  no_undeclared_subsets:
    level: error
  no_undeclared_ranges:
    level: error
  no_invalid_slot_usage:
    level: error
  # D1 fixes the JSON field names t, v and x and the locator ordinal n; GoldenPass members are a, b,
  # c; GpuMode keeps the settings' co-resident spelling. The rule's naming warnings stay warnings.
  standard_naming:
    level: warning
  no_empty_title:
    level: disabled
  # ci:, core:, sys: are registered elsewhere; the IRIs are explicit (S4's ruling).
  canonical_prefixes:
    level: disabled
