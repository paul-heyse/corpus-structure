[project]
name = "corpus-structure"
version = "0.0.0"
description = "Builds a highly structured representation of a set of documents (D9 §1)."
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "cssselect2==0.10.1",
    "en-core-web-sm==3.8.0",
    "html5lib==1.1",
    "lark==1.3.1",
    "linkml-runtime==1.12.1",
    "lxml==6.1.3",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "regex==2026.9.29",
    "rich==15.0.0",
    "rule-engine==5.1.0",
    "spacy==3.8.18",
    "sqlalchemy==2.1.5",
    "sympy==1.14.0",
    "typer==0.27.3",
]

[project.scripts]
ci = "corpus_structure.cli.app:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "corpus_structure"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
