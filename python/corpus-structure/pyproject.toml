[project]
name = "corpus-structure"
version = "0.0.0"
description = "Builds a highly structured representation of a set of documents (D9 §1)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "adbc-driver-postgresql==1.13.0",
    "alembic==1.20.0",
    "cssselect2==0.10.1",
    "duckdb==2.0.0",
    "en-core-web-sm==3.8.0",
    "html5lib==1.1",
    "lark==1.3.1",
    "linkml==1.12.1",
    "linkml-runtime==1.12.1",
    "linkml-term-validator==0.4.5",
    "oaklib==0.7.4",
    "pglast==8.7",
    "pyshacl==0.40.1",
    "rdflib==7.6.0",
    "valuesets==0.4.2",
    "lxml==6.1.3",
    "numpy==2.5.4",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "regex==2026.9.29",
    "rich==15.0.0",
    "rule-engine==5.1.0",
    "spacy==3.8.18",
    "scipy==1.18.1",
    "sqlalchemy==2.1.5",
    "sympy==1.14.0",
    "typer==0.27.3",
    "fastmcp==4.1.3",
    "pgpq==0.12.0",
    "jsonschema==4.26.0",
    "cattrs==26.2.1",
    "networkx==3.7",
]

[project.scripts]
ci = "corpus_structure.cli.app:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "corpus_structure"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
