[project]
name = "corpus-structure"
version = "0.0.0"
description = "Builds a highly structured representation of a set of documents (D9 §1)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "adbc-driver-postgresql==1.13.0",
    "alembic==1.20.1",
    "duckdb==2.0.0",
    "en-core-web-sm==3.8.0",
    "lark==1.3.1",
    "linkml==1.12.1",
    "linkml-runtime==1.12.1",
    "linkml-term-validator==0.4.5",
    "oaklib==0.7.4",
    "pglast==8.7",
    "pyshacl==0.40.1",
    "rdflib==7.6.0",
    "valuesets==0.4.2",
    "numpy==2.5.4",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "regex==2026.9.29",
    "rich==15.0.0",
    "rule-engine==5.1.0",
    "spacy==3.8.18",
    "scipy==1.18.1",
    "sqlalchemy==2.1.6",
    "sympy==1.14.0",
    "typer==0.28.0",
    "fastmcp==4.1.3",
    "pgpq==0.12.0",
    "jsonschema==4.26.0",
    "cattrs==26.2.1",
    "networkx==3.7",
    "docling[asr,easyocr,htmlrender,ocrmac,onnxruntime,rapidocr,remote-serving,tesserocr,vlm,xbrl]==2.148.0",
    "docling-core==2.106.0",
    "pypdfium2==5.14.0",
    "ijson==3.6.0",
    "sqlglot==30.27.0",
    "gliner2[local]==2.1.0",
    "threadpoolctl==3.7.0",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.2.0",
    "pgvector==0.5.1",
    "splink==5.0.0",
    "pronto==2.7.4",
    "fastobo==0.14.2",
    "structlog==26.1.0",
    "hanlp==2.1.7",
    "hanlp-common==0.0.24",
    "cupy-cuda13x==14.2.0",
    "torch==2.15.0",
    "transformers==5.22.1",
    "astroid==4.3.4",
    "griffe==2.4.1",
    "libcst==1.9.0",
    "python-rapidjson==1.25",
]

[project.scripts]
ci = "corpus_structure.cli.app:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "corpus_structure"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
hanlp-common = { git = "https://github.com/hankcs/HanLP.git", rev = "959a6966f6e7e26d2e89c4112ca9bafbe32eb743", subdirectory = "plugins/hanlp_common" }
