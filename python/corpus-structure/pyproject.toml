[project]
name = "corpus-structure"
version = "0.0.0"
description = "Builds a highly structured representation of a set of documents (D9 §1)."
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "rich==15.0.0",
    "sqlalchemy==2.1.5",
    "typer==0.27.3",
]

[project.scripts]
ci = "corpus_structure.cli.app:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "corpus_structure"
