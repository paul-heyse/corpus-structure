# Alembic configuration for migrations (D3; 0001 arrives with P0-F-4). The database URL comes from
# Settings (CORPUS_DATABASE__URL), never from this file.
[alembic]
script_location = %(here)s/alembic
# env.py runs for `alembic revision` too, so its hooks refuse a revision for an unlogged model
# revision and stamp the model revision into the file (core/db/migrations.py; P0-M-4)
revision_environment = true
path_separator = os
