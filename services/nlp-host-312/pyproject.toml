[project]
name = "corpus-nlp-host-312"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dipo==0.2.1",
  "huggingface-hub==1.33.0",
  "maverick-coref==1.0.7",
  "peft==0.21.2",
  "protobuf==3.20.0",
  "pytorch-lightning==2.6.6",
  "sentencepiece==0.2.0",
  "setuptools==80.10.2",
  "tensorboard==2.18.0",
  "threadpoolctl==3.7.0",
  "torch==2.15.0",
  "transformers==5.22.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
