[project]
name = "corpus-pm2-hanlp-runtime"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "hanlp==2.1.7",
  "hanlp-common==0.0.24",
  "torch==2.15.0",
  "transformers==5.22.1",
]

[tool.uv]
package = false

[tool.uv.sources]
# The HanLP 2.1.7 wheel requires 0.0.24, whose source is published upstream.
hanlp-common = { git = "https://github.com/hankcs/HanLP.git", rev = "959a6966f6e7e26d2e89c4112ca9bafbe32eb743", subdirectory = "plugins/hanlp_common" }
