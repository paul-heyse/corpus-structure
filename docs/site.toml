# Publication choices only. Architecture/lifecycle remain with their existing owners.
[site]
repository = "https://github.com/paul-heyse/corpus-structure"
branch = "main"
base_url = "/"
public_url = "https://paul-heyse.github.io/corpus-structure/"

# Documentation binaries, pinned exactly; `just bootstrap-docs` installs these versions and
# publication checks them.
[tools]
mdbook = "0.5.4"
pagefind = "1.6.0"
lychee = "0.24.2"

[hosted-linux-x64.mdbook]
url = "https://github.com/rust-lang/mdBook/releases/download/v{version}/mdbook-v{version}-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
member = "mdbook"

[hosted-linux-x64.pagefind]
url = "https://files.pythonhosted.org/packages/c8/1a/17c5d1e8d63ee352266ff94726372b6ef2f7f04bd5ec2c376c1c444a6e7e/pagefind_bin-{version}-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl"
sha256 = "5622ef851ae4cdd65a15cf62657348c6d490acf92417e772ad27e77b21ad301f"
member = "pagefind_bin/pagefind"

[hosted-linux-x64.lychee]
url = "https://github.com/lycheeverse/lychee/releases/download/lychee-v{version}/lychee-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
member = "lychee-x86_64-unknown-linux-gnu/lychee"

[publication]
entrypoints = ["README.md", "docs/examples/README.md", "docs/README.md", "docs/design/README.md", "docs/evaluation.md", "docs/develop.md", "STATUS.md", "AGENTS.md", "docs/publishing.md", "docs/library_leverage/README.md", "docs/library_leverage/library-leverage-framework.md", "docs/library_leverage/patterns.md"]
# The active plan, once written, e.g. ["docs/plans/<topic>_<YYYY-MM-DD>.md"]
current_work = ["docs/plans/design-phase_2026-10-28.md"]
exclude = [
  "docs/functional_reviews/github_view_improvement.md",
  "docs/functional_reviews/github_view_improvement_additional_recommendations.md",
]
assets = [
  "docs/assets/pipeline.svg",
  "docs/assets/pipeline-dark.svg",
  "docs/assets/favicon.svg",
  "docs/assets/social-preview.png",
  "docs/examples/data/retained-examples.json",
]

[descriptions]
"docs/examples/README.md" = "Inspect retained source, operation, result and assessment for worked Corpus Structure examples."
"docs/design/README.md" = "Trace a retained result through the Corpus Structure pipeline and read the design contracts."
"docs/evaluation.md" = "See what Corpus Structure assessed at each operation and where the current evidence has limits."
"docs/develop.md" = "Prepare a Corpus Structure checkout and find the tools, code paths and contributor instructions."

[navigation]
opening = [
  { title = "Overview", path = "README.md" },
  { title = "Examples", path = "docs/examples/README.md" },
  { title = "Functional architecture", path = "docs/design/README.md" },
  { title = "Evaluation", path = "docs/evaluation.md" },
  { title = "Develop locally", path = "docs/develop.md" },
]
groups = [
  { title = "Architecture contracts", root = "docs/design/DESIGN.md", collections = ["Architecture", "Design standard"] },
  { title = "Implementation reference", root = "docs/README.md", collections = ["Documentation"] },
  { title = "Evidence and experiments", root = "docs/design_review/evidence/README.md", collections = ["Evidence", "Reviews", "Design principle audit"] },
  { title = "Contributor and agent workflows", root = "AGENTS.md", collections = ["Process", "Start here"] },
  { title = "Plans and decisions", root = "docs/plans/README.md", collections = ["Work plans", "Decisions"] },
  { title = "Library references", root = "docs/libraries/README.md", collections = ["Library overviews", "Library leverage"] },
]

[[collections]]
title = "Start here"
include = ["README.md", "STATUS.md", "AGENTS.md"]
scope = "Current"
[[collections]]
title = "Documentation"
include = ["docs/*.md", "docs/examples/*.md"]
scope = "Reference"
[[collections]]
title = "Architecture"
include = ["docs/design/**/*.md"]
scope = "Current"
[[collections]]
title = "Decisions"
include = ["docs/adr/*.md"]
scope = "Reference"
[[collections]]
title = "Work plans"
include = ["docs/plans/**/*.md"]
scope = "Reference"
[[collections]]
title = "Design standard"
include = ["docs/design_review/design_principles/**/*.md"]
scope = "Current"
[[collections]]
title = "Reviews"
include = ["docs/design_review/reviews/**/*.md", "docs/functional_reviews/**/*.md", "docs/plan_improvement_reviews/**/*.md"]
scope = "Reference"
