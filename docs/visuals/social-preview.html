<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Corpus Structure social preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "DejaVu Sans", sans-serif; }
  main { width: 1280px; height: 640px; padding: 82px 86px; color: #f4f8ff; background: #112641; }
  .label { color: #9bd9ca; font-size: 23px; font-weight: bold; letter-spacing: .17em; }
  h1 { font-size: 82px; letter-spacing: -.045em; margin: 30px 0 14px; }
  p { font-size: 36px; line-height: 1.25; color: #ccdcf0; margin: 0; max-width: 900px; }
  ol { padding: 0; margin: 64px 0 0; list-style: none; display: flex; gap: 22px; align-items: center; }
  li { padding: 21px 30px; border-radius: 12px; font-size: 25px; font-weight: bold; color: #142d47; background: #cfe5fb; }
  li:nth-of-type(3) { background: #cceee4; }
  li:nth-of-type(5) { background: #f9e7b8; }
  .arrow { color: #8fabcd; background: transparent; padding: 0; }
</style>
<main>
  <div class="label">DOCUMENT INTELLIGENCE</div>
  <h1>Corpus Structure</h1>
  <p>From documents to connected,<br>source-grounded knowledge.</p>
  <ol aria-label="Transformation">
    <li>Documents</li><li class="arrow" aria-hidden="true">→</li>
    <li>Semantic components</li><li class="arrow" aria-hidden="true">→</li>
    <li>Connected knowledge</li>
  </ol>
</main>
</html>
