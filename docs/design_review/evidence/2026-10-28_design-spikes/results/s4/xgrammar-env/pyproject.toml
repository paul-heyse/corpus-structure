# S4-D side environment: vLLM 0.31's structured-output backend (xgrammar 0.2.7) on CPU torch, for the
# offline decoding-form check. Environment outside the evidence folder:
#   cd results/s4/xgrammar-env && UV_PROJECT_ENVIRONMENT=$REPO/build/spike-xgrammar-venv uv sync --locked
# triton (an xgrammar dependency on Linux x86-64, used only by its GPU kernels) is overridden away so
# no CUDA stack is installed; grammar compilation and matching run on CPU.
[project]
name = "s4-xgrammar-env"
version = "0"
requires-python = "==3.14.10"
dependencies = [
  "xgrammar==0.2.7",
  "torch==2.14.1",
  "transformers==5.21.0",
  "tokenizers==0.23.3",
  "pydantic==2.14.1",
  "numpy==2.5.4",
  "apache-tvm-ffi==0.1.15.post1",
]

[tool.uv]
package = false
override-dependencies = ["triton; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
