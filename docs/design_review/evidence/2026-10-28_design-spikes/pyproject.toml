[project]
name = "design-spikes-2026-10-28"
version = "0.0.0"
description = "Throwaway environment for the design spikes (plan: docs/plans/design-spikes-s0-s1_2026-10-28.md). Not product code."
requires-python = "==3.14.10"
# Exact pins at the latest releases resolved at E0 (2026-10-28); see results/environment.json.
dependencies = [
    # HTML
    "lxml==6.1.3",
    "html5lib==1.1",
    "cssselect==1.6.0",
    "cssselect2==0.10.1",
    "trafilatura==2.3.1",
    # LaTeX and math (pylatexenc 3.0 prerelease: its configurable ParsingState is needed for HTML prose)
    "pylatexenc==3.0b2",
    "sympy==1.14.0",
    "lark==1.3.1",
    # Sentences
    "spacy==3.8.18",
    "spacy-curated-transformers==0.3.1",
    "torch==2.14.1",
    "en_core_web_sm==3.8.0",
    "en_core_web_trf==3.8.0",
    # Sizing
    "tokenizers==0.23.3",
    "huggingface-hub==2.3.0",
    # Instruments
    "pydantic==2.14.1",
    "linkml==1.12.1",
    "linkml-runtime==1.12.1",
    "rapidfuzz==3.14.6",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "numpy==2.5.4",
    "pyyaml==6.0.3",
    "pint==0.26.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en_core_web_trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
