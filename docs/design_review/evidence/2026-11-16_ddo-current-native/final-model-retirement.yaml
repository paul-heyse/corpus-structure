baseline: 31d628290b2fd4e6ce279464e4e4467628803dac
core: "id: https://corpus-structure.dev/core\nname: core\ntitle: Core schema\ndescription: >-\n  The core\
  \ module of the corpus-structure model (ADR-0020; D2 \xA76): the domain-independent D1\n  shapes and\
  \ vocabulary that every domain pack imports. It is the authority: core/vocab.py and\n  core/_model/\
  \ are generated from it, the vocabulary and model facts by Stage A and the Pydantic\n  shapes by Stage\
  \ B (P0-M-5). Native LinkML carries every meaning it can; the remaining ci:\n  annotations are scalar\
  \ and listed in D2 \xA73.\nversion: 0.6.7\nlicense: https://creativecommons.org/publicdomain/zero/1.0/\n\
  prefixes:\n  linkml: https://w3id.org/linkml/\n  ci: https://corpus-structure.dev/ci/\n  core: https://corpus-structure.dev/core/\n\
  default_prefix: core\ndefault_range: string\nimports:\n  - linkml:types\nannotations:\n  ci:key_scheme:\
  \ 1\n\ntypes:\n  Key:\n    typeof: string\n    pattern: \"^[a-z]+:[0-9a-f]{32}$\"\n    description:\
  \ A D1 \xA710.1 key, a prefix and 32 hex digits ('clm:\u2026').\n  Locator:\n    typeof: string\n  \
  \  description: A D1 \xA73.4 locator string ('special/Normal.html#rel1').\n  CanonicalDecimal:\n   \
  \ typeof: string\n    pattern: \"^(?:0|-?(?:[1-9][0-9]*(?:\\\\.[0-9]*[1-9])?|0\\\\.[0-9]*[1-9]))$\"\n\
  \    description: A number as its D1 \xA76.2 canonical decimal string.\n  SentenceId:\n    typeof: string\n\
  \    pattern: \"^[sc][0-9]+$\"\n    description: A citation-frame sentence id, sN in the unit or cN\
  \ in the standing context.\n    annotations: {ci:refers: sentence}\n  Timestamp:\n    typeof: datetime\n\
  \    description: A point in time with time zone (timestamptz).\n  EntityKey:\n    typeof: Key\n   \
  \ pattern: \"^ent:[0-9a-f]{32}$\"\n    description: An entity's key (an ExternalReference's is a ReferenceKey).\n\
  \  StatementKey:\n    typeof: Key\n    pattern: \"^stm:[0-9a-f]{32}$\"\n    description: A statement's\
  \ key.\n  ReferenceKey:\n    typeof: Key\n    pattern: \"^xrf:[0-9a-f]{32}$\"\n    description: An ExternalReference's\
  \ key.\n  ClaimKey:\n    typeof: Key\n    pattern: \"^clm:[0-9a-f]{32}$\"\n    description: A claim's\
  \ key.\n  RenditionKey:\n    typeof: Key\n    pattern: \"^ren:[0-9a-f]{32}$\"\n    description: A rendition's\
  \ key, the typed reference a stored batch and a candidate set carry.\n  SegmentKey:\n    typeof: Key\n\
  \    pattern: \"^seg:[0-9a-f]{32}$\"\n    description: A segment's key on one rendition.\n  # Stage\
  \ B's constrained strings and offsets (model and projections \xA73.3)\n  NonEmpty:\n    typeof: string\n\
  \    description: A string that is not empty (a local ref, an id, a quote, a selector).\n    annotations:\
  \ {ci:py_type: \"Annotated[str, Field(min_length=1)]\"}\n  Offset:\n    typeof: integer\n    minimum_value:\
  \ 0\n    description: A character offset or a count, never negative.\n  LocalName:\n    typeof: string\n\
  \    pattern: \"^[A-Za-z_][A-Za-z0-9_]*$\"\n    description: A schema element's local name, as the authored\
  \ form writes it (ParameterRole).\n  PrefixedName:\n    typeof: string\n    pattern: \"^[a-z][a-z0-9_]*:[A-Za-z_][A-Za-z0-9_]*$\"\
  \n    description: A schema element's prefixed name, as the stored form writes it (stat:ParameterRole).\n\
  \  MemberName:\n    typeof: string\n    pattern: \"^[a-z][a-z0-9_]*(:[a-z][a-z0-9_]*)?$\"\n    description:\
  \ >-\n      A member of a schema-version-scoped closed set: a core member by its name, a pack's by\n\
  \      <prefix>:<name> (S1's compiled models and S2's checks refuse what the version lacks).\n\nsubsets:\n\
  \  structural:\n    description: >-\n      Structural claims, about statements. They take no statement_role,\
  \ are asserted, and carry no\n      conditions (guideline \xA710.3, \xA710.6, \xA710.7 rule 4).\n  unsupported:\n\
  \    description: >-\n      Something the source states that the schema cannot express; the claim has\
  \ status unsupported\n      (D1 \xA78.1).\n  # Member properties (D2 \xA73.4): subsets used by enum\
  \ members only, generated as frozensets. Each\n  # names its consumer (ADR-0023); one whose reader is\
  \ not built yet names the planned reader.\n  premise_forming:\n    description: \"Member property of\
  \ ClaimModality: claims are premises (INV-06; D8 default filters).\"\n    annotations: {ci:consumer:\
  \ \"validators (INV-06); D8 default filters\"}\n  attribution_identifying:\n    description: \"Member\
  \ property of ClaimModality: attribution enters the claim key (D1 \xA710.1).\"\n    annotations: {ci:consumer:\
  \ \"Stage A qualifier specs (ci:key_role_when); KeySchema and keys (F2d)\"}\n  conflict_bearing:\n \
  \   description: \"Member property of ClaimModality: claims can conflict across statements (D5 \xA7\
  5.5).\"\n    annotations: {ci:consumer: \"consolidation conflict detection (D5 \xA75.5)\"}\n  reserved:\n\
  \    description: \"Member property of ClaimModality: reserved, not authored under guideline v1.\"\n\
  \    annotations: {ci:consumer: \"batch validation under guideline v1 (D1 \xA75.2; OPEN-D2-15)\"}\n\
  \  claim_bearing:\n    description: \"Member property of StatementKind: the kind's units state claims\
  \ (D6 \xA77.2).\"\n    annotations: {ci:consumer: \"ingest (I1a) and source profiles; M24 packets (D6\
  \ \xA77.2)\"}\n  annotation_unit:\n    description: \"Member property of SegmentKind: a segment of the\
  \ kind is an annotation unit (D1 \xA73.4).\"\n    annotations: {ci:consumer: \"locators (I0); source-profile\
  \ segments (I1a)\"}\n  top_level_annotation_unit:\n    description: >-\n      Member property of SegmentKind:\
  \ a segment of the kind is an annotation unit when its\n      ancestors are only section-like segments\
  \ (D1 \xA73.4).\n    annotations: {ci:consumer: \"locators (I0); source-profile segments (I1a)\"}\n\
  \  statement_anchor:\n    description: \"Member property of SegmentKind: a statement anchors on the\
  \ innermost such segment (D1 \xA710.1).\"\n    annotations: {ci:consumer: \"keys (statement anchors,\
  \ D1 \xA710.1)\"}\n  search_block:\n    description: \"Member property of SegmentKind: a BM25 search\
  \ block (D3 \xA75).\"\n    annotations: {ci:consumer: \"M2 BM25 index predicate and overlay check; source-profile\
  \ segments (I1a)\"}\n  section_like:\n    description: >-\n      Member property of SegmentKind: a segment\
  \ of the kind groups blocks without being a block\n      (the document and sections); annotation units\
  \ are found below it.\n    annotations: {ci:consumer: \"keys; locators (I0)\"}\n  section_label:\n \
  \   description: >-\n      Member property of SegmentKind: a segment of the kind labels its section;\
  \ it is neither an\n      annotation unit nor uncovered text.\n    annotations: {ci:consumer: \"locators\
  \ (I0)\"}\n  container:\n    description: \"Member property of SegmentKind: a segment of the kind holds\
  \ other blocks.\"\n    annotations: {ci:consumer: \"ingest HTML segmentation (I1a)\"}\n  citable_sentence:\n\
  \    description: >-\n      Member property of SegmentKind: a citation frame's entries and statement\
  \ ordinals address\n      segments of the kind (D1 \xA710.1, \xA710.3).\n    annotations: {ci:consumer:\
  \ \"keys; citation frames (D1 \xA710.1, \xA710.3)\"}\n  sentence_split:\n    description: >-\n     \
  \ Member property of SegmentKind: M03 splits a segment of the kind into sentences when no\n      segment\
  \ of such a kind lies inside it (D4 M03).\n    annotations: {ci:consumer: \"M03 sentence segmentation\
  \ (I1a)\"}\n  symmetric_relation:\n    description: \"Member property of Relation: the operands' order\
  \ does not matter (D1 \xA77).\"\n    annotations: {ci:consumer: \"keys (canonical relation form, D1\
  \ \xA77)\"}\n  converse_rewritten:\n    description: >-\n      Member property of Relation: the canonical\
  \ form writes it as its converse with the sides\n      swapped (> as <, >= as <=; D1 \xA77).\n    annotations:\
  \ {ci:consumer: \"keys (canonical relation form, D1 \xA77)\"}\n\nclasses:\n  Entity:\n    abstract:\
  \ true\n    description: Base of every entity class; instances are D1 entities.\n    slots: [label]\n\
  \n  Statement:\n    is_a: Entity\n    description: >-\n      An authored unit of meaning: a definition,\
  \ theorem, proof, example, exercise, remark,\n      convention or assumption. Claims belong to statements\
  \ as premises, conclusions, definientia\n      or example values. Listed in a batch's statements[],\
  \ never in entities[].\n    slots: [kind]\n    annotations:\n      ci:scope: local\n      ci:extract:\
  \ none\n      ci:reify: true\n\n  ExternalReference:\n    is_a: Entity\n    description: >-\n      A\
  \ reference to something outside the batch (\"the last result\", an author [n] link): a typed\n    \
  \  node anchored at the citing statement's anchor and resolved by consolidation, never a dropped\n \
  \     claim (D1 \xA74.4). A batch writes it as an OutsideItem with its ReferenceDescriptor; it is\n\
  \      keyed xrf by the citing statement's key, the quote's text form and the link target (D1\n    \
  \  \xA710.1); consolidation records its resolution (kb.entity.resolved_to), and until then it stays\n\
  \      an unresolved typed node.\n    annotations:\n      ci:scope: local\n      ci:extract: none\n\n\
  \  Value:\n    abstract: true\n    description: >-\n      Base of the D1 value classes. Every value\
  \ carries the tag t, which names its class; the core\n      Pydantic value union is discriminated on\
  \ it.\n    slots: [t]\n\n  TextValue:\n    is_a: Value\n    description: Free text that is the value\
  \ itself.\n    slot_usage:\n      t: {equals_string: text}\n    attributes:\n      v: {required: true,\
  \ description: The text.}\n\n  NumberValue:\n    is_a: Value\n    description: >-\n      A number as\
  \ its D1 \xA76.2 canonical decimal; `unit` and `basis` as the source states them.\n    slot_usage:\n\
  \      t: {equals_string: number}\n    attributes:\n      v:\n        range: CanonicalDecimal\n    \
  \    required: true\n        description: The canonical decimal string.\n        annotations: {ci:validator:\
  \ core.shape_support:canonical_number}\n      unit: {description: \"The unit as stated, or absent.\"\
  }\n      basis: {description: \"A reference basis the source states, such as gauge or absolute, or absent.\"\
  }\n\n  BoolValue:\n    is_a: Value\n    description: A truth value.\n    slot_usage:\n      t: {equals_string:\
  \ bool}\n    attributes:\n      v: {range: boolean, required: true, description: The truth value.}\n\
  \n  EnumValue:\n    is_a: Value\n    description: >-\n      A member of a schema enum: the enum by its\
  \ local name when authored (`ParameterRole`), by its\n      prefixed name when stored (`stat:ParameterRole`).\n\
  \    slot_usage:\n      t: {equals_string: enum}\n    attributes:\n      enum:\n        range: LocalName\n\
  \        required: true\n        description: \"The enum's name: local when authored, prefixed when\
  \ stored (X2-01).\"\n        annotations: {ci:stored_range: PrefixedName}\n      v: {required: true,\
  \ description: The permissible value.}\n\n  Expression:\n    is_a: Value\n    abstract: true\n    description:\
  \ >-\n      Base of the formula and set values: the LaTeX as written with its symbol bindings, and the\n\
  \      normal form and parse outcome M11 adds in consolidation.\n    attributes:\n      latex:\n   \
  \     required: true\n        description: The LaTeX exactly as written, macros included.\n      symbols:\n\
  \        range: SymbolBinding\n        multivalued: true\n        inlined: true\n        description:\
  \ The binding map, keyed by symbol in token form without backslash.\n        annotations: {ci:py_type:\
  \ \"dict[str, SymbolBinding]\"}\n      sympy:\n        description: The normalized SymPy form; added\
  \ by M11 during consolidation.\n        annotations: {ci:form: consolidated}\n      parse:\n       \
  \ range: ParseOutcome\n        description: The parse outcome; added by M11 during consolidation.\n\
  \        annotations: {ci:form: consolidated}\n\n  Formula:\n    is_a: Expression\n    description:\
  \ A formula as written, with its symbol bindings (D1 \xA76.1).\n    slot_usage:\n      t: {equals_string:\
  \ formula}\n\n  SetExpr:\n    is_a: Expression\n    annotations: {ci:py_name: SetValue}\n    description:\
  \ A set written in LaTeX, such as \\R, (0, \\infty) or \\R \\setminus \\{0\\}.\n    slot_usage:\n  \
  \    t: {equals_string: set}\n\n  DateValue:\n    is_a: Value\n    description: A date or date-time\
  \ kept verbatim as ISO 8601.\n    slot_usage:\n      t: {equals_string: date}\n    attributes:\n   \
  \   v:\n        required: true\n        pattern: \"^[0-9]{4}(-[0-9]{2}(-[0-9]{2}(T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\\\
  \\.[0-9]+)?)?(Z|[+-][0-9]{2}:[0-9]{2})?)?)?)?$\"\n        description: The ISO 8601 string as written.\n\
  \n  IntervalValue:\n    is_a: Value\n    description: >-\n      An interval; an absent bound is unbounded.\n\
  \    slot_usage:\n      t: {equals_string: interval}\n    attributes:\n      start:\n        any_of:\
  \ [{range: NumberValue}, {range: DateValue}, {range: Formula}]\n        inlined: true\n        description:\
  \ \"The lower bound, a number, date or formula.\"\n      end:\n        any_of: [{range: NumberValue},\
  \ {range: DateValue}, {range: Formula}]\n        inlined: true\n        description: \"The upper bound,\
  \ a number, date or formula.\"\n      start_incl: {range: boolean, description: Whether the lower bound\
  \ is included.}\n      end_incl: {range: boolean, description: Whether the upper bound is included.}\n\
  \n  PhraseValue:\n    is_a: Value\n    description: >-\n      Text kept but not interpreted. The model-facing\
  \ form names the sentence it lies in; the stored\n      form adds the offsets the quote cascade located.\n\
  \    slot_usage:\n      t: {equals_string: phrase}\n    annotations:\n      ci:invariant: ordered(start,\
  \ end)\n      ci:py_name: Phrase\n    attributes:\n      text: {required: true, description: The text\
  \ as written.}\n      sentence:\n        range: SentenceId\n        description: The unit sentence (sN)\
  \ or standing-context sentence (cN) holding the text.\n        annotations: {ci:form: model}\n     \
  \ start:\n        range: Offset\n        description: Start offset in the rendition's canonical text.\n\
  \        annotations: {ci:form: stored, ci:required_in: stored}\n      end:\n        range: Offset\n\
  \        description: End offset in the rendition's canonical text.\n        annotations: {ci:form:\
  \ stored, ci:required_in: stored}\n      coarse:\n        range: boolean\n        description: The text\
  \ was not located exactly; the span is the whole cited sentence.\n        annotations: {ci:form: stored}\n\
  \n  EntityRef:\n    description: >-\n      The one entity-reference shape: a local ref in a batch, an\
  \ entity key once stored.\n    attributes:\n      ref: {required: true, description: The local ref or\
  \ entity key., annotations: {ci:refers: entity}}\n\n  SymbolBinding:\n    description: >-\n      How\
  \ one symbol of a formula is bound (D1 \xA76.1); the kind decides which fields it has.\n    annotations:\n\
  \      ci:invariant: >-\n        iff_present(entity, bind = variable|family_param);\n        iff_present(claim,\
  \ bind = param_of|param_expr_of);\n        iff_present(param, bind = param_of|param_expr_of)\n    attributes:\n\
  \      bind: {range: BindKind, required: true, description: The binding kind.}\n      entity: {description:\
  \ \"variable, family_param: the entity's local ref (key once stored).\", annotations: {ci:refers: entity}}\n\
  \      claim: {description: \"param_of, param_expr_of: the claim's local ref (key once stored).\", annotations:\
  \ {ci:refers: claim}}\n      param: {description: \"param_of, param_expr_of: the entry of the claim's\
  \ ci:param_map qualifier.\"}\n\n  Condition:\n    abstract: true\n    description: >-\n      A condition\
  \ tree (D1 \xA77), the range of the conditions qualifier: one of the node classes\n      below, discriminated\
  \ on op.\n    slots: [op]\n\n  AndNode:\n    is_a: Condition\n    annotations: {ci:py_name: And}\n \
  \   description: All of the arguments hold.\n    slot_usage:\n      op: {equals_string: and}\n    attributes:\n\
  \      args: {range: Condition, multivalued: true, inlined: true, required: true, description: The arguments.}\n\
  \n  OrNode:\n    is_a: Condition\n    annotations: {ci:py_name: Or}\n    description: At least one of\
  \ the arguments holds.\n    slot_usage:\n      op: {equals_string: or}\n    attributes:\n      args:\
  \ {range: Condition, multivalued: true, inlined: true, required: true, description: The arguments.}\n\
  \n  NotNode:\n    is_a: Condition\n    annotations: {ci:py_name: Not}\n    description: The argument\
  \ does not hold.\n    slot_usage:\n      op: {equals_string: not}\n    attributes:\n      arg: {range:\
  \ Condition, inlined: true, required: true, description: The argument.}\n\n  ForallNode:\n    is_a:\
  \ Condition\n    annotations: {ci:py_name: Forall}\n    description: The body holds for every value\
  \ of the variable in the set.\n    slot_usage:\n      op: {equals_string: forall}\n    attributes:\n\
  \      var: {required: true, description: \"The bound variable, a symbol.\"}\n      set: {range: SetExpr,\
  \ inlined: true, required: true, description: The set it ranges over.}\n      body: {range: Condition,\
  \ inlined: true, required: true, description: The condition on it.}\n\n  ClaimNode:\n    is_a: Condition\n\
  \    description: Another claim of the batch holds (a premise reference).\n    slot_usage:\n      op:\
  \ {equals_string: claim}\n    attributes:\n      ref: {required: true, description: The claim's local\
  \ ref (key once stored)., annotations: {ci:refers: claim}}\n\n  MemberNode:\n    is_a: Condition\n \
  \   description: A formula's value lies in a set.\n    slot_usage:\n      op: {equals_string: member}\n\
  \    attributes:\n      x: {range: Formula, inlined: true, required: true, description: The element.}\n\
  \      set: {range: SetExpr, inlined: true, required: true, description: The set.}\n\n  CmpNode:\n \
  \   is_a: Condition\n    description: Two formulas compare by a relation.\n    slot_usage:\n      op:\
  \ {equals_string: cmp}\n    attributes:\n      rel: {range: Relation, required: true, description: The\
  \ relation.}\n      lhs: {range: Formula, inlined: true, required: true, description: The left side.}\n\
  \      rhs: {range: Formula, inlined: true, required: true, description: The right side.}\n\n  PredNode:\n\
  \    is_a: Condition\n    description: A condition predicate of the schema (ConditionPredicate) holds\
  \ of its arguments.\n    slot_usage:\n      op: {equals_string: pred}\n    attributes:\n      name:\
  \ {required: true, description: The condition predicate's name.}\n      args:\n        any_of: [{range:\
  \ Entity}, {range: Formula}]\n        multivalued: true\n        inlined: true\n        required: true\n\
  \        minimum_cardinality: 1\n        description: The arguments, entity references or formulas.\n\
  \        annotations: {ci:py_name: PredArg}\n\n  PhraseNode:\n    is_a: Condition\n    description:\
  \ A condition kept as text, not interpreted.\n    slot_usage:\n      op: {equals_string: phrase}\n \
  \   annotations:\n      ci:invariant: ordered(start, end)\n    attributes:\n      text: {required: true,\
  \ description: The text as written.}\n      sentence:\n        range: SentenceId\n        description:\
  \ The sentence holding the text.\n        annotations: {ci:form: model}\n      start:\n        range:\
  \ Offset\n        description: Start offset in the rendition's canonical text.\n        annotations:\
  \ {ci:form: stored, ci:required_in: stored}\n      end:\n        range: Offset\n        description:\
  \ End offset in the rendition's canonical text.\n        annotations: {ci:form: stored, ci:required_in:\
  \ stored}\n      coarse:\n        range: boolean\n        description: The text was not located exactly.\n\
  \        annotations: {ci:form: stored}\n\n  UnsupportedNode:\n    is_a: PhraseNode\n    description:\
  \ A condition the schema cannot express, kept as text with the reason.\n    slot_usage:\n      op: {equals_string:\
  \ unsupported}\n    attributes:\n      reason: {required: true, description: Why it is unsupported.}\n\
  \n  MapEntry:\n    abstract: true\n    description: >-\n      One entry of a map qualifier (object kind\
  \ map, D2 \xA73): a string key and a value. A map\n      qualifier ranges over a subclass, multivalued\
  \ and inlined, and is written as an object from\n      key to value.\n    attributes:\n      key: {identifier:\
  \ true, description: The entry's key.}\n      value: {description: The entry's value.}\n\n  StoredScope:\n\
  \    description: >-\n      The stored scope qualifier: the extent and the segment it resolves to on\
  \ the rendition.\n    attributes:\n      extent: {range: ScopeExtent, required: true, description: How\
  \ far the supposition reaches.}\n      segment: {range: NonEmpty, required: true, description: The segment\
  \ key it resolves to on the rendition.}\n\n  # ---- batch items (D2 \xA77.3), one declaration per item\
  \ with ci:form attributes ----\n  Evidence:\n    description: >-\n      One evidence span of a claim:\
  \ authored by sentence id and quote, stored by offsets on the\n      rendition.\n    annotations:\n\
  \      ci:invariant: ordered(start, end)\n    attributes:\n      sentence:\n        range: SentenceId\n\
  \        description: The cited sentence.\n        annotations: {ci:form: model, ci:required_in: model}\n\
  \      quote:\n        range: NonEmpty\n        description: The quoted text inside the sentence.\n\
  \        annotations: {ci:form: model, ci:required_in: model}\n      start:\n        range: Offset\n\
  \        description: Start offset.\n        annotations: {ci:form: stored, ci:required_in: stored}\n\
  \      end:\n        range: Offset\n        description: End offset.\n        annotations: {ci:form:\
  \ stored, ci:required_in: stored}\n      role: {range: EvidenceRole, required: true, description: The\
  \ part the span plays.}\n      coarse:\n        range: boolean\n        description: The quote was not\
  \ located exactly.\n        annotations: {ci:form: stored}\n\n  IdentityValue:\n    is_a: MapEntry\n\
  \    description: >-\n      One identity slot of an entity item, by the slot's name (local when authored,\
  \ prefixed when\n      stored), to the local ref of the entity it names or the literal it holds.\n \
  \   slot_usage:\n      key: {annotations: {ci:stored_range: PrefixedName}}\n      value: {required:\
  \ true, description: \"The entity's local ref or the literal, as written.\"}\n\n  Qualifiers:\n    description:\
  \ >-\n      A claim's qualifiers: the core ones (by local name when authored, as `core:<name>` when\n\
  \      stored) and the predicate's schema qualifiers (by local name when authored, by prefixed name\n\
  \      when stored), raw JSON until S1's compiled models type them.\n\n      Stored, the attributes\
  \ keep the local names (`q.modality`); validation and dumps use the\n      prefixed ones.\n    slots:\
  \ [modality, polarity, hedge, attribution, conditions, scope, valid_time]\n    extra_slots: {allowed:\
  \ true}\n    annotations: {ci:validator: stored core.shape_support:prefixed_extras}\n\n  EntityItem:\n\
  \    description: An entity item of a batch (D2 \xA77.3).\n    annotations:\n      ci:py_name: Entity\n\
  \      # an extent and a scope segment only on a local entity; the segment is left out when the\n  \
  \    # extent resolves to none (reported, never guessed: agent interface \xA73.1)\n      ci:invariant:\
  \ \"only_when(extent, scope = local); only_when(scope_segment, scope = local)\"\n    attributes:\n \
  \     local_ref: {range: NonEmpty, required: true, description: The batch-local reference.}\n      type:\
  \ {required: true, description: \"The entity class: local name when authored, prefixed when stored.\"\
  , annotations: {ci:stored_range: PrefixedName}}\n      label: {required: true, description: The label\
  \ as written.}\n      scope: {range: EntityScope, required: true, description: Global or local (D1 \xA7\
  4.2).}\n      extent: {range: EntityExtent, description: How far a local entity reaches.}\n      symbol:\
  \ {description: The symbol a local entity is written as.}\n      aliases: {multivalued: true, description:\
  \ Other names written for it.}\n      identity:\n        range: IdentityValue\n        multivalued:\
  \ true\n        inlined: true\n        description: Identity slot to local ref or literal.\n      scope_segment:\n\
  \        description: >-\n          The segment key a local entity is scoped to; absent when its extent\
  \ resolves to no\n          segment.\n        annotations: {ci:form: stored}\n\n  StatementItem:\n \
  \   description: >-\n      A statement item of a batch: anchored by sentence ids or the unit when authored,\
  \ by segment\n      keys when stored. A statement outside the unit is an OutsideItem.\n    annotations:\
  \ {ci:py_name: Statement}\n    attributes:\n      local_ref: {range: NonEmpty, required: true, description:\
  \ The batch-local reference.}\n      kind: {range: StatementKind, required: true, description: The statement's\
