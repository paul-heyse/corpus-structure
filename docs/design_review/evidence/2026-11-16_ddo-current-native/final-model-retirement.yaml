  \ {description: Quoted text of an earlier email message., in_subset: [container]}\n      signature:\
  \ {description: An email signature block.}\n  DelimitingStatus:\n    description: >-\n      How cleanly\
  \ a segment or rendition was delimited: one definition for kb.segment and\n      kb.rendition parse_status\
  \ (D1 \xA73.2), replacing evidence.ParseStatus and SegmentParseStatus.\n    annotations: {ci:lifecycle:\
  \ static}\n    permissible_values:\n      ok: {description: Delimited cleanly.}\n      partial: {description:\
  \ Delimited in part; the reason says where.}\n      failed: {description: Not delimited; the reason\
  \ says why.}\n\n  # ---- the declaration vocabulary's own values (D2 \xA73.4), read by the loader and\
  \ _model ----\n  Lifecycle:\n    description: \"The values of ci:lifecycle: how a closed set changes\
  \ and is enforced.\"\n    annotations: {ci:lifecycle: static}\n    permissible_values:\n      static:\
  \ {description: Changes with code; enforced by a digest-named CHECK.}\n      schema_version: {description:\
  \ Extendable by packs; enforced by per-version member rows and FKs.}\n  KeyRole:\n    description: \"\
  The values of ci:key_role: a qualifier's part in the claim key (D1 \xA75.2).\"\n    annotations: {ci:lifecycle:\
  \ static}\n    permissible_values:\n      identity: {description: Enters the claim key in its canonical\
  \ form.}\n      meaning: {description: Outside the key; disagreement makes alternatives.}\n      inert:\
  \ {description: Neither.}\n  CaseRule:\n    description: \"The values of ci:case: the case policy of\
  \ a string-ranged slot or class label.\"\n    annotations: {ci:lifecycle: static}\n    permissible_values:\n\
  \      fold: {description: Casefolded (prose).}\n      preserve: {description: Case kept (math-bearing\
  \ text).}\n  CanonicalForm:\n    description: >-\n      A qualifier's canonical form, derived from its\
  \ range (D1 \xA76.2; model and projections \xA73.2).\n    annotations: {ci:lifecycle: static}\n    permissible_values:\n\
  \      token_form: {description: \"Formula, SetExpr: the token form over the effective macro table.\"\
  }\n      text_form: {description: \"TextValue, PhraseValue: NFC, whitespace collapsed, case per policy.\"\
  }\n      identifier: {description: \"A string range with ci:case: NFC, collapsed, the declared case.\"\
  }\n      enum: {description: \"EnumValue: {enum: prefixed enum name, v: member} verbatim.\"}\n     \
  \ member: {description: \"An enum-ranged slot: the bare member value.\"}\n      entity_key: {description:\
  \ \"An entity range: the resolved key after the kind check.\"}\n      interval: {description: \"IntervalValue:\
  \ recursive over bounds and inclusivity.\"}\n      map: {description: \"A MapEntry range: key (NFC)\
  \ to the canonical form of the value range.\"}\n      number: {description: \"NumberValue: the canonical\
  \ decimal; unit and basis collapsed.\"}\n      verbatim: {description: \"DateValue, BoolValue: as written.\"\
  }\n      condition: {description: \"Condition: the D1 \xA77 canonical tree, leaves by range.\"}\n  \
  \    scope: {description: \"Stored scope: the extent and the segment's locator (member keys only).\"\
  }\n  QualifierStore:\n    description: Where a qualifier's value is stored (D3 \xA75).\n    annotations:\
  \ {ci:lifecycle: static}\n    permissible_values:\n      column: {description: A kb.claim column.}\n\
  \      json: {description: Inside kb.claim.qualifiers.}\n      edge: {description: An edge table row.}\n\
  \  Unkeyed:\n    description: The typed state of a candidate not yet keyed (at submission), never null.\n\
  \    annotations: {ci:lifecycle: static}\n    permissible_values:\n      unkeyed: {description: Not\
  \ yet keyed.}\n  Awaiting:\n    description: The typed state of an ExternalReference consolidation has\
  \ not resolved (D1 \xA74.4).\n    annotations: {ci:lifecycle: static}\n    permissible_values:\n   \
  \   awaiting: {description: Not yet resolved.}\n  RefKind:\n    description: >-\n      What a reference\
  \ position may name (F2e; R04): an entity (an ExternalReference included), a\n      statement or a claim;\
  \ the position's ci:refers declares its kinds.\n    annotations: {ci:lifecycle: static}\n    permissible_values:\n\
  \      entity: {description: An entity; an ExternalReference node is one.}\n      statement: {description:\
  \ A statement.}\n      claim: {description: \"A claim; an ExternalReference may stand where a claim\
  \ is named.\"}\n"
system: "id: https://corpus-structure.dev/system\nname: system\ntitle: System schema\ndescription: >-\n\
  \  The system module of the corpus-structure model (ADR-0020): the classes of D3's meta, ops, kb and\n\
  \  eval schemas with their closed sets, invariants and relationships; the payload classes of their\n\
  \  JSONB columns; the source-profile class; and the unit-feature vocabulary of\n  agent_reuse by_unit.\
  \ System classes are tables unless ci:store says otherwise; their table is the\n  snake case of the\
  \ class name (or the native local_names sql entry) in the schema their subset\n  names; a single-valued\
  \ class-ranged attribute is a foreign key column named <attribute>_id.\nversion: 0.6.7\nlicense: https://creativecommons.org/publicdomain/zero/1.0/\n\
  prefixes:\n  linkml: https://w3id.org/linkml/\n  ci: https://corpus-structure.dev/ci/\n  core: https://corpus-structure.dev/core/\n\
  \  sys: https://corpus-structure.dev/system/\n  xsd: http://www.w3.org/2001/XMLSchema#\ndefault_prefix:\
  \ sys\ndefault_range: string\nimports:\n  - linkml:types\n  - core\n\ntypes:\n  Id:\n    typeof: integer\n\
  \    uri: xsd:long\n    description: A generated bigint row id, or a bigint reference without a foreign\
  \ key.\n  SmallInt:\n    typeof: integer\n    uri: xsd:short\n    description: A small integer (smallint).\n\
  \  Real:\n    typeof: float\n    uri: xsd:float\n    description: A single-precision float (real).\n\
  \  Double:\n    typeof: double\n    description: A double-precision float (double precision).\n  Bytes:\n\
  \    typeof: string\n    description: Raw bytes (bytea), such as a serialized Arrow schema.\n    annotations:\
  \ {ci:sql_type: bytea}\n  Json:\n    typeof: string\n    description: An opaque JSON document (jsonb)\
  \ whose structure the model does not declare.\n    annotations: {ci:sql_type: jsonb, ci:py_type: JsonValue}\n\
  \  Score:\n    typeof: Real\n    minimum_value: 0\n    maximum_value: 1\n    description: A score in\
  \ [0, 1].\n  TsConfig:\n    typeof: string\n    description: A text-search configuration name (regconfig).\n\
  \    annotations: {ci:sql_type: regconfig}\nsubsets:\n  meta: {description: Tables in the meta schema\
  \ (D3 \xA73).}\n  ops: {description: Tables in the ops schema (D3 \xA74).}\n  kb: {description: Tables\
  \ in the kb schema (D3 \xA75).}\n  eval: {description: Tables in the eval schema (D3 \xA77).}\n  # member\
  \ properties of ConfidenceState: the states each ConfidenceSource member has (D5 \xA76.2);\n  # each\
  \ names its consumer (ADR-0023), the confidence model and the policy's confidence block\n  encoders_state:\n\
  \    description: \"Member property of ConfidenceState: a state of the encoders source.\"\n    annotations:\
  \ {ci:consumer: \"consolidation confidence states (D5 \xA76.2, \xA76.3); policy confidence block (D6\
  \ \xA77.1)\"}\n  patterns_state:\n    description: \"Member property of ConfidenceState: a state of\
  \ the patterns source.\"\n    annotations: {ci:consumer: \"consolidation confidence states (D5 \xA7\
  6.2, \xA76.3); policy confidence block (D6 \xA77.1)\"}\n  local_llm_state:\n    description: \"Member\
  \ property of ConfidenceState: a state of the local_llm source.\"\n    annotations: {ci:consumer: \"\
  consolidation confidence states (D5 \xA76.2, \xA76.3); policy confidence block (D6 \xA77.1)\"}\n  agent_state:\n\
  \    description: \"Member property of ConfidenceState: a state of the agent source.\"\n    annotations:\
  \ {ci:consumer: \"consolidation confidence states (D5 \xA76.2, \xA76.3); policy confidence block (D6\
  \ \xA77.1)\"}\n  local_llm_judge_state:\n    description: \"Member property of ConfidenceState: a state\
  \ of the local_llm_judge source.\"\n    annotations: {ci:consumer: \"consolidation confidence states\
  \ (D5 \xA76.2, \xA76.3); policy confidence block (D6 \xA77.1)\"}\n  rules_state:\n    description: \"\
  Member property of ConfidenceState: a state of the rules source.\"\n    annotations: {ci:consumer: \"\
  consolidation confidence states (D5 \xA76.2, \xA76.3); policy confidence block (D6 \xA77.1)\"}\n  verifiers_state:\n\
  \    description: \"Member property of ConfidenceState: a state of the verifiers source.\"\n    annotations:\
  \ {ci:consumer: \"consolidation confidence states (D5 \xA76.2, \xA76.3); policy confidence block (D6\
  \ \xA77.1)\"}\n  author_markup_state:\n    description: \"Member property of ConfidenceState: a state\
  \ of the author_markup source.\"\n    annotations: {ci:consumer: \"consolidation confidence states (D5\
  \ \xA76.2, \xA76.3); policy confidence block (D6 \xA77.1)\"}\n  consolidation_drop:\n    description:\
  \ \"Member property of DropReason: a drop consolidation decides after keying, never keying or parse.\"\
  \n    annotations: {ci:consumer: \"consolidation's drops after keying (consolidate/assemble.py); keying's\
  \ coverage test (tests/core/test_dispatch.py) covers the other members\"}\n\nclasses:\n  # ---- nested\
  \ classes of the JSONB columns (D3 \xA76) ----\n  InterventionRefs:\n    description: >-\n      `ops.intervention.refs`:\
  \ the ids an intervention names, by what they reference (D3 \xA76.3). An\n      extract or adjudicate\
  \ intervention names its observations (a claim_proposal or judgment); a\n      direction names nothing,\
  \ its text being the body.\n    annotations: {ci:store: nested, ci:payload: intervention_refs}\n   \
  \ attributes:\n      observations: {range: Offset, multivalued: true, annotations: {ci:py_default: MISSING},\
  \ description: The observations it wrote (kb.observation ids).}\n      golden_pass: {range: Offset,\
  \ description: The golden pass it wrote (eval.golden_pass id).}\n      schema_version: {range: Offset,\
  \ description: The schema version it proposed (meta.schema_version id).}\n      guideline_version: {range:\
  \ Offset, description: The guideline version it proposed (meta.guideline_version id).}\n      policy_version:\
  \ {range: Offset, description: The policy version it proposed (ops.policy_version id).}\n      experiment:\
  \ {range: Offset, description: The experiment it decided (ops.experiment id).}\n  TaskCost:\n    description:\
  \ >-\n      `ops.task.cost`.\n    annotations: {ci:store: nested, ci:payload: task_cost, ci:py_name:\
  \ Cost}\n    attributes:\n      wall_ms: {range: Offset, required: true, description: Wall time in milliseconds;\
  \ every task has one.}\n      gpu_ms: {range: Offset, description: GPU time in milliseconds.}\n    \
  \  tokens_in: {range: Offset, description: Model input tokens.}\n      tokens_out: {range: Offset, description:\
  \ Model output tokens.}\n      model: {description: The model that spent them.}\n  TaskError:\n    description:\
  \ A failed task's detail, and an agent task's first rejected submission (D3 \xA74).\n    annotations:\
  \ {ci:store: nested}\n    attributes:\n      message: {description: The failure message.}\n      detail:\
  \ {range: Json, description: Structured failure detail., annotations: {ci:null: json}}\n  TriggerMetrics:\n\
  \    description: The metric values the triggering policy rule saw, exactly as evaluated (D3 \xA76.3).\n\
  \    annotations: {ci:store: nested, ci:payload: trigger_metrics}\n    attributes:\n      values: {range:\
  \ Json, description: Metric name to value., annotations: {ci:null: json}}\n  PolicyAction:\n    description:\
  \ >-\n      `ops.policy_rule.action`: a named configuration `<method>/<name>`, a limit, then.\n    annotations:\
  \ {ci:store: nested, ci:payload: policy_action}\n    attributes:\n      method: {required: true, pattern:\
  \ \"^[a-z][a-z0-9_.]*/[A-Za-z0-9_.-]+$\", description: \"A named configuration, <method>/<name>.\"}\n\
  \      limit: {range: integer, minimum_value: 1, description: The most tasks the rule creates per iteration;\
  \ absent means no rule-specific cap.}\n      then: {range: PolicyThen, required: true, description:\
  \ Whether the chain stops or continues.}\n  InterventionTarget:\n    description: >-\n      `ops.intervention.target`;\
  \ a `promotion` targets the run it promotes. `ref` is the target's\n      key, or its id's decimal text\
  \ for a target named by id (a run): the kind says which.\n    annotations: {ci:store: nested, ci:payload:\
  \ intervention_target}\n    attributes:\n      kind: {range: InterventionTargetKind, required: true,\
  \ description: The target's kind.}\n      ref: {range: NonEmpty, required: true, description: The target's\
  \ key or id.}\n  MentionRef:\n    description: >-\n      A mention by its task and ordinal; the task\
  \ is absent inside the same task.\n    annotations: {ci:store: nested}\n    attributes:\n      task:\
  \ {range: Id, description: The task holding it; absent for the same task.}\n      ordinal: {range: Offset,\
  \ required: true, description: Its ordinal in that task.}\n  ClaimQualifiers:\n    description: >-\n\
  \      kb.claim.qualifiers: the core qualifiers stored nested (hedge, conditions, scope, valid_time)\n\
  \      and the schema qualifiers, by prefixed name (D3 \xA76.1).\n    annotations: {ci:store: nested,\
  \ ci:sql_visible: core:conditions}\n    attributes:\n      hedge: {range: PhraseValue, description:\
  \ \"The hedge qualifier, stored under core:hedge.\"}\n      conditions: {range: Condition, description:\
  \ \"The condition tree under core:conditions; its claim nodes carry claim keys.\"}\n      scope: {range:\
  \ StoredScope, description: \"The stored scope, under core:scope.\"}\n      valid_time: {range: IntervalValue,\
  \ description: \"The valid time, under core:valid_time.\"}\n  Completeness:\n    description: A claim's\
  \ completeness counts (kb.claim.completeness).\n    annotations: {ci:store: nested}\n    attributes:\n\
  \      unresolved_symbols: {range: integer, description: Symbols left unresolved.}\n      phrase_conditions:\
  \ {range: integer, description: Conditions kept as phrases.}\n  SegmentAttrs:\n    description: A segment's\
  \ author markup (D1 \xA73.2); id is read by D3 \xA79's queries.\n    annotations: {ci:store: nested,\
  \ ci:sql_visible: id}\n    attributes:\n      id: {description: The author's id of the block.}\n   \
  \   classes: {multivalued: true, description: The block's classes.}\n  MacroTable:\n    description:\
  \ A rendition's macro table (D4 M01), name to macro definition.\n    annotations: {ci:store: nested}\n\
  \    attributes:\n      macros: {range: Json, description: Macro name to definition., annotations: {ci:null:\
  \ json}}\n  FrameEntries:\n    description: A citation frame (D1 \xA710.3), each sentence id to its\
  \ locator and canonical text.\n    annotations: {ci:store: nested, ci:payload: citation_frame, ci:py_type:\
  \ CitationFrame}\n    attributes:\n      entries: {range: FrameEntry, multivalued: true, inlined: true,\
  \ description: The cited sentences.}\n  FrameEntry:\n    description: One cited sentence of a frame.\n\
  \    annotations: {ci:store: nested}\n    attributes:\n      sentence: {identifier: true, range: SentenceId,\
  \ description: The sentence id.}\n      locator: {range: Locator, required: true, description: The sentence's\
  \ locator.}\n      text: {required: true, description: Its canonical text.}\n  GoldenBatchPayload:\n\
  \    description: >-\n      A golden pass's authored batch with one version of its citation frame (`eval.golden_pass`\
  \ and\n      `eval.citation_frame`, D3 \xA77): the shape the pass's `payload_schema_id` names for both.\n\
  \    annotations: {ci:store: nested, ci:payload: golden_batch}\n    attributes:\n      batch: {range:\
  \ Batch, required: true, annotations: {ci:py_type: AuthoredBatch}, description: \"The model-facing batch\
  \ as authored (pass c: as adjudicated).\"}\n      citation_frame: {range: FrameEntries, required: true,\
  \ description: One version of the pass's citation frame.}\n\n  # ---- observation payloads (D3 \xA7\
  6.2), one class per kind ----\n  SpanPayload:\n    abstract: true\n    description: A payload span in\
  \ the rendition's canonical text.\n    annotations: {ci:store: nested, ci:invariant: \"ordered(start,\
  \ end)\"}\n    attributes:\n      start: {range: Offset, required: true, description: Start offset.}\n\
  \      end: {range: Offset, required: true, description: End offset.}\n  LabelScore:\n    description:\
  \ A label with its score.\n    annotations: {ci:store: nested}\n    attributes:\n      label: {required:\
  \ true, description: The label.}\n      score: {range: Score, required: true, description: \"The score\
  \ in [0, 1].\"}\n  GroupScore:\n    is_a: LabelScore\n    description: >-\n      The label an attribute\
  \ group chose for a mention, with its score, keyed by the group (D2 \xA75's\n      span attribute groups:\
  \ one enum with ci:extract attribute each).\n    annotations: {ci:store: nested}\n    attributes:\n\
  \      group: {identifier: true, description: The attribute group.}\n  SynthesizedClaim:\n    description:\
  \ >-\n      The claim a block's containment states (the source profile's `details_kinds.synthesize`).\n\
  \    annotations: {ci:store: nested}\n    attributes:\n      predicate: {range: PrefixedName, required:\
  \ true, description: The prefixed predicate.}\n      object: {any_of: [{range: Entity}, {range: Value}],\
  \ required: true, description: The object., annotations: {ci:py_name: Object}}\n      evidence: {range:\
  \ Evidence, multivalued: true, required: true, minimum_cardinality: 1, inlined_as_list: true, description:\
  \ The evidence.}\n  AuthorMarkupPayload:\n    description: Author markup on a segment (M01).\n    annotations:\
  \ {ci:store: nested, ci:payload: author_markup}\n    attributes:\n      markup: {range: MarkupKind,\
  \ required: true, description: The markup's kind.}\n      value: {range: Json, required: true, description:\
  \ The markup's value., annotations: {ci:null: json}}\n      target: {description: The link target.}\n\
  \      synthesize: {range: SynthesizedClaim, description: The claim the block's containment states.}\n\
  \  MentionPayload:\n    is_a: SpanPayload\n    description: A mention (M05-M07, M09).\n    annotations:\
  \ {ci:payload: mention}\n    attributes:\n      label: {required: true, description: The class label.}\n\
  \      text: {required: true, description: The mention text.}\n      attributes: {range: GroupScore,\
  \ multivalued: true, inlined: true, annotations: {ci:py_type: \"dict[str, LabelScore]\", ci:py_default:\
  \ MISSING}, description: Each attribute group to the label it chose and its score.}\n      math_ref:\
  \ {range: SegmentKey, description: \"The segment key of the math span a mention lies in (D4 M06, M09).\"\
  }\n      math: {range: Json, description: M09's decoration of a symbol occurrence., annotations: {ci:null:\
  \ json, ci:py_type: \"dict[str, JsonValue]\"}}\n  LabelledSpan:\n    is_a: SpanPayload\n    description:\
  \ A labelled span of a relation.\n    annotations: {ci:store: nested}\n    attributes:\n      label:\
  \ {required: true, description: The label.}\n  RelationPayload:\n    description: A relation between\
  \ two spans.\n    annotations: {ci:store: nested, ci:payload: relation}\n    attributes:\n      label:\
  \ {required: true, description: The relation label.}\n      head: {range: LabelledSpan, required: true,\
  \ description: The head span.}\n      tail: {range: LabelledSpan, required: true, description: The tail\
  \ span.}\n      joint: {range: boolean, description: Extracted jointly.}\n      feasible: {range: boolean,\
  \ description: Feasible under the schema.}\n  RecordField:\n    is_a: SpanPayload\n    description:\
  \ A field of a record.\n    annotations: {ci:store: nested}\n    attributes:\n      text: {required:\
  \ true, description: The field text.}\n      score: {range: Score, required: true, description: The\
  \ score.}\n  RecordPayload:\n    description: A record structure.\n    annotations: {ci:store: nested,\
  \ ci:payload: record}\n    attributes:\n      structure: {required: true, description: The structure\
  \ name.}\n      fields: {range: Json, required: true, description: Field name to its spans., annotations:\
  \ {ci:null: json, ci:py_type: \"dict[str, tuple[RecordField, ...]]\"}}\n      anchor: {range: Json,\
  \ description: The record's anchor., annotations: {ci:null: json}}\n  AttributePayload:\n    description:\
  \ An attribute of a mention.\n    annotations: {ci:store: nested, ci:payload: attribute}\n    attributes:\n\
  \      mention_ref: {range: MentionRef, required: true, description: The mention.}\n      group: {required:\
  \ true, description: The attribute group.}\n      value: {range: Json, required: true, description:\
  \ The value., annotations: {ci:null: json}}\n  ClassificationPayload:\n    description: A classification\
  \ of a segment.\n    annotations: {ci:store: nested, ci:payload: classification}\n    attributes:\n\
  \      task: {required: true, description: The classification task.}\n      labels: {range: LabelScore,\
  \ multivalued: true, required: true, inlined_as_list: true, description: The labels.}\n      feasible:\
  \ {range: boolean, description: Feasible under the schema.}\n      violations: {range: Json, description:\
  \ Violations., annotations: {ci:null: json}}\n  ValuePayload:\n    description: A parsed value (M11).\n\
  \    annotations: {ci:store: nested, ci:payload: value}\n    attributes:\n      value: {range: Value,\
  \ required: true, description: The stored value.}\n      parse_error: {description: The parse error.}\n\
  \      math_kind: {range: MathKind, description: The typed start symbol that read the span.}\n  MentionAt:\n\
  \    is_a: SpanPayload\n    description: >-\n      A mention ref with the mention's offsets, so a reused\
  \ task's refs match by offsets.\n    annotations: {ci:store: nested}\n    attributes:\n      mention_ref:\
  \ {range: MentionRef, required: true, description: The mention.}\n  ScopePayload:\n    is_a: SpanPayload\n\
  \    description: A binding site and its scope (M13).\n    annotations: {ci:payload: scope}\n    attributes:\n\
  \      mention_ref: {range: MentionRef, required: true, description: The mention.}\n      binding_site:\
  \ {range: MentionAt, required: true, description: The binding site.}\n      scope_segment: {range: NonEmpty,\
  \ required: true, description: The scope segment's key.}\n      extent: {range: ScopeExtent, required:\
  \ true, description: The extent.}\n      binding: {range: BindKind, description: The binding kind.}\n\
  \      reopens: {range: MentionAt, description: The site it reopens.}\n  NewEntity:\n    description:\
  \ A new entity a link proposes.\n    annotations: {ci:store: nested}\n    attributes:\n      type: {required:\
  \ true, description: The entity class.}\n      label: {required: true, description: The label.}\n  LinkPayload:\n\
  \    description: >-\n      An entity-link candidate: the mention (M14) or the pair (M15), and the candidate\
  \ entity's key\n      or the new entity it proposes, exactly one of each.\n    annotations: {ci:store:\
  \ nested, ci:payload: link, ci:invariant: \"exactly_one(mention_ref, pair); exactly_one(candidate, new)\"\
  }\n    attributes:\n      mention_ref: {range: MentionRef, description: The mention (M14).}\n      pair:\
  \ {multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2, annotations: {ci:py_default: MISSING},\
  \ description: The pair (M15).}\n      candidate: {range: NonEmpty, description: The candidate entity's\
  \ key.}\n      new: {range: NewEntity, description: The new entity the link proposes instead.}\n   \
  \   score: {range: Score, required: true, description: The score.}\n      features: {range: Json, required:\
  \ true, description: The features., annotations: {ci:null: json, ci:py_type: \"dict[str, JsonValue]\"\
  }}\n      rank: {range: integer, description: The rank.}\n  RejectedItem:\n    description: An item\
  \ a submission rejected.\n    annotations: {ci:store: nested}\n    attributes:\n      item: {range:\
  \ Json, required: true, description: The item., annotations: {ci:null: json}}\n      reason: {required:\
  \ true, description: Why.}\n  ClaimProposalPayload:\n    description: >-\n      A stored batch with\
  \ its derivation (R06, DA-009): the schema version whose compiled models\n      derived it, always;\
  \ for authored proposals also the batch as written, its frame and the\n      version of the quote cascade\
  \ that located it, the three together. A derived claim's\n      `derived_from` and `rule` are on the\
  \ claim itself (M23).\n    annotations:\n      ci:store: nested\n      ci:payload: claim_proposal\n\
  \      ci:invariant: \"together(authored, citation_frame, cascade_version)\"\n    attributes:\n    \
  \  batch: {range: Batch, required: true, description: The stored batch.}\n      schema_version:\n  \
  \      required: true\n        pattern: \"^[0-9a-f]{64}$\"\n        description: The schema-version\
  \ hash (D2 \xA72) whose compiled models derived the stored batch.\n      authored: {range: Batch, description:\
  \ The batch as authored., annotations: {ci:py_type: AuthoredBatch}}\n      citation_frame: {range: FrameEntries,\
  \ description: Its citation frame.}\n      cascade_version: {range: NonEmpty, description: \"The quote\
  \ cascade's version that located an authored batch (D4 \xA74.3).\"}\n      rationale: {description:\
  \ The rationale.}\n      rejected: {range: RejectedItem, multivalued: true, inlined_as_list: true, description:\
  \ Rejected items., annotations: {ci:py_default: MISSING}}\n  JudgmentTarget:\n    description: >-\n\
  \      What a judgment is about: an observation by its id's decimal text, or a claim or group by its\n\
