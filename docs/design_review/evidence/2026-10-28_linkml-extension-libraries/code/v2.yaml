id: https://example.org/p
name: p
prefixes: {linkml: https://w3id.org/linkml/, p: https://example.org/p/}
default_prefix: p
imports: [linkml:types]
default_range: string
classes:
  Obs:
    attributes:
      id: {identifier: true}
      outcome: {range: OutcomeV2}
      note: {}
      detail: {range: Detail, inlined: true}
      values: {range: Value, multivalued: true, inlined_as_list: true}
  Detail:
    attributes:
      token_count: {range: integer}
  Value:
    abstract: true
    attributes:
      t: {designates_type: true, range: string}
  NumberValue:
    is_a: Value
    attributes:
      num: {range: decimal}
  TextValue:
    is_a: Value
    attributes:
      text: {}
enums:
  OutcomeV2:
    permissible_values: {succeeded: {}, failed: {}}
