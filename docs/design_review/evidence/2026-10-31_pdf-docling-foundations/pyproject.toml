[project]
name = "pdf-docling-foundations"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "docling-core==2.103.1",
    "pydantic==2.14.1",
    "jsonschema==4.26.0",
    "sqlalchemy==2.1.5",
    "sympy==1.14.0",
    "lark==1.3.1",
    "psycopg[binary]==3.3.6",
    "docling[asr,easyocr,htmlrender,ocrmac,onnxruntime,rapidocr,remote-serving,tesserocr,vlm,xbrl]==2.145.0",
]
[tool.uv]
package = false
add-bounds = "exact"
constraint-dependencies = ["docling==2.145.0"]
