[project]
name = "corpus-structure-dev"
version = "0.0.0"
description = "The uv root: repo scripts, their tests and the dev tools. Product Python packages join as workspace members."
requires-python = ">=3.14,<3.15"
dependencies = ["corpus-evidence", "corpus-structure"]

# Add product packages as members (e.g. members = ["python/*"]) and list them in `dependencies`
# with `[tool.uv.sources] <name> = { workspace = true }`, so the root environment tests them.
[tool.uv.workspace]
members = ["tools/evidence", "python/corpus-structure"]

[tool.uv.sources]
corpus-evidence = { workspace = true }
corpus-structure = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "pyrefly==1.4.0",
    "hypothesis==6.170.12",
    "jsonschema==4.26.0",
    "hypothesis-jsonschema==0.23.2",
    "types-regex==2026.9.29.20261017",
    "linkml==1.12.1",
    "cssselect==1.6.0",
    "types-pyyaml==6.0.12.20260906",
    "types-jsonschema==4.26.0.20261006",
    "scipy-stubs==1.18.1.1",
    "types-html5lib==1.1.11.20260518",
]

[tool.uv]
package = false
# `uv add` writes an exact `==` pin (AGENTS.md, Dependencies).
add-bounds = "exact"

[tool.pytest.ini_options]
testpaths = ["tests", "python/corpus-structure/tests"]
# importlib mode: the root and package `tests/` trees cannot collide on module names.
addopts = ["--strict-markers", "--strict-config", "-q", "--import-mode=importlib"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
src = ["scripts", "tools/evidence/src", "python/corpus-structure/src"]
target-version = "py314"
# Fixtures are analyzer input; docs may contain illustrative code fences. A subdirectory that is a
# separate Python project with its own environment (conventionally under `services/`) is excluded.
extend-exclude = [".claude/skills", "target", "docs", "services"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["scripts", "tests", "tools", "python", "domains"]
project-excludes = ["fixtures/**", ".claude/**", "**/target/**"]
search-path = ["scripts", "tools/evidence/src", "python/corpus-structure/src", "python/corpus-structure/tests"]
site-package-path = [".venv/lib/python3.14/site-packages"]
