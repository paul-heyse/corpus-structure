[project]
name = "corpus-structure-dev"
version = "0.0.0"
description = "The uv root: repo scripts, their tests and the dev tools. Product Python packages join as workspace members."
requires-python = ">=3.14,<3.15"
dependencies = [
    "astroid==4.3.4",
    "corpus-evidence",
    "corpus-structure",
    "dipo==0.2.1",
    "griffe==2.4.1",
    "libcst==1.9.0",
    "maverick-coref==1.0.7",
    "pytorch-lightning==2.6.6",
    "sentencepiece==0.2.0",
    "tensorboard==2.18.0",
    "ty==0.0.102",
]

# Add product packages as members (e.g. members = ["python/*"]) and list them in `dependencies`
# with `[tool.uv.sources] <name> = { workspace = true }`, so the root environment tests them.
[tool.uv.workspace]
members = ["tools/evidence", "python/corpus-structure"]

[tool.uv.sources]
corpus-evidence = { workspace = true }
corpus-structure = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.4",
    "pyrefly==1.4.0",
    "hypothesis==6.170.12",
    "jsonschema==4.26.0",
    "hypothesis-jsonschema==0.23.2",
    "types-regex==2026.9.29.20261017",
    "linkml==1.12.1",
    "types-pyyaml==6.0.12.20260906",
    "types-jsonschema==4.26.0.20261006",
    "scipy-stubs==1.18.1.1",
    "pytest-reportlog==1.0.0",
    "types-networkx==3.6.1.20261029",
    "pytest-xdist==3.8.0",
]

[tool.uv]
# Docling Slim caps its CLI dependency below 0.28. Keep this override scoped to the
# qualified workspace until Docling Slim declares compatibility with the selected pin.
# Protobuf: Maverick/DiPO CUDA paths tested with6.33.6; see ADR-0091.
override-dependencies = ["typer==0.28.0", "protobuf==6.33.6"]
package = false
# `uv add` writes an exact `==` pin (AGENTS.md, Dependencies).
add-bounds = "exact"

[tool.pytest.ini_options]
testpaths = ["tests", "python/corpus-structure/tests"]
# importlib mode: the root and package `tests/` trees cannot collide on module names.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-q",
    "--import-mode=importlib",
    # The managed route sizes explicit IDs; plain pytest retains auto.
    "-n", "auto",
    "--dist=loadgroup",
    # A fatal worker ends its attempt; receipts retain unresolved cases for explicit recovery.
    "--max-worker-restart=0",
    "-m", "not shared_cluster_fault",
]
markers = [
    "db: uses the PostgreSQL test database",
    "shared_cluster_fault: exclusive serial controls that mutate shared PostgreSQL authentication",
]
pythonpath = ["scripts", "python/corpus-structure/tests"]

[tool.ruff]
line-length = 100
src = ["scripts", "tools/evidence/src", "python/corpus-structure/src"]
target-version = "py314"
# Fixtures are analyzer input; docs may contain illustrative code fences. A subdirectory that is a
# separate Python project with its own environment (conventionally under `services/`) is excluded.
extend-exclude = [".claude/skills", "target", "docs", "services"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Formatting owns line layout, including lines that cannot be usefully split.
ignore = ["E501"]

[tool.ruff.format]
# Frozen migration bytes are historical inputs; format prospective wrappers before freezing.
exclude = ["python/corpus-structure/semantic_alembic/versions/*.py"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["conftest.py", "scripts", "tests", "tools", "python", "domains"]
project-excludes = ["fixtures/**", ".claude/**", "**/target/**"]
search-path = ["scripts", "tools/evidence/src", "python/corpus-structure/src", "python/corpus-structure/tests"]
site-package-path = [".venv/lib/python3.14/site-packages"]
