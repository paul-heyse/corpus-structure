# corpus-structure: the dedicated cluster 18/corpus (D3 §13). Installed into
# /etc/postgresql/18/corpus/conf.d/ by scripts/pg_provision.sh; edit here, then `just db-provision`.

listen_addresses = ''                      # socket only; peer authentication
port = 5434
max_connections = 100
# Full forward-migration bootstrap holds many temporary validation relation locks.
max_locks_per_transaction = 256

shared_preload_libraries = 'pg_textsearch,pg_stat_statements,auto_explain'

# Memory (host: 32 cores, 188 GB RAM shared with GPU work and the main cluster)
shared_buffers = 8GB
effective_cache_size = 64GB
work_mem = 64MB
maintenance_work_mem = 8GB
autovacuum_work_mem = 1GB

# I/O and WAL (NVMe)
io_method = io_uring
effective_io_concurrency = 256
maintenance_io_concurrency = 256
random_page_cost = 1.1
wal_compression = zstd
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = off                   # data is regenerable (operator, 2026-10-28)

# Planner and parallelism
jit = off                                  # short queries and bulk writes
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# Text search
default_text_search_config = 'pg_catalog.english'

# Statistics and diagnostics (pg_activity, pgBadger on demand)
compute_query_id = on
track_io_timing = on
pg_stat_statements.track = all
auto_explain.log_min_duration = '1s'
log_min_duration_statement = 250ms
# Source artifacts already have protected custody; never duplicate binary/JSON payloads
# into duration/error/auto_explain logs or convert large binary parameters to log text.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
auto_explain.log_parameter_max_length = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
